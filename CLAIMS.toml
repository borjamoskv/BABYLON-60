status = "verified_in_memory"
evidence_level = "L2_IMPLEMENTATION"
notes = "RFC 9942 (https://www.rfc-editor.org/rfc/rfc9942.html) requires a tagged COSE_Sign1 (#6.18), protected vds (395), unprotected vdp (396) carrying Merkle inclusion proofs, and an RFC 9162 tree-hash payload. src/receipt.rs defines LABEL_RECEIPTS/LABEL_VDS/LABEL_VDP/VDS_RFC9162_SHA256 but never emits them. It serializes with coset to_vec() (untagged) and attaches a halt map instead of a Merkle root. The evidence test signs and verifies with the same in-process signer object. No RFC 8032 or RFC 9942 known-answer vectors and no independent COSE verifier are exercised. The claim id is kept for compatibility. Downgraded from verified on 2026-11-25."
component = "00_ABZU_KERNEL"

