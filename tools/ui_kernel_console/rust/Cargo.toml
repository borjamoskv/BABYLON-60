[package]
name = "babylon60-exec-receipt"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license-file = "../../../LICENSE"
description = "Emisor y verificador de referencia, en Rust, del recibo de ejecución de tools/ui_kernel_console (propuesta del cliente; no es un formato del kernel)"

# Workspace propio: el crate no entra en el workspace raíz ni modifica su Cargo.toml ni su Cargo.lock.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "b60-exec-receipt"
path = "src/main.rs"

[features]
default = []
# Binding WebAssembly: solo expone verificación (una página no debe custodiar claves privadas).
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

# Versiones exactas: las mismas que fija el Cargo.lock raíz del kernel.
[dependencies]
blake3 = "=1.8.5"
curve25519-dalek = "=4.1.3"
ed25519-dalek = "=2.2.0"
serde_json = "=1.0.151"
wasm-bindgen = { version = "=0.2.126", optional = true }
# Medir la entrada JS antes de copiarla a memoria de wasm (misma versión que wasm-bindgen).
js-sys = { version = "=0.3.103", optional = true }
