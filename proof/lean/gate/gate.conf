# Clasificación explícita de fuentes .lean que NO son raíz de lean_lib/lean_exe.
# Toda fuente no listada aquí y no declarada en lakefile.toml => FAIL_ORPHAN.

# Fixtures negativos: deben fallar SOLO por rechazo semántico de `decide`.
NEGATIVE="BabylonAutoTrace BabylonStressCorrupt"
NEGATIVE_MARKER='Tactic `decide` proved that the proposition'

# Fuera del gate (declarado, no silencioso). Requiere ProofWidgets + npm.
QUARANTINE="HolographicPoC"

# Toolchain exigido (fail-stop si difiere de lean-toolchain).
EXPECTED_TOOLCHAIN="leanprover/lean4:v4.34.0-rc2"
