pipelineId: orchestration_pipeline
description: Sample orchestration pipeline
runner: 'airflow'
owner: 'data-eng-team'
modelVersion: '1.0'
tags:
  - "job:datacloud:antigravity"
defaults:
  projectId: '{{ project }}'
  location: '{{ region }}'
  executionConfig:
    retries: 1

triggers:
  - schedule:
      interval: '0 2 * * *'  # 2 AM daily
      startTime: '2025-11-01T00:00:00'
      endTime: '2026-12-01T00:00:00'
      catchup: false
      timezone: 'UTC'

# Add your jobs here
actions:
  - python:
      name: run_sample_task
      mainFilePath: scripts/sample_task.py
      pythonCallable: sample_run
      engine:
        local: {}

