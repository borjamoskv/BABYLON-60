# Transduccion estructural v3 - Isomorfismos: Babilonia / organismos / sistemas
# Fuente: documento de trabajo 2026-07-14. Salida: solo estructura.
# Cada isomorfismo => order_parameter (colapsa) gobernado por control_parameter (cruza umbral),
# clasificado por tipo de bifurcacion y con senal de alarma temprana (EWS) generica + proxy babilonico.

meta:
  frame: [general_systems_theory, cybernetics, scaling_laws, dynamical_systems, bifurcation_theory]
  morphism_ladder: "iso > homo > elem_equiv"   # isomorfia > homomorfia > equivalencia elemental
  thesis: "estructura compartida => modo de fallo compartido => misma bifurcacion => mismas alarmas tempranas"
  strongest_case: I01_red_hidraulica   # unica cercana a biyeccion: comparte ecuaciones
  invariant_generator: "sistema abierto lejos del equilibrio + flujo(materia,energia,info) + restriccion + seleccion => espacio de soluciones estrecho => convergencia"
  dynamical_axes: "colapso = order_parameter -> 0 (o salto a estado bajo) cuando control_parameter cruza umbral"
  failure_class_legend:
    conductance_collapse: "perdida de conductancia / percolacion en la red de reparto"
    redundancy_loss: "degeneracion -> 1; fragilidad de punto unico"
    error_catastrophe: "deslocalizacion de la informacion (Eigen; ~transcritica)"
    gradient_degeneration: "informacion posicional -> 0"
    model_obsolescence: "perdida de seguimiento; prior obsoleto"
    desynchronization: "transicion de Kuramoto (K < K_c)"
    control_instability: "Hopf / realimentacion positiva desbocada"
    reservoir_depletion: "vaciado del integrador central"
    transmission_break: "estado absorbente en 0"
    slow_variable_tipping: "pliegue (saddle-node) con histeresis; irreversible"
  bifurcation_taxonomy:
    saddle_node_fold: [I10]
    hopf: [I07]
    error_threshold_transcritical: [I03]
    kuramoto_sync: [I06]
    percolation: [I01, I02]
    tracking_loss_nonautonomous: [I05]
    absorbing_state_boundary: [I08, I09]
    structural_degeneration: [I04]
  ews_note: "critical slowing down (autocorrelacion y varianza crecientes) aplica a codim-1 con autovalor -> eje: I10 (fold), I07 (Hopf), I03 (umbral de error). NO aplica limpio a percolacion (I01,I02: fluctuaciones de tamano de cluster), a estado absorbente (I08,I09: tendencia/conteo, no ruido critico), ni a perdida de seguimiento (I05: sesgo sistematico, no ruido)."

isomorphisms:

  - id: I01
    tag: red_hidraulica
    babylon: "canales ramificados Tigris/Eufrates: troncal -> distributario -> acequia"
    invariant: "arbol de transporte que llena el espacio; minima disipacion bajo servicio de area"
    analog: "circulatorio / xilema-floema / traqueas de insectos"
    class: {loop_type: transporte, timescale: medio}
    state_tensor: [caudal_Q, radio_conducto_r, presion_head, razon_de_ramificacion, nivel_jerarquico]
    physical_constraints:
      - "minima disipacion energetica (West-Brown-Enquist 1997)"
      - "fractal que llena el espacio; unidad terminal invariante"
      - "ley de Murray: r0^3 = r1^3 + r2^3"
      - "escala metabolica: B ~ M^(3/4)"
    collapse_vector:
      failure_class: conductance_collapse
      order_parameter: "fraccion_perfundida (area servida con caudal suficiente)"
      control_parameter: "tasa de azolvamiento -> r/r0"
      collapse_condition: "r/r0 < r_crit  =>  g < g_crit(demanda)"
      dynamics: "g ~ r^4 (Poiseuille); Q_deliv = g*deltaP"
      bifurcation:
        type: percolacion
        normal_form: "P_inf ~ (p - p_c)^beta   [p = fraccion de conductos abiertos]"
        critical_condition: "p < p_c  =>  desaparece el componente perfundido gigante"
        eigenvalue_at_threshold: "n/a (transicion geometrica, no espectral)"
        reversible: "si (el dragado restaura p)"
      early_warning:
        generic: "fluctuaciones crecientes del tamano de cluster; conductancia efectiva a la baja"
        babylon: "tramos de canal que dejan de recibir agua; frecuencia de dragado en aumento"
      babylon_pathology: "azolvamiento: sedimento estrecha la luz del canal"
      analog_pathology: "arteriosclerosis: estrechamiento de la luz vascular"
    rigor: near_iso   # comparte ecuaciones, no solo silueta

  - id: I02
    tag: base_60_redundancia
    babylon: "sistema sexagesimal; 60 = 2^2 * 3 * 5 (altamente compuesto)"
    invariant: "redundancia / degeneracion: muchos caminos -> un mismo resultado"
    analog: "codigo genetico degenerado; rutas metabolicas redundantes; representacion distribuida"
    class: {loop_type: reserva_redundante, timescale: medio}
    state_tensor: [divisores_de_la_base, exactitud_de_particion, grados_de_libertad_redundantes]
    physical_constraints:
      - "alta divisibilidad => particion/fraccion exacta => tolerancia a fallos"
      - "degeneracion = robustez frente a perturbacion"
    collapse_vector:
      failure_class: redundancy_loss
      order_parameter: "D = numero de caminos viables independientes"
      control_parameter: "poda / monocultivo (eliminacion de caminos)"
      collapse_condition: "D -> 1  (por debajo del umbral de conectividad/percolacion)"
      dynamics: "robustez(D) monotona creciente; D=1 => punto unico de fallo"
      bifurcation:
        type: percolacion_conectividad
        normal_form: "robustez ~ (D - D_c)   [esquematico; k-core / conectividad]"
        critical_condition: "caminos independientes < umbral de conectividad"
        eigenvalue_at_threshold: "n/a (transicion de conectividad)"
        reversible: "si (rediversificar cultivos/canales)"
      early_warning:
        generic: "sensibilidad creciente a una perturbacion unica"
        babylon: "proporcion de cebada -> 1 (monocultivo); cae la diversidad de cultivos"
      babylon_pathology: "dependencia de un solo cultivo / un solo canal"
      analog_pathology: "fragilidad por perdida de degeneracion; punto unico de fallo"
    rigor: homo

  - id: I03
    tag: cuneiforme_codigo_replicable
    babylon: "codigo discreto sobre arcilla durable, copiado a mano por generaciones"
    invariant: "codigo combinatorio replicable con correccion de error"
    analog: "ADN + polimerasa/ribosoma + reparacion"
    class: {loop_type: replicador, timescale: lento}
    mapping:
      tablilla: cromosoma
      inventario_de_signos: alfabeto_de_codones
      escriba: polimerasa_ribosoma
      edubba_escuela: maquinaria_de_correccion_de_errores
      recension_canonica: genoma_de_consenso
      desliz_de_copia: mutacion
      stemma_textual: filogenia
    state_tensor: [longitud_del_texto_L, fidelidad_de_copia_q, tasa_de_error_mu, tamano_del_inventario]
    physical_constraints:
      - "canal discreto => replicacion de alta fidelidad"
      - "correccion de error (escuela/autoridad) acota la deriva"
    collapse_vector:
      failure_class: error_catastrophe
      order_parameter: "phi_master (fraccion de la version/secuencia maestra)"
      control_parameter: "mu*L (tasa de error x longitud)"
      collapse_condition: "mu*L > ln(sigma)  =>  phi_master -> 0"
      dynamics: "d(phi)/dt = phi[(q^L)*sigma - phibar], q = 1 - mu  (cuasiespecies de Eigen)"
      bifurcation:
        type: umbral_de_error_transcritico
        normal_form: "phi' = phi[(q^L)sigma - phibar]"
        critical_condition: "mu*L = ln(sigma)  <=>  L_max = ln(sigma)/mu"
        eigenvalue_at_threshold: "autovalor de la secuencia maestra cruza 0 en el umbral"
        reversible: "si, si mu*L baja del umbral (reforzar correccion)"
      early_warning:
        generic: "varianza de secuencias en aumento; deriva de la version de consenso"
        babylon: "proliferacion de variantes textuales; recensiones divergentes antes de fijar/perder canon"
      babylon_pathology: "corrupcion acumulada de copias del canon"
      analog_pathology: "umbral de error de Eigen: la informacion se disuelve en ruido"
    rigor: homo

  - id: I04
    tag: notacion_posicional
    babylon: "valor por posicion: mismo signo = 1, 60, 3600 ..."
    invariant: "significado = f(simbolo, posicion)"
    analog: "informacion posicional; morfogenos (bandera francesa, Wolpert 1969)"
    class: {loop_type: lectura_posicional, timescale: rapido}
    state_tensor: [simbolo, indice_de_posicion, gradiente_de_morfogeno, umbral]
    physical_constraints:
      - "el valor se lee del lugar dentro del gradiente"
      - "interpretacion por umbrales sobre el gradiente"
    collapse_vector:
      failure_class: gradient_degeneration
      order_parameter: "I(posicion; destino)  [informacion mutua]"
      control_parameter: "|grad M| (pendiente del gradiente)"
      collapse_condition: "|grad M| -> 0  =>  I(posicion;destino) -> 0"
      dynamics: "destino = umbral(M(x)); si M plano o sin cero de referencia => decodificacion ambigua"
      bifurcation:
        type: degeneracion_estructural
        normal_form: "I(pos;destino) ~ |grad M|"
        critical_condition: "|grad M| -> 0  (informacion posicional se anula)"
        eigenvalue_at_threshold: "n/a (perdida de informacion, no bifurcacion local)"
        reversible: "si (restablecer referencia / cero posicional)"
      early_warning:
        generic: "error de asignacion posicional en aumento"
        babylon: "ambiguedad creciente en numeros sin cero: dependencia del contexto para desambiguar"
      babylon_pathology: "sin cero medial / sin cero terminal => casilla vacia ambigua"
      analog_pathology: "senal de frontera ambigua (cero o borde?) => desorganizacion morfologica"
    rigor: homo

  - id: I05
    tag: omina_modelo_predictivo
    babylon: "catalogos si-X-entonces-Y (Enuma Anu Enlil; extispicina hepatica)"
    invariant: "modelo generativo aprendido; memoria asociativa de priores"
    analog: "codificacion predictiva (Rao-Ballard 1999); memoria inmune adaptativa"
    class: {loop_type: predictor_feedforward, timescale: medio}
    state_tensor: [prior_P, senal_entrante, error_de_prediccion, mapa_antigeno_respuesta]
    physical_constraints:
      - "acumular priores; contrastar senal entrante => anticipar"
      - "percibir = minimizar sorpresa frente a modelo interno"
    collapse_vector:
      failure_class: model_obsolescence
      order_parameter: "evidencia_del_modelo (-sorpresa)"
      control_parameter: "deriva_ambiental / tasa_de_aprendizaje"
      collapse_condition: "deriva > adaptacion  =>  error de prediccion no acotado"
      dynamics: "P fija mientras el entorno deriva => KL(mundo || P) crece monotono"
      bifurcation:
        type: perdida_de_seguimiento_no_autonoma
        normal_form: "KL(mundo || P) crece si deriva > aprendizaje"
        critical_condition: "tasa de deriva > tasa de aprendizaje"
        eigenvalue_at_threshold: "n/a (sistema forzado no autonomo; sin punto fijo que bifurque)"
        reversible: "si (reaprender priores)"
      early_warning:
        generic: "sesgo sistematico creciente del error de prediccion (deriva, no ruido)"
        babylon: "presagios con tasa de acierto decreciente; glosas y adiciones correctivas"
      babylon_pathology: "presagios que ya no predicen"
      analog_pathology: "rigidez perceptiva ante lo nuevo (sobreajuste a prior obsoleto)"
    rigor: homo

  - id: I06
    tag: astronomia_periodica
    babylon: "funciones zigzag y escalon (Sistemas A/B, Neugebauer); Saros ~ 18 anos 11 dias"
    invariant: "descomposicion de un fenomeno complejo en periodicidades superpuestas"
    analog: "osciladores biologicos acoplados (circadiano, ciclo celular); analisis de Fourier"
    class: {loop_type: banco_de_osciladores, timescale: medio}
    state_tensor: [conjunto_de_periodos, fases, amplitudes]
    physical_constraints:
      - "senal compleja = suma de componentes periodicos"
      - "prediccion por recurrencia de ciclos (eclipses via Saros)"
    collapse_vector:
      failure_class: desynchronization
      order_parameter: "r = coherencia de fase (parametro de orden de Kuramoto)"
      control_parameter: "acoplamiento K frente a dispersion de frecuencias (detuning)"
      collapse_condition: "K < K_c  =>  r -> 0"
      dynamics: "Kuramoto: d(theta_i)/dt = w_i + (K/N)*sum_j sin(theta_j - theta_i)"
      bifurcation:
        type: transicion_de_sincronizacion_kuramoto
        normal_form: "r = |promedio(e^{i theta})|; r>0 sii K>K_c"
        critical_condition: "K_c = 2 / (pi * g(0))   [g = densidad de frecuencias, unimodal]"
        eigenvalue_at_threshold: "el modo coherente pierde estabilidad en K_c"
        reversible: "si (reacoplar; reforma calendarica)"
      early_warning:
        generic: "fluctuaciones de fase crecientes; r decreciente"
        babylon: "desviacion creciente calendario civil vs estacional; intercalacion mas frecuente y erratica"
      babylon_pathology: "desajuste calendarico (deriva de fase)"
      analog_pathology: "arritmia; perdida del ritmo circadiano"
    rigor: homo

  - id: I07
    tag: hammurabi_retroalimentacion
    babylon: "base de reglas condicionales; talion escala la pena a la ofensa"
    invariant: "control por retroalimentacion negativa proporcional al error"
    analog: "homeostasis; discriminacion inmune propio/ajeno graduada"
    class: {loop_type: controlador_feedback, timescale: rapido}
    state_tensor: [punto_de_consigna, desviacion_e, ganancia_de_correccion, retardo_tau]
    physical_constraints:
      - "detectar desviacion vs setpoint; corregir de forma proporcional al error"
      - "respuesta graduada a la magnitud de la transgresion"
    collapse_vector:
      failure_class: control_instability
      order_parameter: "1 / var(error de regulacion)"
      control_parameter: "G*tau (ganancia de lazo x retardo)"
      collapse_condition: "G*tau supera el margen de estabilidad  =>  bifurcacion de Hopf"
      dynamics: "linealizado: x' = -G*x(t - tau)"
      bifurcation:
        type: hopf
        normal_form: "x' = -G*x(t - tau);  caracteristica: lambda = -G*exp(-lambda*tau)"
        critical_condition: "G*tau = pi/2 ;  omega_c = pi/(2*tau)"
        eigenvalue_at_threshold: "par conjugado cruza el eje imaginario: lambda = +/- i*omega_c"
        reversible: "si (bajar ganancia o retardo)"
      early_warning:
        generic: "oscilaciones amortiguadas cada vez mas lentas (parte real -> 0); varianza creciente"
        babylon: "ciclos de castigo/represalia de amplitud creciente; respuesta legal sobre-reactiva"
      babylon_pathology: "justicia desbordada o rigida"
      analog_pathology: "tormenta inmune: homeostasis vuelta contra si; bucle fuera de control"
    rigor: homo

  - id: I08
    tag: templo_integrador_metabolico
    babylon: "economia redistributiva; zigurat acumula grano y lo reasigna"
    invariant: "integrador central que amortigua flujos frente a choques"
    analog: "metabolismo del superorganismo (colonia de hormigas; cuerpo)"
    class: {loop_type: integrador, timescale: rapido}
    state_tensor: [reserva_central_R, flujo_de_entrada, flujo_de_salida, capacidad_tampon]
    physical_constraints:
      - "buffer central estabiliza el suministro ante estacionalidad y choque"
    collapse_vector:
      failure_class: reservoir_depletion
      order_parameter: "R = reserva central"
      control_parameter: "flujo neto = salida - entrada"
      collapse_condition: "salida > entrada + R  =>  R -> 0"
      dynamics: "dR/dt = entrada - salida; agotamiento si dR/dt < 0 sostenido"
      bifurcation:
        type: colision_con_frontera
        normal_form: "R' = entrada - salida  (integrador lineal)"
        critical_condition: "integral(salida - entrada) > R0  =>  R = 0"
        eigenvalue_at_threshold: "0 (integrador puro; marginalmente estable, no bifurcacion local)"
        reversible: "si (reponer reserva)"
      early_warning:
        generic: "tendencia negativa sostenida de la reserva; tampon efectivo decreciente"
        babylon: "cae el grano almacenado; racionamiento; prestamos de grano en aumento"
      babylon_pathology: "colapso redistributivo en hambruna"
      analog_pathology: "fallo metabolico sistemico"
    rigor: homo

  - id: I09
    tag: canon_herencia
    babylon: "transmision escribal curada por autoridad (recension estandar)"
    invariant: "herencia con variacion y seleccion"
    analog: "filogenia; stemma textual"
    class: {loop_type: replicador_con_seleccion, timescale: lento}
    state_tensor: [acervo_de_informacion, tasa_de_variacion, presion_de_seleccion]
    physical_constraints:
      - "informacion discreta, copiada con error, curada por seleccion"
    deviation: "lamarckiana + horizontal + editable en 1 generacion (rompe la analogia darwiniana)"
    collapse_vector:
      failure_class: transmission_break
      order_parameter: "informacion retenida / continuidad de linaje"
      control_parameter: "fidelidad de transmision intergeneracional"
      collapse_condition: "fidelidad_intergen -> 0  =>  estado absorbente en 0"
      dynamics: "N_{t+1} = f_transmision * N_t; f<1 => N -> 0"
      bifurcation:
        type: estado_absorbente
        normal_form: "N_{t+1} = f*N_t"
        critical_condition: "f (razon de transmision) < 1 sostenida, o corte total en 1 generacion"
        eigenvalue_at_threshold: "autovalor de la recurrencia f cruza 1 por debajo"
        reversible: "no localmente (absorbente); solo por reintroduccion externa"
      early_warning:
        generic: "numero de portadores/copias decreciente; tasa de reproduccion del corpus < 1"
        babylon: "menos tablillas y aprendices por generacion; cierre de edubbas"
      babylon_pathology: "perdida del saber escribal"
      analog_pathology: "extincion de linaje; perdida de informacion"
    rigor: homo

  - id: I10
    tag: salinizacion_senescencia
    babylon: "riego sin drenaje + evaporacion arida => sal en la zona radicular"
    invariant: "acumulacion monotona de dano no reparado hasta cruzar umbral"
    analog: "senescencia; sobrepaso ecologico; punto de no retorno"
    class: {loop_type: acumulador_lento, timescale: muy_lento}
    state_tensor: ["concentracion_de_sal_S(t)", nivel_freatico, umbral_fisiologico]
    physical_constraints:
      - "desecho no excretable => dS/dt > 0 (monotona)"
      - "evaporacion concentra sal sin drenaje suficiente"
    evidence:
      trigo_vs_cebada: "trigo (sensible) cae frente a cebada (tolerante); trigo casi desaparece ~1700 a.C."
      texto: "menciones directas: la tierra se ha vuelto blanca"
      rendimiento_L_por_ha: {"~2400_aC": 2500, "~2100_aC": 1460, "~1700_aC": "<900"}   # Girsu/Lagash
      fuente: "Jacobsen & Adams 1958"
      caveat: "magnitud y peso relativo (sal vs politica/militar/gestion hidrica) en debate; la FORMA del proceso no"
    collapse_vector:
      failure_class: slow_variable_tipping
      order_parameter: "rendimiento y (produccion por hectarea)"
      control_parameter: "S(t) = sal acumulada (variable lenta, monotona)"
      collapse_condition: "S(t) > S_crit  =>  salto de pliegue (fold) al estado bajo; histeresis"
      dynamics: "fold: dy/dt = f(y, S), S sube lento; en S_c el estado alto desaparece (irreversible)"
      bifurcation:
        type: saddle_node_fold
        normal_form: "y' = S - y^2   [forma normal de pliegue, esquematica]"
        critical_condition: "S = S_c donde f=0 y df/dy=0 (los equilibrios chocan)"
        eigenvalue_at_threshold: "autovalor real -> 0 por el lado estable (critical slowing down)"
        reversible: "no (histeresis; recuperar exige S << S_c: drenaje/lavado costoso)"
      early_warning:
        generic: "critical slowing down: autocorrelacion y varianza del rendimiento crecen antes del salto"
        babylon: "PROXY archivistico observable: proporcion trigo/cebada cae (senal lenta y monotona)"
      babylon_pathology: "salinizacion irreversible; centro de gravedad se desplaza al norte (Babilonia/Asiria)"
      analog_pathology: "senescencia; colapso ecologico"
    rigor: homo   # nota: isomorfismo de FORMA dinamica (dano acumulado), no de ecuaciones

coupling:
  note: "grafo causal HIPOTETICO de cascada; direccion = el fallo de A acelera el de B"
  edges:
    - {from: I10, to: I08, mecanismo: "sal baja rendimiento => cae la reserva de grano"}
    - {from: I10, to: I01, mecanismo: "anegamiento y freatico alto => azolvamiento y perdida de drenaje"}
    - {from: I10, to: I02, mecanismo: "solo cebada tolerante => monocultivo => degeneracion cae"}
    - {from: I01, to: I08, mecanismo: "transporte esclerotico => el recurso no llega al centro"}
    - {from: I08, to: I09, mecanismo: "hambruna => no se sostienen las escuelas de escribas"}
    - {from: I08, to: I07, mecanismo: "colapso redistributivo => orden legal desbordado"}
    - {from: I03, to: I05, mecanismo: "canon corrupto => priores degradados => presagios fallan"}
    - {from: I06, to: I05, mecanismo: "desajuste calendarico => presagios mal fechados"}
    - {from: I02, to: I10, mecanismo: "monocultivo amplifica la fragilidad ante el dano lento"}
  driver: I10   # variable lenta que fija el reloj del colapso
  amplifier: I02   # la perdida de redundancia amplifica todo lo demas
  historical_cascade: [I10, I08, I02, I01, I09]   # sur sumerio 3er milenio -> desplazamiento al norte

convergence:
  cause: "3 condiciones concurrentes: (1) sistema abierto lejos del equilibrio; (2) throughput de materia/energia/informacion; (3) restriccion + seleccion"
  consequence: "espacio de soluciones viables estrecho => las arquitecturas convergen"
  recurring_architectures: [transporte_ramificado_que_llena_el_espacio, retroalimentacion_negativa, codigo_discreto_replicable, redundancia, dinamica_descompuesta_en_ciclos]
  laws:
    constructal_bejan: "para persistir, la configuracion de flujo evoluciona para facilitar acceso a sus corrientes (arbol: delta, pulmon, red de canales)"
    urban_scaling_bettencourt_west: "propiedades urbanas escalan con la poblacion en leyes de potencia, tan regulares como el metabolismo animal"

limits:
  where_mapping_breaks:
    - "agentes con intencion: ven el problema y cambian las reglas"
    - "herencia lamarckiana, horizontal y editable casi en tiempo real"
    - "sin cuello de botella reproductivo limpio que discipline la seleccion"
    - "fronteras porosas: sin membrana que defina al organismo"
  epistemic:
    multiple_realizability: "misma funcion =/= mismo mecanismo (corta en ambos sentidos)"
    honest_status: "casi todo = homomorfismo / equivalencia estructural; solo I01 (y la forma de I10) se acerca a isomorfismo pleno"
    dynamics_status: "bloques 'dynamics'/'bifurcation' son modelos cientificos reconocidos (I01,I03,I06,I07,I08,I10) o esquematicos (I02,I04,I05,I09); no ecuaciones ajustadas a datos babilonicos"
    ews_status: "las alarmas tempranas 'babylon' son proxies plausibles, no series medidas; la mejor evidenciada es trigo/cebada (I10)"
    value: "no prueba identidad; la estructura compartida genera predicciones de colapso que de otro modo no se ven"

refs:
  bertalanffy_1968: "General System Theory"
  wiener_1948: "Cybernetics"
  hofstadter_1979: "Godel, Escher, Bach"
  west_brown_enquist_1997: "Allometric scaling, Science 276:122"
  murray_1926: "Principle of minimum work, PNAS 12:207"
