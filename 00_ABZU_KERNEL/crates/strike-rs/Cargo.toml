[package]
name = "strike_rs"
version = "4.3.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false
description = "High-performance I/O and cryptographic primitives for BABYLON-60"
repository = "https://github.com/borjamoskv/BABYLON-60"
authors = ["Borja Moskv <borjamoskv@github.com>"]

[lib]
name = "strike_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.5"
petgraph = "0.7"
rusqlite = { version = "0.40.1", features = ["bundled"] }
signal-hook = "0.3.17"
pyo3 = { version = "0.29" }
libc = "0.2.186"
uuid = { version = "1.24.0", features = ["v5"] }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
futures = "0.3.30"
async-trait = "0.1.81"
tonic-web = "0.12"
prost = "0.13"
tonic = "0.12"
hex = "0.4.3"
tokio-stream = "0.1.19"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand = "0.10"
anyhow = "1.0.104"
dashmap = "6.2.1"
ciborium = "0.2.2"

[dev-dependencies]
proptest = "1.6.0"
pyo3 = { version = "0.29", features = ["auto-initialize"] }


[features]
extension-module = ["pyo3/extension-module"]

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }

[dependencies.iceoryx2]
version = "0.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.10.2"

