[package]
name = "nul-zk"
version = "4.3.0"
edition = "2021"
authors = ["Borja Moskv <borjamoskv@github.com>"]
description = "Sovereign Zero-Knowledge DSL compiler and Arkworks synthesizer for BABYLON-60"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/borjamoskv/BABYLON-60"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
ark-ff = "0.4.2"
ark-relations = { version = "0.4.0", default-features = false, features = ["std"] }
ark-bls12-381 = "0.4.0"
ark-groth16 = "0.6.0"
ark-snark = "0.4.0"
rand = "0.9.5"
