# LUNA_SOL_GAP_BENCHMARK Config v1 (Falsification Pre-registration)
experiment_name: "luna_ctm_falsification_v1"
task_corpus_path: "LUNA_SOL_GAP_BENCHMARK/benchmark/tasks/task_corpus.yaml"
results_dir: "LUNA_SOL_GAP_BENCHMARK/results"
reports_dir: "LUNA_SOL_GAP_BENCHMARK/reports"

# STRICT FALSIFICATION CONTROLS
model: "gpt-5-luna" # Keep model identical across test branches
sampling_seed: 42
evaluator: "logic_evaluator" # Fixed Oracle L

budget_constraints:
  max_iterations: 3
  budget_limit_tokens: 15000

branches:
  BASE:
    name: "baseline_single_pass"
    policy: "BASE"
  BASE-N:
    name: "baseline_random_retry"
    policy: "BASE-N"
  CTM:
    name: "ctm_guided_retry"
    policy: "CTM"
