        - heading "Verificación independiente · paquete mínimo" [level=2] [ref=e28]
        - paragraph [ref=e29]: Descarga AX0, CLAIMS.toml, los informes y un verificador de integridad. Puedes compilar el modelo formal sin el árbol de trabajo del autor. El paquete conserva los límites y las divergencias de los informes históricos.
