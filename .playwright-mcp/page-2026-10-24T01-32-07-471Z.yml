        - paragraph [ref=e36]: Descomprime el ZIP y ejecuta este único comando desde la carpeta extraída. Requiere Python 3.10+ y Elan con la versión de Lean indicada en lean-toolchain.
        - code [ref=e38]: ./verify.sh
        - paragraph [ref=e39]: El comando verifica primero la integridad y coherencia de los archivos y después compila AX0 con lake build. Si fallan los hashes, se detiene antes de compilar; cualquier fallo devuelve un código distinto de cero. Una firma de release requiere una clave pública obtenida por un canal de confianza; los hashes por sí solos no prueban identidad ni certifican el runtime.
