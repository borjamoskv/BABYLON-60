        - paragraph [ref=f1e57]: Las nuevas suites de ACS, intención firmada y Seatbelt tienen el resultado y el alcance indicados a continuación. No sustituyen los informes NEMESIS antiguos ni demuestran resistencia a cortes de alimentación.
