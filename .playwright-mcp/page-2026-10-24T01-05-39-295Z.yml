        - paragraph [ref=f1e26]: Especificaciones formales, repositorios de código y guías técnicas de BABYLON-60.
      - generic [ref=f1e27]:
        - heading "Verificación independiente · paquete mínimo" [level=2] [ref=f1e28]
        - paragraph [ref=f1e29]: Descarga AX0, CLAIMS.toml, los informes y un verificador de integridad. Puedes compilar el modelo formal sin acceso al monorepo privado. El paquete conserva los límites y las divergencias de los informes históricos.
        - paragraph [ref=f1e30]:
          - link "Repositorio público · Verification Mirror" [ref=f1e31] [cursor=pointer]:
            - /url: https://github.com/borjamoskv/babylon60-verification
          - link "Descargar paquete ZIP" [ref=f1e32] [cursor=pointer]:
            - /url: /verification/verification-mirror.zip
          - link "Instrucciones y alcance" [ref=f1e33] [cursor=pointer]:
            - /url: /verification/README.md
          - link "AX0.lean" [ref=f1e34] [cursor=pointer]:
