[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babylon60-attest"
version = "0.1.0"
description = "Deterministic LLM output attestation under IETF SCITT (RFC 9943). EU AI Act ready."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Borja Moskv", email = "borja@moskv.eth" },
]
keywords = ["scitt", "attestation", "llm", "provenance", "eu-ai-act", "merkle", "sha3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Zero external dependencies. stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10"]

[project.urls]
Homepage = "https://babylon60.dev"
Repository = "https://github.com/borjamoskv/babylon60-attest"
Documentation = "https://docs.babylon60.dev"

[project.scripts]
babylon60-attest = "babylon60_attest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/babylon60_attest"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
