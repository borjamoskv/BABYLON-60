<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bitumen: #0e0e16;
        --kiln: #14141f;
        --tablet: #1a1a28;
        --tablet-2: #22222f;
        --edge: #2a2a3c;
        --edge-soft: #1f1f2c;
        --dust: #e6e4f0;
        --dust-dim: #aba8c0;
        --dust-faint: #6e6b83;
        --dust-ghost: #3e3b4f;
        --lapis: #5a6ce0;
        --lapis-bright: #8a98f5;
        --lapis-glow: rgba(90, 108, 224, 0.14);
        --gold: #e5b567;
        --verify: #86c79a;
        --break: #e3877e;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 360px;
        background: var(--bitumen);
        color: var(--dust);
        font-family: var(--mono);
        font-size: 12px;
        padding: 12px;
      }
      body.mode-nt {
        --dust: #f1effa;
        --dust-dim: #bab7ce;
        --lapis-bright: #9aa6ff;
      }
      .hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 12.5px;
      }
      .brand .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lapis-bright);
        box-shadow: 0 0 8px var(--lapis-bright);
        margin-right: 6px;
        vertical-align: middle;
      }
      .hd-right {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .chip {
        font-size: 10px;
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 2px 7px;
        color: var(--dust-dim);
        cursor: pointer;
        background: var(--tablet);
        transition: all 0.12s;
      }
      .chip:hover {
        border-color: var(--lapis);
        color: var(--lapis-bright);
      }
      .card {
        background: var(--kiln);
        border: 1px solid var(--edge-soft);
        border-radius: 6px;
        padding: 9px 10px;
        margin-bottom: 9px;
      }
      .lbl {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dust-faint);
        margin-bottom: 5px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .big {
        font-size: 16px;
        font-weight: 700;
      }
      .repo-name {
        font-weight: 700;
      }
      .warn {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        font-size: 10.5px;
        padding: 4px 6px;
        border-radius: 3px;
        margin-top: 5px;
      }
      .warn.red {
        background: rgba(227, 135, 126, 0.12);
        color: var(--break);
      }
      .warn.amber {
        background: rgba(229, 181, 103, 0.12);
        color: var(--gold);
      }
      .warn .d {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        margin-top: 4px;
        flex-shrink: 0;
      }
      input,
      select {
        background: var(--tablet);
        border: 1px solid var(--edge);
        color: var(--dust);
        border-radius: 4px;
        padding: 5px 7px;
        font-family: var(--mono);
        font-size: 11px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--lapis);
      }
      .btn {
        background: var(--tablet);
        border: 1px solid var(--edge);
        color: var(--dust-dim);
        border-radius: 4px;
        padding: 5px 9px;
        font-family: var(--mono);
        font-size: 11px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .btn:hover {
        border-color: var(--lapis);
        color: var(--dust);
      }
      .btn.primary {
        background: var(--lapis-glow);
        border-color: var(--lapis);
        color: var(--lapis-bright);
      }
      .btn.verify {
        border-color: var(--verify);
        color: var(--verify);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--verify);
      }
      .status-dot.off {
        background: var(--break);
      }
      .deleg {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border: 1px solid var(--edge-soft);
        border-radius: 3px;
        margin-top: 5px;
        background: var(--tablet);
      }
      .deleg .st {
        font-size: 9px;
        font-weight: 700;
        border: 1px solid currentColor;
        border-radius: 2px;
        padding: 1px 5px;
      }
      .deleg .k {
        font-size: 9px;
        color: var(--lapis-bright);
        background: var(--lapis-glow);
        border-radius: 2px;
        padding: 1px 5px;
      }
      .deleg .t {
        flex: 1;
        font-size: 10px;
        color: var(--dust-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hit {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 6px;
        border: 1px solid var(--edge-soft);
        border-radius: 3px;
        margin-top: 4px;
      }
      .hit .sc {
        font-size: 10px;
        font-weight: 700;
        color: var(--gold);
        background: rgba(229, 181, 103, 0.12);
        border-radius: 2px;
        padding: 2px 5px;
        min-width: 34px;
        text-align: center;
      }
      .hit .x {
        font-size: 10px;
        color: var(--dust-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .msg {
        font-size: 10px;
        min-height: 12px;
        margin-top: 5px;
      }
      a.foot {
        display: block;
        text-align: center;
        margin-top: 4px;
        color: var(--dust-faint);
        font-size: 10px;
        text-decoration: none;
      }
      a.foot:hover {
        color: var(--lapis-bright);
      }
      .muted {
        color: var(--dust-ghost);
      }
    </style>
  </head>
  <body>
    <div class="hd">
      <div class="brand">
        <span class="dot"></span>BABYLON·60 <span class="muted">Alcove</span>
      </div>
      <div class="hd-right">
        <span class="status-dot off" id="conn"></span>
        <span class="chip" id="mode" title="Modo cognitivo (○ NT / ◐ 2E)"
          >◐ 2E</span
        >
      </div>
    </div>

    <div class="card">
      <div class="lbl">Repo actual (Git Sentinel)</div>
      <div class="row">
        <span class="repo-name" id="repo">—</span
        ><span id="repo-head" class="muted"></span>
      </div>
      <div id="warnings"></div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="lbl" style="margin-bottom: 2px">Ledger · Consensus</div>
          <span class="big" id="entries">—</span>
          <span class="muted" id="lamport"></span>
        </div>
        <button class="btn verify" id="verify">⚿ Verify</button>
      </div>
      <div class="msg" id="verify-msg"></div>
    </div>

    <div class="card">
      <div class="lbl">Delegación (commit local · push ⛔ P0)</div>
      <div class="row" style="gap: 6px">
        <select id="dk" style="width: 92px">
          <option value="commit">commit</option>
          <option value="status">status</option>
          <option value="push">push ⛔</option>
          <option value="deploy">deploy ⛔</option>
        </select>
        <input id="di" placeholder="directiva…" style="flex: 1" />
        <button class="btn primary" id="dg">⚡</button>
      </div>
      <div class="msg" id="deleg-msg"></div>
      <div id="deleg-list"></div>
    </div>

    <div class="card">
      <div class="lbl">
        ⚡ Pensamiento → CortexLedger (captura sin cambiar de contexto)
      </div>
      <div class="row" style="gap: 6px">
        <input
          id="thought"
          placeholder="vuelca la idea aquí… (Enter sella)"
          style="flex: 1"
        />
        <button class="btn primary" id="thought-btn">◎</button>
      </div>
      <div class="msg" id="thought-msg"></div>
      <div
        id="last-note"
        style="font-size: 10px; color: var(--dust-faint); margin-top: 4px"
      ></div>
    </div>

    <div class="card">
      <div class="lbl">Buscar ledger (BM25)</div>
      <div class="row" style="gap: 6px">
        <input id="q" placeholder="ej: amendment risk" style="flex: 1" />
        <button class="btn" id="qb">⌕</button>
      </div>
      <div id="q-res"></div>
    </div>

    <a class="foot" id="open-ide" href="http://localhost:8060/" target="_blank"
      >Abrir IDE completo ↗</a
    >
    <script src="popup.js"></script>
  </body>
</html>
