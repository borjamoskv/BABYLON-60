[package]
name = "babylon-attest"
version = "4.3.0"
edition = "2021"
description = "Deterministic WORM Ledger & Cryptographic SCITT Attestation Engine for agents.archi"
authors = ["Borja Moskv <borjamoskv@github.com>"]
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "babylon-attest"
path = "src/main.rs"

[lib]
name = "babylon_attest"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1.8.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
base64 = "0.22"
libc = "0.2"

