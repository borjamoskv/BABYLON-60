[package]
name = "b60-lang"
version = "4.3.0"
edition = "2021"
description = "Sovereign Base-60 Programming Language Engine for BABYLON-60 & Robinson-Moskv"
authors = ["Borja Moskv <borjamoskv@github.com>"]
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "b60"
path = "src/main.rs"

[features]
default = []
stress-bins = []

[[bin]]
name = "aeon_chaining"
path = "src/bin/aeon_chaining.rs"
required-features = ["stress-bins"]

[[bin]]
name = "aeon_stress"
path = "src/bin/aeon_stress.rs"
required-features = ["stress-bins"]

[[bin]]
name = "fsm_poc"
path = "src/bin/fsm_poc.rs"
required-features = ["stress-bins"]

[[bin]]
name = "fsm_stress"
path = "src/bin/fsm_stress.rs"
required-features = ["stress-bins"]

[lib]
name = "b60_lang"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
