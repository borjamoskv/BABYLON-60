[package]
name = "strike_rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "High-performance I/O and cryptographic primitives for BABYLON-60"
repository = "https://github.com/borjamoskv/BABYLON-60"
authors = ["Borja Moskv <borjamoskv@github.com>"]

[lib]
name = "strike_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.5"
petgraph = "0.8.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
ring = "0.17.8"
inotify = "0.10.2"
signal-hook = "0.3.17"
pyo3 = { version = "0.21.2" }
libc = "0.2.186"
uuid = { version = "1.24.0", features = ["v5"] }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3.30"
async-trait = "0.1.81"
tonic-web = "0.12"
prost = "0.13"
tonic = "0.12"
hex = "0.4.3"
tokio-stream = "0.1.19"

[dev-dependencies]
proptest = "1.6.0"
pyo3 = { version = "0.21.2", features = ["auto-initialize"] }


[features]
extension-module = ["pyo3/extension-module"]

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }

[dependencies.iceoryx2]
version = "0.3.0"
