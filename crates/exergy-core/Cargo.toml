[package]
name = "exergy-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for anti-entropic messaging FSM, Exergy metrics, and Causal Contracts"
authors = ["BABYLON-60 / Exergy-Net"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.0"
