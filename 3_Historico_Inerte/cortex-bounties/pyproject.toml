[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-bounty"
version = "2.0.0"
description = "CORTEX Sovereign Bounty Hunting Engine — x1000"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "aiohttp>=3.9",
    "web3>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
cortex-bounty = "cortex_bounty.cli:main"

[tool.setuptools.packages.find]
where = ["."]
