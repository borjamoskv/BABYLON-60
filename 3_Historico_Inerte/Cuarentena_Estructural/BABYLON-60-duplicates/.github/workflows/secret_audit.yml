# C5-REAL EXERGY CERTIFIED
name: C5-REAL Secret Sentinel (ULTRATHINK P0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  audit-secrets:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup C5-REAL Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Get Delta Files (Pull Request Optimization)
      id: get-deltas
      if: github.event_name == 'pull_request'
      run: |
        # Salida en UNA sola línea: un output multilínea se interpolaría como
        # nuevas líneas en el script run: y bash intentaría ejecutar cada
        # nombre de fichero como comando (exit 126 con .py +x).
        FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | tr '\n' ' ')
        echo "files=$FILES" >> "$GITHUB_OUTPUT"

    - name: Execute Swarm Transductor (SARIF Generation)
      env:
        GITHUB_ACTIONS: "true"
      run: |
        echo "[*] Initializing BFT_STATE_LOOP Secret Auditor (ULTRATHINK)..."
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          python3 scripts/secret_swarm_auditor.py --sarif --files ${{ steps.get-deltas.outputs.files }}
        else
          python3 scripts/secret_swarm_auditor.py --sarif
        fi

    - name: Upload SARIF to GitHub Security Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: secret_audit.sarif
        category: moskv1-apex-secrets
