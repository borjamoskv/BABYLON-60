# ============================================
# PRE-COMMIT HOOKS — Última línea de defensa local
# ============================================
repos:
  # --- Detección de secretos ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # --- Detección alternativa (doble barrera) ---
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # --- Archivos grandes (posibles dumps/DB) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master', '--branch', 'production']

  # --- Credenciales hardcodeadas ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
        exclude: '(?x)( ^tests/ | ^babylon60/agents/primitives/ )'

  # --- Validar que no haya IPs/URLs internas ---
  - repo: local
    hooks:
      - id: no-internal-urls
        name: Block internal URLs/IPs
        entry: bash -c 'grep -rnE "\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b|\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3}\b|localhost:[0-9]+" "$@" && echo "❌ Internal IPs/URLs detected" && exit 1 || exit 0'
        language: system
        types: [text]
        exclude: '(?x)( \.env | \.json$ | \.yaml$ | \.yml$ | \.toml$ | \.lock$ | url_guard\.py | distributed_cache\.py | \.md$ | \.html$ | \.astro$ | \.css$ | ^tests/ | ^examples/ | ^benchmarks/ )'
