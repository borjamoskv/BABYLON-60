# Content Typology (Optimal Mix)
content_types:
  - type: "EXPERIMENTO (Laboratory Post)"
    frequency: "1x/semana"
    length: "800-1500 palabras"
    structure: "6-step loop (Experimento → Hallazgo → Código → Demo → Track → Reflexión)"
    purpose: "Pieza nuclear. Deja un asset reutilizable en el repositorio."

  - type: "MICRO-POST (Signal Burst)"
    frequency: "3-4x/semana"
    length: "20-80 palabras"
    structure: "Foto/captura + reflexión de 2 líneas"
    purpose: "Mantener la frecuencia algorítmica. Coste de producción O(1)."
    examples:
      - "Captura de terminal con output de un script experimental"
      - "Foto del setup de producción musical"
      - "Fragmento de código con comentario termodinámico"
      - "Screenshot de una visualización generativa"

  - type: "AUDITORÍA FORENSE (Deep Article)"
    frequency: "1x/mes"
    length: "2000-4000 palabras"
    structure: "Secciones numeradas con headers clínicos"
    purpose: "Pieza de alta retención para tier1_c5real_core."
    reference: "docs/la_gran_necrosis_ontologica.md"

