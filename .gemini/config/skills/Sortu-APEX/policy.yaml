# ═══════════════════════════════════════════════════════════════
# SORTU-Ω v13.0.0 — x1000 Centuria Operational Policy
# Machine-readable thresholds, states, transitions, and rules.
# ═══════════════════════════════════════════════════════════════

meta:
  skill: sortu
  version: "13.0.0"
  updated: "2026-04-21"
  classification: OPERATIONAL
  escalation: x1000

# ── STATE MACHINE (Extended) ─────────────────────────────────

states:
  - DRAFT
  - AUDITED
  - LYAPUNOV_GATE
  - FORGED
  - VERIFIED
  - VSA_ANCHORED
  - LINKED
  - LEDGERED
  - GENOME_INTEGRATED
  - ACTIVE
  - QUARANTINED
  - TOMBSTONED
  - PURGED
  - ABORTED

transitions:
  DRAFT:
    next: AUDITED
    gate: semantic_overlap_check
    abort_on_fail: REDUNDANT_COMPUTATION

  AUDITED:
    next: LYAPUNOV_GATE
    gate: lyapunov_entropy_prediction
    abort_on_fail: LYAPUNOV_VIOLATION

  LYAPUNOV_GATE:
    next: FORGED
    gate: centuria_dispatch
    abort_on_fail: FORGE_DISPATCH_FAILED

  FORGED:
    next: VERIFIED
    gate: mechanical_verification
    abort_on_fail: CONTRACT_VERIFICATION_FAILED

  VERIFIED:
    next: VSA_ANCHORED
    gate: vsa_collision_detection
    abort_on_fail: VSA_COLLISION

  VSA_ANCHORED:
    next: LINKED
    gate: causal_dag_linking
    abort_on_fail: INVALID_CAUSAL_PARENT

  LINKED:
    next: LEDGERED
    gate: ledger_persistence
    abort_on_fail: LEDGER_WRITE_FAILED

  LEDGERED:
    next: GENOME_INTEGRATED
    gate: genome_gene_extraction
    abort_on_fail: GENOME_INTEGRATION_FAILED

  GENOME_INTEGRATED:
    next: ACTIVE
    gate: biopsy_check
    abort_on_fail: NEGATIVE_NET_EXERGY

  ACTIVE:
    quarantine_on: ttl_expired
    quarantine_on_alt: negative_net_exergy

  QUARANTINED:
    next: TOMBSTONED
    after_days: 7
    recovery_if: verified_positive_yield

  TOMBSTONED:
    next: PURGED
    after_days: 30
    note: "Artifacts archived, not deleted. Ledger record preserved."

# ── ABORT REASONS (Extended) ─────────────────────────────────

abort_reasons:
  REDUNDANT_COMPUTATION:
    description: "Semantic overlap exceeds threshold AND causal gap is insufficient."
    severity: WARNING

  MISSING_TRIPARTITE:
    description: "Incomplete artifact package — missing SKILL.md, schema.json, or verify_<skill>.py."
    severity: ERROR

  CONTRACT_VERIFICATION_FAILED:
    description: "verify_<skill>.py returned FAIL."
    severity: ERROR

  EPISTEMIC_DRIFT:
    description: "Generated artifacts diverge from original intent beyond tolerance."
    severity: ERROR

  NEGATIVE_NET_EXERGY:
    description: "Compound yield is less than entropy cost."
    severity: WARNING

  LEDGER_WRITE_FAILED:
    description: "CORTEX Ledger persistence error — hash chain broken."
    severity: CRITICAL

  INVALID_CAUSAL_PARENT:
    description: "Referenced parent UUID does not exist in the causal DAG."
    severity: ERROR

  LYAPUNOV_VIOLATION:
    description: "Injecting this skill would increase global system entropy (dV/dt > 0)."
    severity: CRITICAL

  VSA_COLLISION:
    description: "Cosine distance < 0.1 against existing hypervector anchors. Skill is a semantic duplicate."
    severity: ERROR

  FORGE_DISPATCH_FAILED:
    description: "Centuria parallel dispatch failed to complete within latency budget."
    severity: ERROR

  GENOME_INTEGRATION_FAILED:
    description: "Gene extraction or insertion into genome.yaml failed."
    severity: WARNING

# ── REQUIRED ARTIFACTS ────────────────────────────────────────

required_artifacts:
  - path: "SKILL.md"
    required: true
    validation: yaml_frontmatter_present

  - path: "schema.json"
    required: true
    validation: json_schema_2020_12

  - path: "verify_*.py"
    required: true
    count: 1
    validation: importable_python

# ── TTL POLICY ────────────────────────────────────────────────

ttl_policy:
  max_age_days: 7
  max_invocations_without_positive_yield: 3
  reset_on_verified_success: true
  quarantine_on_expiry: true
  tombstone_before_purge: true
  tombstone_after_quarantine_days: 7
  purge_after_tombstone_days: 30
  exempt_if_single_run_hours_saved_gte: 4.0

# ── REDUNDANCY POLICY ─────────────────────────────────────────

redundancy_policy:
  overlap_threshold: 0.9

  overlap_measurement:
    method: ast_jaccard
    source: candidate_skill_python_files
    target: existing_skill_python_files
    engine: sortu_overlap.py

  allow_overlap_if:
    - lower_entropy_cost
    - stronger_verification
    - narrower_scope
    - better_causal_traceability

  causal_gap_check:
    required: true
    minimum_gap_score: 0.15
    output_format:
      overlap_score: float
      causal_gap_score: float
      decision: "enum: PROCEED | ABORT_REDUNDANT"

# ── YIELD POLICY (x1000) ─────────────────────────────────────

yield_policy:
  formula: "sum(H_i * S ** d_i)"  # S=100 Singularity Constant
  singularity_constant: 100
  reuse_coefficient_r: 0.15
  minimum_net_exergy: 0.0
  require_verified_success_events: true

  valid_yield_sources:
    - verified_invocations
    - confirmed_outcomes
    - external_logs
    - signed_ledger_events
    - genome_recombinations

  entropy_cost_sources:
    - maintenance_minutes
    - verification_failures
    - dependency_weight
    - token_cost
    - lyapunov_destabilization

# ── LYAPUNOV POLICY (NEW) ────────────────────────────────────

lyapunov_policy:
  entropy_ceiling: 0.0  # dV/dt must be strictly negative
  prediction_method: "gradient_injection_simulation"
  abort_on_violation: true
  log_to: ledger

# ── VSA-SDM POLICY (NEW) ─────────────────────────────────────

vsa_policy:
  vector_dimensionality: 1024
  collision_threshold: 0.1
  encoding_method: "sha256_projection"
  binding_operation: "XOR"
  bundling_operation: "majority_vote"
  log_to: ledger

# ── CENTURIA POLICY (NEW) ────────────────────────────────────

centuria_policy:
  max_threads: 200
  squads:
    - id: FORGE
      specialty: "Hardware synthesis scoring"
      thread_count: 20
    - id: BINDER
      specialty: "VSA memory anchoring"
      thread_count: 20
    - id: AUDITOR
      specialty: "Overlap detection"
      thread_count: 20
    - id: SCRIBE
      specialty: "Ledger persistence"
      thread_count: 20
    - id: STRATEGIST
      specialty: "Goal factorization"
      thread_count: 20
  consensus: "byzantine_2_3_supermajority"
  latency_budget_ms: 1200

# ── SILICON POLICY (NEW) ─────────────────────────────────────

silicon_policy:
  viability_flag_threshold: 0.7
  synthesis_target: "Verilog/SystemVerilog"
  evaluation_method: "keyword_affinity + complexity_score"
  log_to: ledger

# ── COLD FORGE POLICY ─────────────────────────────────────────

cold_forge:
  priority:
    - source: local_frontier
      confidence_penalty: 0
      description: "Local frontier-tier model. No penalty."

    - source: remote_frontier
      confidence_penalty: 1
      description: "Remote frontier-tier model. Confidence downgraded by 1 level."

    - source: remote_non_frontier
      action: ABORT
      description: "Non-frontier models violate Rule 1.3. Forge aborted."

  fallback_logging: true
  log_to: ledger

# ── LEDGER RECORD SCHEMA ─────────────────────────────────────

ledger_record:
  required_fields:
    - skill_id
    - version
    - parent_uuid
    - artifact_hashes
    - created_at
    - verification_status
    - ttl_expiration
    - state
    - lyapunov_dv_dt
    - vsa_distance
    - silicon_score
    - centuria_threads
    - genome_gene

  optional_fields:
    - yield_events
    - purge_status
    - quarantine_reason
    - tombstone_date
    - abort_reason
    - confidence_level
    - forge_source
    - net_exergy

  hash_algorithm: SHA-256
  hash_target: tripartite_package
