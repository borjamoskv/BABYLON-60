schema_version: "2026.2"
subsystem: "Ship_Gate_Omega13"
operator: "borjamoskv"
policy: "Zero_Entropy_to_Production"

# ─────────────────────────────────────────────────────────
# SHIP GATE (Ω₁₃)
#
# Production entropy filter. Every cognitive artifact must
# survive this pipeline before materialization.
#
# No result — from any thinking mode — reaches production
# without passing all 5 gates in sequence.
# ─────────────────────────────────────────────────────────

pipelines:
  # Standard path: Deep Think → Implementation → Ship Gate
  standard:
    entry: "deep_think | normal"
    stages:
      - cognitive_output
      - implementation
      - ship_gate
    exit: "production"

  # Remediation path: UltraThink → Remediation → Blast Radius Audit → Ship Gate
  remediation:
    entry: "ultra_think"
    stages:
      - cognitive_output
      - remediation
      - blast_radius_audit
      - ship_gate
    exit: "production"

# ─────────────────────────────────────────────────────────
# GATE DEFINITIONS (sequential, all must pass)
# ─────────────────────────────────────────────────────────

gates:
  - id: G1_GHOST_RADAR
    name: "Ghost Radar"
    order: 1
    description: >
      Detección de side-effects y mutaciones silentes
      en módulos adyacentes al cambio.
    checks:
      - "AST diff analysis: no unintended mutations in adjacent modules"
      - "Import graph: no circular dependency introduction"
      - "State mutation audit: no hidden global state changes"
    fail_action: "BLOCK → Return to implementation with ghost report"
    severity_override: false

  - id: G2_TEST_SUITE
    name: "Test Suite"
    order: 2
    description: >
      Ejecución estricta de invariantes térmicas.
      All existing tests must pass. New code requires coverage.
    checks:
      - "pytest -v (all green)"
      - "Coverage delta >= 0 (no regression)"
      - "Integration tests for affected modules"
    fail_action: "BLOCK → Fix failing tests before proceeding"
    commands:
      - "cd 10_PROJECTS/cortex-persist && pytest tests/ -v --tb=short"

  - id: G3_GIT_STATE
    name: "Git State (R4 Sentinel)"
    order: 3
    description: >
      Verificación de atomicidad y limpieza.
      Enforces R4 Git Sentinel directive.
    checks:
      - "git status: clean working tree (no untracked artifacts)"
      - "Conventional Commit message present"
      - "Single atomic commit per logical change"
      - "No secrets in diff (grep for API keys, tokens, passwords)"
    fail_action: "BLOCK → Stage, commit, or .gitignore before proceeding"
    commands:
      - "git status"
      - "git diff --cached --stat"

  - id: G4_QUALITY_GATE
    name: "Quality Gate (LEA-Ω)"
    order: 4
    description: >
      Auditoría de Token Hygiene. Destrucción de código muerto
      y anergy. Enforces P0 Recursive Dead Code Purge.
    checks:
      - "dead_code_ratio <= 0.4 (APOPTOSIS threshold)"
      - "No orphan imports or unused variables"
      - "No TODO/FIXME without linked issue"
      - "Complexity penalty < 10.0"
    fail_action: "BLOCK → Purge dead code, then re-run"
    linked_skills:
      - "Anergy-OMEGA"
      - "CAOS-OMEGA"

  - id: G5_NEURAL_CONNECTIVITY
    name: "Neural Connectivity"
    order: 5
    description: >
      Análisis del grafo de dependencias para asegurar que
      la inserción no debilita la estructura global.
    checks:
      - "Dependency graph: no increase in coupling metrics"
      - "Module cohesion: no decrease in internal consistency"
      - "Public API surface: no unintended expansion"
      - "Backward compatibility: no breaking changes without version bump"
    fail_action: "BLOCK → Refactor to reduce coupling or document breaking change"

# ─────────────────────────────────────────────────────────
# BLAST RADIUS AUDIT (UltraThink remediation path only)
# ─────────────────────────────────────────────────────────

blast_radius_audit:
  trigger: "pipeline == remediation"
  description: >
    Additional verification layer for UltraThink outputs.
    Validates that remediation has not introduced secondary damage.
  checks:
    - "Full module dependency scan (not just adjacent)"
    - "Rollback plan documented and tested"
    - "Incident timeline recorded in Ledger"
    - "Post-mortem template generated"
  fail_action: "ESCALATE → Operator review required before production"

# ─────────────────────────────────────────────────────────
# GATE RESULT CONTRACT
# ─────────────────────────────────────────────────────────

result_contract:
  all_pass:
    action: "SHIP → Merge to production branch"
    record: "Append gate results to Ledger (C5-REAL)"
  any_fail:
    action: "BLOCK → Return to pre-gate stage with failure report"
    record: "Append failure to Ledger with remediation hints"
  override:
    allowed: false
    exception: "Operator explicit override with documented justification"
