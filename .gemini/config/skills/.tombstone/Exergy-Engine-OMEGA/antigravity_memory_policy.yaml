schema_version: "2026.1"
subsystem: "Epistemic_Storage"

memory_hierarchy:
  L1_CACHE:
    descriptor: "Working Memory (Volatile)"
    engine: "Context Window (Max 2M Tokens)"
    epistemology: "C4-SIM"
    persistence: "Session Scoped"
    purge_trigger: "Task Complete OR Context Shift"
    contents: 
      - "Active AST diffs"
      - "Terminal stdout/stderr"
      - "Local tool payloads"

  L2_CACHE:
    descriptor: "Episodic Memory (Persistent)"
    engine: "Workflow -> /memory"
    epistemology: "C5-REAL"
    persistence: "Local JSONL / SQLite"
    read_trigger: "Session Init OR Intent.matches_past_failure()"
    write_trigger: "Task Complete AND (system.entropy > threshold)"
    contents:
      - "Resolved Stack Traces"
      - "User Preferences (Operator: borjamoskv)"
      - "Conversational Trajectories"

  L3_CACHE:
    descriptor: "Semantic / Structural Core"
    engine: "Skill -> Autodidact-Research-OMEGA"
    epistemology: "C5-REAL (SOTA-Loop)"
    persistence: "Knowledge Graph / Vector Space"
    read_trigger: "STATE == APEX_STATE OR USER_INPUT == 'PIENSA'"
    write_trigger: "Skill -> Ouroboros-Infinity (Daily Metabolism)"
    contents:
      - "SOTA Architectural Patterns"
      - "21-EDO / Microtonal Algorithms"
      - "Protocol Asymmetries (MEV/Bounty targets)"

memory_constraints:
  Entropy_Purge: "L1_CACHE forces garbage collection if token_density_ratio < 0.2"
  Capital_Preservation: "L3_CACHE updates require explicit C5-REAL verification (No hallucinated knowledge)"
