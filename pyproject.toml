[project]
name = "teorema-robinson-moskv"
version = "0.1.0"
description = "MOSKV-1 BFT Cortex"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "chromadb==0.4.20",
    "maturin==1.14.1",
    "mypy==1.11.0",
    "pytest==8.0.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "strike-rs",
    "websocket-client==1.9.0",
    "fastapi==0.111.0",
    "numpy<2.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pip-audit",
    "mkdocstrings[python]",
    "mkdocs-material",
    "hypothesis>=6.158.1",
]

[tool.mypy]
namespace_packages = false
exclude = [
    "^scratch/",
]

[tool.uv.workspace]
members = [
    "strike-rs",
]

[tool.uv.sources]
strike-rs = { workspace = true }
