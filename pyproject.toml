[project]
name = "teorema-robinson-moskv"
version = "1.0.2"
description = "MOSKV-1 BFT Cortex"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "chromadb==0.4.20",
    "maturin==1.14.1",
    "mypy==1.11.0",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "strike-rs",
    "websocket-client==1.9.0",
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "numpy<2.0.0",
    "psutil>=7.2.2",
    "matplotlib>=3.11.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pip-audit",
    "mkdocstrings[python]",
    "mkdocs-material",
    "hypothesis>=6.158.1",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
exclude = [
    "^scratch/",
]

[tool.uv.workspace]
members = [
    "strike-rs",
]

[tool.uv.sources]
strike-rs = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "cortex/laboratory",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E743", "E402", "E701"]

