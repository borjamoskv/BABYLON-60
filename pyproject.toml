[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-persist"
version = "1.0.2"
description = "CORTEX C5-REAL execution kernel (BABYLON-60): BFT ledgers, onco-transducer, exergy pipelines"
authors = [{ name = "Borja Moskv (borjamoskv)" }]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.19",
    "cbor2>=5.6.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
embeddings = [
    "numpy>=1.24",
]
graph = [
    "networkx>=3.0",
]
telemetry = [
    "psutil>=7.2.2",
]
voice = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1",
]
voice-full = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1",
    "mlx-lm>=0.21; platform_machine=='arm64' and sys_platform=='darwin'",
    "kokoro>=0.9",
]

[tool.setuptools]
packages = ["babylon60"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "domain_kernel",
    "strike_rs",
    "src",
    "L1_sink",
    "BABYLON-60-fixes",
    "c5_remotion_video",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E743"]

[tool.mypy]
python_version = "3.12"
disallow_any_generics = false
exclude = ["^scratch/", "^anvil_yung/", "^cortex/scripts/sandbox_stress/claude-science-data/"]
ignore_missing_imports = true
