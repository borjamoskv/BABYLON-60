[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babylon60-cortex"
version = "0.1.0"
description = "CORTEX C5-REAL execution kernel (BABYLON-60): BFT ledgers, onco-transducer, exergy pipelines"
authors = [{ name = "Borja Moskv (borjamoskv)" }]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
crypto = [
    "cryptography>=42.0",
    "pynacl>=1.5",
]
data = [
    "pandas>=2.0",
]

[tool.setuptools]
packages = ["cli", "core", "bft", "analysis", "adapters", "compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "domain_kernel",
    "strike_rs",
    "src",
    "L1_sink",
    "BABYLON-60-fixes",
    "c5_remotion_video",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
disallow_any_generics = true
exclude = ["^scratch/"]
