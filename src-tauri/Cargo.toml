[package]
name = "moskv-1-apex"
version = "1.0.0-singularity"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-beta" }

[dependencies]
tauri = { version = "2.0.0-beta", features = ["macos-private-api"] }
tokio = { version = "1.36", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
fastembed = "5"
ort = { version = "2.0.0-rc.12", features = ["tls-rustls"] }
ringbuf = "0.3.3"
cpal = "0.15.2"
headless_chrome = "1.0.12"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8.0", features = ["v5"] }
blake3 = "1.5.1"
