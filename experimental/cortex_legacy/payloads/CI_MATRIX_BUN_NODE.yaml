name: C5-REAL Cross-Validation (Bun/Node)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, node]
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      if: matrix.runtime == 'bun'
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js
      if: matrix.runtime == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        if [ "${{ matrix.runtime }}" == "bun" ]; then
          bun install
        else
          npm install
        fi

    - name: Run C5-REAL Tests
      run: |
        if [ "${{ matrix.runtime }}" == "bun" ]; then
          bun test
        else
          npm test
        fi
