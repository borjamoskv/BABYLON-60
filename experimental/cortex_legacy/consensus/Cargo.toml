[package]
name = "cortex-consensus"
version = "0.1.0"
edition = "2021"
authors = ["Borja Moskv <borjamoskv@users.noreply.github.com>"]
description = "HotStuff/DAG consensus engine for ULTRATHINK 10k-node swarm"

[features]
default = []
use_hotstuff = []

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
log = "0.4"
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
