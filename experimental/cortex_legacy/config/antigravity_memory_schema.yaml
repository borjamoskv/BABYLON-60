# ANTIGRAVITY Memory Schema v1.0
# Esquema de persistencia para el grafo de conocimiento CORTEX
# ---

layers:
  L1_Primitive_Nodes:
    type: property_graph_nodes
    attributes:
      id: string (e.g. T01.D01.do-operator)
      theory: enum (T01-T10)
      dimension: string
      name: string
      embedding: vector[768] # Embeddings locales para búsqueda semántica
      access_count: integer
      last_accessed: timestamp
    indexing:
      primary_key: id
      vector_index: embedding (cosine metric)
      lookup_index: theory, dimension

  L2_Isomorphism_Edges:
    type: weighted_edges
    attributes:
      id: string
      source: string # Node ID
      target: string # Node ID
      weight: real # Fuerza [0.0, 1.0]
      justification: string
      hits: integer
      last_used: timestamp
    indexing:
      primary_key: id
      source_index: source
      target_index: target

  L3_Inference_Traces:
    type: json_document_store
    attributes:
      trace_id: uuid
      timestamp: timestamp
      query_hash: string
      activation_vector: array[real]
      reasoning_steps: array[string]
      resolved: boolean
      confidence: real
    indexing:
      primary_key: trace_id
      query_index: query_hash

  L4_Episodic_Memory:
    type: vector_document_store
    attributes:
      episode_id: uuid
      timestamp: timestamp
      content: string
      embedding: vector[768]
      valence: real # [-1.0, 1.0] para valencia emocional/importancia
      primitives_used: array[string]
    indexing:
      primary_key: episode_id
      vector_index: embedding
