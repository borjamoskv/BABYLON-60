<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004433"/>
      <stop offset="100%" stop-color="#00110c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="600" fill="url(#bg)" rx="24"/>
  <rect x="16" y="16" width="768" height="568" fill="none" stroke="#00FFCC" stroke-width="6" rx="16" filter="url(#glow)"/>

  <!-- Icon Badge -->
  <circle cx="400" cy="220" r="90" fill="#00FFCC" fill-opacity="0.15" stroke="#00FFCC" stroke-width="4"/>
  <text x="400" y="245" font-size="80" text-anchor="middle">🎹💡</text>

  <!-- Top Title -->
  <text x="400" y="90" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" stroke="#000" stroke-width="2">
    HERMENEGILDO ALTOZANO EN EL PIANO
  </text>

  <!-- Subtitle Quote -->
  <text x="400" y="440" font-family="Impact, Arial Black, sans-serif" font-size="32" font-weight="900" fill="#FFFF00" text-anchor="middle" stroke="#000" stroke-width="2">
    ¡EL SILENCIO ES UNA NOVENA DOMINANTE EN RE BE
  </text>
  <text x="400" y="490" font-family="Impact, Arial Black, sans-serif" font-size="32" font-weight="900" fill="#FFFF00" text-anchor="middle" stroke="#000" stroke-width="2">
    MOL!
  </text>

  <!-- Footer Tag -->
  <text x="400" y="550" font-family="monospace" font-size="16" fill="#00FFCC" text-anchor="middle" letter-spacing="3">
    EL INTERVALO PROHIBIDO // 2.8s
  </text>
</svg>
