<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#004d3e"/>
      <stop offset="60%" stop-color="#002a22"/>
      <stop offset="100%" stop-color="#000c09"/>
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="25" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEE77"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="1080" height="720" fill="url(#bg)" rx="32"/>

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1080" y2="120"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="600" x2="1080" y2="600"/>
    <line x1="216" y1="0" x2="216" y2="720"/>
    <line x1="432" y1="0" x2="432" y2="720"/>
    <line x1="648" y1="0" x2="648" y2="720"/>
    <line x1="864" y1="0" x2="864" y2="720"/>
  </g>

  <!-- Neon Border Glow -->
  <rect x="24" y="24" width="1032" height="672" fill="none" stroke="#00FFCC" stroke-width="8" rx="24" filter="url(#neonGlow)"/>
  <rect x="36" y="36" width="1008" height="648" fill="none" stroke="#0099FF" stroke-width="2" rx="18" opacity="0.6"/>

  <!-- Center Glowing Orb Badge -->
  <circle cx="540" cy="270" r="120" fill="#00FFCC" fill-opacity="0.12" stroke="#00FFCC" stroke-width="6" filter="url(#neonGlow)"/>
  <text x="540" y="305" font-size="110" text-anchor="middle">🎹💡🌌</text>

  <!-- Top Meme Header -->
  <text x="540" y="105" font-family="Impact, Arial Black, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" text-anchor="middle" stroke="#000" stroke-width="3" letter-spacing="2">
    HERMENEGILDO ALTOZANO EN SAGITTARIUS A*
  </text>

  <!-- Bottom Meme Subtitle Quote -->
  <rect x="80" y="470" width="920" height="130" fill="rgba(0,0,0,0.65)" rx="16" stroke="#00FFCC" stroke-width="2"/>

  <text x="540" y="525" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="900" fill="#FFFF00" text-anchor="middle" stroke="#000" stroke-width="2" letter-spacing="1">
    ¡EL SILENCIO ES UNA NOVENA DOMINANTE EN RE BEMOL!
  </text>
  <text x="540" y="575" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="900" fill="#FFFF00" text-anchor="middle" stroke="#000" stroke-width="2" letter-spacing="1">

  </text>

  <!-- Footer Tagline -->
  <text x="540" y="665" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#00FFCC" text-anchor="middle" letter-spacing="4">
    ANÁLISIS ARMÓNICO DEL HOYO NEGRO
  </text>
</svg>
