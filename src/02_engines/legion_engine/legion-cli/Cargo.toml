# C5-REAL EXERGY CERTIFIED
[package]
name = "legion-cli"
version = "0.1.0"
edition = "2021"
authors = ["Borja & Exergy Swarm Team"]
description = "CLI y Dashboard TUI de máxima velocidad (<4MB binario) para Legión Exergética"

[[bin]]
name = "legion"
path = "src/main.rs"

[dependencies]
legion-core = { path = "../legion-core" }
legion-apfs = { path = "../legion-apfs" }
legion-exergy = { path = "../legion-exergy" }
legion-healer = { path = "../legion-healer" }
legion-lang = { path = "../legion-lang" }
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
chrono = "0.4"
