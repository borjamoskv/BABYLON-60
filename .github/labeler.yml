"engine: rust":
  - changed-files:
      - any-glob-to-any-file:
          - "strike_rs/**/*"

"engine: python":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.py"

"config: github":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"

"docs: artifact":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
