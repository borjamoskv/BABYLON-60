version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      iceoryx-ecosystem:
        patterns:
          - "iceoryx2*"
      grpc-ecosystem:
        patterns:
          - "tonic*"
          - "prost*"
          - "tokio*"
      crypto-stack:
        patterns:
          - "rand*"
          - "ed25519-dalek*"
          - "p256"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

