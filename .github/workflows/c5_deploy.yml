name: C5-REAL Soverign Cloud Allocation (GCP)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'infra/**'

env:
  PROJECT_ID: cortex-babylon-60
  REGION: europe-west1
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  terraform-apply:
    name: "ULTRATHINK BFT Infra Execution"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate via Workload Identity Federation (C5-REAL Zero-Trust)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: 'c5-deployer@cortex-babylon-60.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./infra

      - name: Terraform Apply (Auto-Approve / R7 Override)
        run: terraform apply -auto-approve tfplan
        working-directory: ./infra

