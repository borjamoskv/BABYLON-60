name: macOS Seatbelt read confinement

# Real sandbox-exec coverage for babylon60.confine (run / demo / log).
# Only confinement code, its tests or this workflow trigger it, so ordinary
# Python or documentation changes do not consume macOS minutes.
on:
  push:
    branches: [main]
    paths:
      - '01_KISH_ENGINE/babylon60/confine/**'
      - 'tests/test_confine_*.py'
      - '.github/workflows/confine-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - '01_KISH_ENGINE/babylon60/confine/**'
      - 'tests/test_confine_*.py'
      - '.github/workflows/confine-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seatbelt:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --extra dev
      - name: Seatbelt backend, policy, journal, demo and CLI
        run: >-
          uv run --locked --no-sync pytest -q -rs
          tests/test_confine_seatbelt.py tests/test_confine_policy.py tests/test_confine_journal.py
          tests/test_confine_demo.py tests/test_confine_cli.py
        env:
          BABYLON60_REQUIRE_SEATBELT: "1"
