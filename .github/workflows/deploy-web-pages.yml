name: Deploy Web Application (babylon60.com)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web to Global Internet (Cloudflare / GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd apps/web
          npm install

      - name: Build Production Bundle
        run: |
          cd apps/web
          npm run build

      - name: Deploy to Cloudflare Pages (babylon60.com)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'babylon60-com'
          directory: 'apps/web/dist'
          gitToProjectBranch: 'true'
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/dist'
        continue-on-error: true

      - name: Deploy to GitHub Pages Backup
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
