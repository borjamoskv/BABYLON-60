name: ArchiGuard BIM Compliance & CTE Audit

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.ifc'
      - '**.dsl'
      - '**.dxf'
      - '00_KERNEL/cortex-guard/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.ifc'
      - '**.dsl'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  archi-guard-audit:
    name: Deterministic Z3 BIM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Compile cortex-guard Binary
        run: cargo build --release -p cortex-guard

      - name: Run ArchiGuard Audit (SARIF + Annotations)
        id: audit
        continue-on-error: true
        run: |
          ./target/release/cortex-guard verify \
            --ifc ./README.md \
            --pgou ./Cargo.toml \
            --format sarif \
            --strict=true \
            --annotate-gh > audit_report.sarif

          ./target/release/cortex-guard verify \
            --ifc ./README.md \
            --pgou ./Cargo.toml \
            --format json \
            --strict=false > audit_report.json

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'audit_report.sarif'
          category: 'cortex-guard-bim-compliance'
