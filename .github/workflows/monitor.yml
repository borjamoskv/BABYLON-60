on:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  check-health:
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: |
          HEALTH_URL="${BABYLON60_HEALTH_URL:-http://localhost:6060/health}"
          curl -f "$HEALTH_URL" || echo "Health endpoint unreachable (expected if not deployed)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
