name: OIDC Keyless Package Publishing

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Mandatory for OIDC keyless authentication

jobs:
  pypi-publish:
    name: Publish to PyPI via OIDC (Trusted Publisher)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypa-publish@release/v1
