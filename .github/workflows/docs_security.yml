# C5-REAL EXERGY CERTIFIED
name: Docs Security & XSS Prevention

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - '**/*.md'

jobs:
  markdownlint:
    name: Lint Markdown for Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
          # Puedes añadir un archivo .markdownlint.yaml en la raíz si necesitas relajar reglas.
