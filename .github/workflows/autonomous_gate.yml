name: Autonomous Security Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  agent_review:
    if: github.event.pull_request.labels.*.name == 'agent-approved' || github.actor == 'agent-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run automated tests
        run: |
          pip install pytest pytest-cov || echo "No pytest"
          pytest --cov=cortex --cov-report=xml || echo "Pytest skipped"
      - name: Security lint (Bandit / Semgrep)
        run: |
          pip install bandit
          bandit -r cortex -f json -o bandit.json || exit 0
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

  agent_approve:
    needs: agent_review
    if: github.event.review.state == 'approved' && github.actor == 'agent-reviewer'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-approve check
        run: echo "AGENT_APPROVED=true" >> $GITHUB_ENV
