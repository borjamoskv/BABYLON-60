name: Gitleaks Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Excluimos explícitamente el señuelo Canary para que no rompa el escáner de Gitleaks
          GITLEAKS_OPTS: "--exclude-path=tests/fixtures/fake_aws_credentials"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install babylon60 package
        run: pip install -e .

      - name: Run C5 OPSEC Sentinel
        run: |
          python3 scripts/c5_cli/opsec_sentinel_c5.py .
