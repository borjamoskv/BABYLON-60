name: Gitleaks Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install pinned open-source scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Scan Git history
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          LOG_OPTS="HEAD"
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"
          fi
          gitleaks git --log-opts="$LOG_OPTS" --redact --no-banner --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
      - name: Run OPSEC sentinel
        run: uv run --no-sync python scripts/c5_cli/opsec_sentinel_c5.py .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks.sarif
