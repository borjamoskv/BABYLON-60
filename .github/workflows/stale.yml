# C5-REAL EXERGY CERTIFIED
name: "Gestión de Anergía (Stale Issues & PRs)"

on:
  schedule:
    - cron: '30 1 * * *' # Cada noche a la 1:30 AM

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: 'Este Issue ha acumulado entropía (30 días inactivo). Se cerrará en 7 días si no hay colapso físico o comentarios.'
          stale-pr-message: 'Esta Pull Request se ha convertido en Anergía. Se cerrará en 7 días si no se retoma la exergía del código.'
          stale-issue-label: 'anergia'
          stale-pr-label: 'anergia'
          operations-per-run: 50
