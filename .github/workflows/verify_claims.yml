name: Verify Claims (fail-closed)

# Ejecuta la evidencia de cada [claim.*] de CLAIMS.toml con
# scripts/c5_quality_gates/verify_claims.py. Si un claim requerido falla su
# evidencia o ejecuta 0 tests, el verificador sale con 1 y el job FALLA.
# Los bloques [invariants.*] no tienen comando de evidencia y este job no los cubre.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  claims:
    # macOS: varios claims dependen de sandbox-exec / rutas Darwin.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --extra dev --extra gemini

      - name: Cache elan + toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.elan
          key: elan-v4.2.4-${{ runner.os }}-${{ hashFiles('proof/lean/lean-toolchain') }}

      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)
              target=aarch64-apple-darwin
              digest=7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5 ;;
            Darwin-x86_64)
              target=x86_64-apple-darwin
              digest=8a340b309d8ed2e96f930761fa223b3af57a38f5d253b53ac90293c9516f8cd4 ;;
            *) echo "Unsupported elan platform" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/elan.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${target}.tar.gz" -o "$archive"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check --strict
          mkdir -p "$RUNNER_TEMP/elan-verified"
          tar -xzf "$archive" -C "$RUNNER_TEMP/elan-verified"
          "$RUNNER_TEMP/elan-verified/elan-init" -y --default-toolchain none
          TOOLCHAIN="$(cat proof/lean/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          "$HOME/.elan/bin/elan" default "$TOOLCHAIN"
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cada claim tiene 300 s de timeout por defecto; compilar antes evita
      # que una compilación en frío se cuente como fallo de evidencia.
      - name: Prebuild test binaries
        run: |
          cargo test --locked --no-run
          cargo test --locked --no-run --features cortex-persist,cortex-telemetry

      - name: Prebuild bounded Loom model before evidence timeout
        env:
          CARGO_BUILD_JOBS: '1'
          LOOM_MAX_PREEMPTIONS: '2'
          RUSTFLAGS: '--cfg loom'
          CARGO_TARGET_DIR: target/loom
        run: cargo test --locked --test seqlock_loom --release --no-run

      - name: Verify claims (fail-closed)
        run: uv run --locked --no-sync python scripts/c5_quality_gates/verify_claims.py

      - name: Upload claims sitrep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: claims-sitrep
          path: scripts/c5_quality_gates/claims_sitrep.json
          if-no-files-found: warn
