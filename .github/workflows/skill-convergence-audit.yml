name: Skill Convergence Audit
on:
  push:
    branches: ['main']
    paths:
      - '.agents/skills/**'
      - 'tools/skill_library/**'
      - 'scripts/c5_skills_ontology/build_skill_library.py'
      - 'scripts/c5_skills_ontology/maintain_skill_library.py'
      - 'scripts/c5_quality_gates/*skill*.py'
      - 'scripts/c5_quality_gates/audit_semantic_contracts.py'
      - 'tests/test_skill*.py'
      - 'tests/test_semantic_contracts_gate.py'
      - '01_KISH_ENGINE/babylon60/cli/main_dispatcher.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/skill-convergence-audit.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.agents/skills/**'
      - 'tools/skill_library/**'
      - 'scripts/c5_skills_ontology/build_skill_library.py'
      - 'scripts/c5_skills_ontology/maintain_skill_library.py'
      - 'scripts/c5_quality_gates/*skill*.py'
      - 'scripts/c5_quality_gates/audit_semantic_contracts.py'
      - 'tests/test_skill*.py'
      - 'tests/test_semantic_contracts_gate.py'
      - '01_KISH_ENGINE/babylon60/cli/main_dispatcher.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/skill-convergence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Locked regression suite
        run: |
          set -euo pipefail
          skill_tests=(
            tests/test_semantic_contracts_gate.py
            tests/test_skills_manifest.py
            tests/test_skill_links.py
            tests/test_skills_installed_distribution.py
          )
          if python3 -c 'from pathlib import Path; from scripts.c5_quality_gates.public_projection import load_omitted_prefixes; raise SystemExit(0 if "tools/skill_library" in load_omitted_prefixes(Path(".")) else 1)'; then
            echo "NOT_CHECKED: tools/skill_library convergence tests omitted by public projection"
          else
            skill_tests+=(
              tests/test_skill_library_convergence.py
              tests/test_skill_intent_routing.py
              tests/test_skill_maintenance.py
            )
          fi
          uv run --locked --extra dev pytest --noconftest "${skill_tests[@]}" -q
      - name: Generate and check distributions
        run: |
          set -euo pipefail
          if python3 -c 'from pathlib import Path; from scripts.c5_quality_gates.public_projection import load_omitted_prefixes; raise SystemExit(0 if "tools/skill_library" in load_omitted_prefixes(Path(".")) else 1)'; then
            echo "NOT_CHECKED: build_skill_library distributions omitted by public projection"
            python3 scripts/c5_quality_gates/audit_semantic_contracts.py --workspace-only
          else
            uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment codex --output .artifacts/codex
            uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment workspace --output .artifacts/workspace
            uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment antigravity --output .artifacts/antigravity
            python3 scripts/c5_quality_gates/audit_semantic_contracts.py --workspace-only --skills-root .artifacts/codex --skills-root .artifacts/workspace --skills-root .artifacts/antigravity
          fi
      - name: Check local destinations and anchors
        run: |
          set -euo pipefail
          if python3 -c 'from pathlib import Path; from scripts.c5_quality_gates.public_projection import load_omitted_prefixes; raise SystemExit(0 if "tools/skill_library" in load_omitted_prefixes(Path(".")) else 1)'; then
            mkdir -p .artifacts
            python3 scripts/c5_quality_gates/audit_skill_links.py --root .agents/skills --local-only --output .artifacts/local-links.json
          else
            python3 scripts/c5_quality_gates/audit_skill_links.py --root .artifacts/codex --root .artifacts/workspace --root .artifacts/antigravity --local-only --output .artifacts/local-links.json
          fi
  remote-links:
    if: github.repository != 'borjamoskv/BABYLON-60-VAULT' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Strict remote link and anchor audit
        run: |
          set -euo pipefail
          if python3 -c 'from pathlib import Path; from scripts.c5_quality_gates.public_projection import load_omitted_prefixes; raise SystemExit(0 if "tools/skill_library" in load_omitted_prefixes(Path(".")) else 1)'; then
            mkdir -p .artifacts
            python3 scripts/c5_quality_gates/audit_skill_links.py --root .agents/skills --allow-unverified-403-host dash.cloudflare.com --allow-unverified-403-host deploy.workers.cloudflare.com --allow-unverified-403-host www.npmjs.com --output .artifacts/remote-links.json
          else
            uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment codex --output .artifacts/codex
            python3 scripts/c5_quality_gates/audit_skill_links.py --root .artifacts/codex --allow-unverified-403-host dash.cloudflare.com --allow-unverified-403-host deploy.workers.cloudflare.com --allow-unverified-403-host www.npmjs.com --output .artifacts/remote-links.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: skill-link-evidence
          path: .artifacts/*links.json
