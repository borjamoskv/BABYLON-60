name: Skill Convergence Audit
on:
  push:
    branches: ['main', 'codex/**']
    paths:
      - '.agents/skills/**'
      - 'tools/skill_library/**'
      - 'scripts/c5_skills_ontology/build_skill_library.py'
      - 'scripts/c5_skills_ontology/maintain_skill_library.py'
      - 'scripts/c5_quality_gates/*skill*.py'
      - 'scripts/c5_quality_gates/audit_semantic_contracts.py'
      - 'tests/test_skill*.py'
      - 'tests/test_semantic_contracts_gate.py'
      - '01_KISH_ENGINE/babylon60/cli/main_dispatcher.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/skill-convergence-audit.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'tools/skill_library/**'
      - 'scripts/c5_skills_ontology/build_skill_library.py'
      - 'scripts/c5_skills_ontology/maintain_skill_library.py'
      - 'scripts/c5_quality_gates/*skill*.py'
      - 'scripts/c5_quality_gates/audit_semantic_contracts.py'
      - 'tests/test_skill*.py'
      - 'tests/test_semantic_contracts_gate.py'
      - '01_KISH_ENGINE/babylon60/cli/main_dispatcher.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/skill-convergence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Locked regression suite
        run: uv run --locked pytest --noconftest tests/test_skill_library_convergence.py tests/test_skill_intent_routing.py tests/test_skill_maintenance.py tests/test_semantic_contracts_gate.py tests/test_skills_manifest.py tests/test_skill_links.py tests/test_skills_installed_distribution.py -q
      - name: Generate and check distributions
        run: |
          uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment codex --output .artifacts/codex
          uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment workspace --output .artifacts/workspace
          uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment antigravity --output .artifacts/antigravity
          python3 scripts/c5_quality_gates/audit_semantic_contracts.py --workspace-only --skills-root .artifacts/codex --skills-root .artifacts/workspace --skills-root .artifacts/antigravity
      - name: Check local destinations and anchors
        run: python3 scripts/c5_quality_gates/audit_skill_links.py --root .artifacts/codex --root .artifacts/workspace --root .artifacts/antigravity --local-only --output .artifacts/local-links.json
  remote-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv run --locked python scripts/c5_skills_ontology/build_skill_library.py --environment codex --output .artifacts/codex
      - name: Strict remote link and anchor audit
        run: python3 scripts/c5_quality_gates/audit_skill_links.py --root .artifacts/codex --output .artifacts/remote-links.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: skill-link-evidence
          path: .artifacts/*links.json
