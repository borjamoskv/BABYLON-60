name: OS read confinement (Landlock and Seatbelt)

# Real-kernel coverage for babylon60.confine (run / demo / log) on Linux
# (Landlock) and macOS (sandbox-exec). Only confinement code, its tests or this
# workflow trigger it, so ordinary Python or documentation changes do not
# consume macOS minutes.
on:
  push:
    branches: [main]
    paths:
      - '01_KISH_ENGINE/babylon60/confine/**'
      - 'tests/test_confine_*.py'
      - '.github/workflows/confine.yml'
  pull_request:
    branches: [main]
    paths:
      - '01_KISH_ENGINE/babylon60/confine/**'
      - 'tests/test_confine_*.py'
      - '.github/workflows/confine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landlock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The recorded evidence must name the branch commit, not a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --extra dev
      - name: Landlock confinement tests (unprivileged runner user)
        # The -q -rsxX log names failures, xfails and xpasses, gives a skip's place and reason but not its
        # test, and only counts passes; the JUnit XML records every test's outcome by name.
        run: >-
          uv run --locked --no-sync pytest -q -rsxX --maxfail=100
          --junitxml="$RUNNER_TEMP/junit-linux.xml" tests/test_confine_*.py
        env:
          BABYLON60_REQUIRE_LANDLOCK: "1"
      - name: Record the first-block demo as evidence
        run: |
          # Keep the evidence even when the verdict is FALSIFIED (1) or INCONCLUSIVE (2).
          status=0
          uv run --locked --no-sync babylon60 demo --journal "$RUNNER_TEMP/journal.db" --json "$RUNNER_TEMP/demo-linux.json" || status=$?
          echo "::group::first-block evidence JSON"
          cat "$RUNNER_TEMP/demo-linux.json"
          echo "::endgroup::"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: first-block-demo-linux
          path: ${{ runner.temp }}/demo-linux.json
          if-no-files-found: error
      # Last, so the demo still depends only on the tests passing; recorded whatever happened above.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: confine-junit-linux
          path: ${{ runner.temp }}/junit-linux.xml
          if-no-files-found: error

  seatbelt:
    runs-on: macos-15
    # The tests took 7 minutes at ae39991; the positive controls (clang modules, a venv, Chrome,
    # lldb, hdiutil) add real tool runs with their own timeouts, and a cancelled job measures nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The recorded evidence must name the branch commit, not a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --extra dev
      - name: Seatbelt confinement tests
        # The -q -rsxX log names failures, xfails and xpasses, gives a skip's place and reason but not its
        # test, and only counts passes; the JUnit XML records every test's outcome by name.
        run: >-
          uv run --locked --no-sync pytest -q -rsxX --maxfail=100
          --junitxml="$RUNNER_TEMP/junit-macos.xml" tests/test_confine_*.py
        env:
          BABYLON60_REQUIRE_SEATBELT: "1"
      - name: Record the first-block demo as evidence
        run: |
          # Keep the evidence even when the verdict is FALSIFIED (1) or INCONCLUSIVE (2).
          status=0
          uv run --locked --no-sync babylon60 demo --journal "$RUNNER_TEMP/journal.db" --json "$RUNNER_TEMP/demo-macos.json" || status=$?
          echo "::group::first-block evidence JSON"
          cat "$RUNNER_TEMP/demo-macos.json"
          echo "::endgroup::"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: first-block-demo-macos
          path: ${{ runner.temp }}/demo-macos.json
          if-no-files-found: error
      # Last, so the demo still depends only on the tests passing; recorded whatever happened above.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: confine-junit-macos
          path: ${{ runner.temp }}/junit-macos.xml
          if-no-files-found: error
