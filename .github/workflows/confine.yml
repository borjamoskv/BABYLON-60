name: OS read confinement (Landlock and Seatbelt)

# Real-kernel coverage for babylon60.confine (run / demo / log) on Linux
# (Landlock) and macOS (sandbox-exec). Only confinement code, its tests or this
# workflow trigger it, so ordinary Python or documentation changes do not
# consume macOS minutes.
on:
  push:
    branches: [main]
    paths:
      - '01_KISH_ENGINE/babylon60/confine/**'
      - 'tests/test_confine_*.py'
      - '.github/workflows/confine.yml'
  pull_request:
    branches: [main]
    paths:
      - '01_KISH_ENGINE/babylon60/confine/**'
      - 'tests/test_confine_*.py'
      - '.github/workflows/confine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landlock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The recorded evidence must name the branch commit, not a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --extra dev
      - name: Landlock backend, policy, journal, demo and CLI (unprivileged runner user)
        run: >-
          uv run --locked --no-sync pytest -q -rs
          tests/test_confine_landlock.py tests/test_confine_policy.py tests/test_confine_journal.py
          tests/test_confine_demo.py tests/test_confine_cli.py
        env:
          BABYLON60_REQUIRE_LANDLOCK: "1"
      - name: Record the first-block demo as evidence
        run: |
          uv run --locked --no-sync babylon60 demo --journal "$RUNNER_TEMP/journal.db" --json "$RUNNER_TEMP/demo-linux.json"
          echo "::group::first-block evidence JSON"
          cat "$RUNNER_TEMP/demo-linux.json"
          echo "::endgroup::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-block-demo-linux
          path: ${{ runner.temp }}/demo-linux.json
          if-no-files-found: error

  seatbelt:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The recorded evidence must name the branch commit, not a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --extra dev
      - name: Seatbelt backend, policy, journal, demo and CLI
        run: >-
          uv run --locked --no-sync pytest -q -rs
          tests/test_confine_seatbelt.py tests/test_confine_policy.py tests/test_confine_journal.py
          tests/test_confine_demo.py tests/test_confine_cli.py
        env:
          BABYLON60_REQUIRE_SEATBELT: "1"
      - name: Record the first-block demo as evidence
        run: |
          uv run --locked --no-sync babylon60 demo --journal "$RUNNER_TEMP/journal.db" --json "$RUNNER_TEMP/demo-macos.json"
          echo "::group::first-block evidence JSON"
          cat "$RUNNER_TEMP/demo-macos.json"
          echo "::endgroup::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-block-demo-macos
          path: ${{ runner.temp }}/demo-macos.json
          if-no-files-found: error
