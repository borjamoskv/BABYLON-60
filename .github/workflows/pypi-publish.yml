name: Publish Signed Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  pypi-publish:
    name: Build, Sign & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/babylon60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python & UV
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install UV & Twine
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python -m pip install --upgrade pip twine

      - name: Build Package Artifacts (sdist & wheel)
        run: uv build

      - name: Verify Package Metadata
        run: twine check dist/*

      - name: Generate Build Attestation (SLSA Provenance)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'



      - name: Publish Package to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true
