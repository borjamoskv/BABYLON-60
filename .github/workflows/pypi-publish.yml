name: Publish Signed Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  pypi-publish:
    name: Build, Sign & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/babylon60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & UV
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV & Twine
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python -m pip install --upgrade pip twine

      - name: Build Package Artifacts (sdist & wheel)
        run: uv build

      - name: Verify Package Metadata
        run: twine check dist/*

      - name: Generate Build Attestation (SLSA Provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Sign Distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Publish Package to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true
