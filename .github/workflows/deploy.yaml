name: Deploy to Dev

on:
  push:
    branches: [main]

# WIF (INV_C5_02 — sin claves JSON en secrets): el job canjea el OIDC
# de GitHub por credenciales GCP de corta duración. Requiere los secrets
# GCP_WORKLOAD_IDENTITY_PROVIDER y GCP_SERVICE_ACCOUNT.
# Setup: docs/GCP_WORKLOAD_IDENTITY_SETUP.md
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"
      - uses: google-github-actions/setup-gcloud@v1
      - run: gcloud components update --quiet
      - run: gcloud components install beta --quiet
      - uses: astral-sh/setup-uv@v7
      - run: gcloud beta orchestration-pipelines deploy --environment=dev --quiet
