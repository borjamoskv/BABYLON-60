name: HotStuff Benchmark
on:
  push:
    paths:
      - 'cortex/consensus/**'
      - 'ultrathink/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'cortex/consensus/**'
      - 'ultrathink/**'

jobs:
  # NOTA: el job rust-tests fue eliminado — el crate `cortex/consensus` no
  # existe en este linaje (nunca fue vendorizado). El núcleo Rust vivo es
  # strike_rs, cubierto por tests/test_re_drm_rust.py en la suite pytest.
  python-tests:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest pytest-asyncio
      - name: Run scheduler tests
        run: PYTHONPATH=. pytest tests/test_hotstuff_consensus.py -v
