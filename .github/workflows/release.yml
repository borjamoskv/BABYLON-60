name: Release Automation & SBOM Generation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  discussions: write

jobs:
  release:
    name: Build Release & SBOM (SLSA Level 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools & SBOM Generator
        run: |
          python -m pip install --upgrade pip build cyclonedx-bom

      - name: Build Source and Binary Distributions
        run: |
          python -m build

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment -o sbom.json

      - name: Generate Release Notes via Conventional Commits
        id: release_notes
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
