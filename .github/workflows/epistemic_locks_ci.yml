name: Epistemic Locks Governance Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-epistemic-locks:
    name: Verify Epistemic Locks & Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated Epistemic Locks Audit
        run: |
          python3 scripts/verify_epistemic_locks.py
