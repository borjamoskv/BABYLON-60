name: C11 Memory Model Loom Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main", "iter*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loom-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    
    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: stable
        
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        
    - name: Run Loom Data Race Verification
      run: cargo test --locked --test seqlock_loom --release
      env:
        LOOM_MAX_PREEMPTIONS: 2
        RUSTFLAGS: "--cfg loom"
