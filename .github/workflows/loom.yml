name: C11 Memory Model Loom Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'crates/**'
      - '00_ABZU_KERNEL/**'
      - 'tests/*loom*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/loom.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'crates/**'
      - '00_ABZU_KERNEL/**'
      - 'tests/*loom*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/loom.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loom-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (parent v1, 2026-10-16)
      with:
        toolchain: stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Run Loom Data Race Verification
      run: cargo test --locked --test seqlock_loom --release
      env:
        LOOM_MAX_PREEMPTIONS: 2
        RUSTFLAGS: "--cfg loom"

    - name: Run Tamkarum Loom Verification
      run: cargo test --locked --lib tamkarum --release
      env:
        LOOM_MAX_PREEMPTIONS: 2
        RUSTFLAGS: "--cfg loom"
