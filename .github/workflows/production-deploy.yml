name: Production Deployment (GHCR)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-ghcr
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require main and successful gates for the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          for workflow in ci.yml python-tests.yml gitleaks.yml dependency-audit.yml verify_ledger.yml verify_claims.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$GITHUB_SHA" --branch main --event push --limit 1 \
              --json headSha,status,conclusion,event,headBranch \
              | python3 scripts/guards/verify_publish_run.py
          done

  prepare-image:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build once without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Display exact archive and publication execution
        env:
          ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          sha256sum "$ARCHIVE" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA; run: $GITHUB_RUN_ID; attempt: $GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prepared-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 7

  verify-regulated-release:
    needs: prepare-image
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prepared-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Load protected policy and fetch execution-bound authorization
        env:
          POLICY_JSON: ${{ vars.EU_AI_ACT_POLICY_JSON }}
          AUTHORIZATION_BASE_URL: ${{ vars.EU_AI_ACT_AUTHORIZATION_BASE_URL }}
        run: |
          uv run --locked python scripts/guards/prepare_regulated_release.py --output "$RUNNER_TEMP/regulatory"
      - name: Verify before any publication credential is granted
        run: |
          uv run --locked python scripts/guards/verify_regulated_release.py --artifact "$RUNNER_TEMP/prepared/image.tar" --policy "$RUNNER_TEMP/regulatory/policy.json" --receipt "$RUNNER_TEMP/regulatory/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checked-regulatory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regulatory/
          retention-days: 7

  publish-image:
    needs: verify-regulated-release
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prepared-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: checked-regulatory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/previous-regulatory
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Refresh protected policy and revocations after approval
        env:
          POLICY_JSON: ${{ vars.EU_AI_ACT_POLICY_JSON }}
          AUTHORIZATION_BASE_URL: ${{ vars.EU_AI_ACT_AUTHORIZATION_BASE_URL }}
        run: |
          uv run --locked python scripts/guards/prepare_regulated_release.py --output "$RUNNER_TEMP/regulatory"
          cmp "$RUNNER_TEMP/previous-regulatory/policy.json" "$RUNNER_TEMP/regulatory/policy.json"
          uv run --locked python scripts/guards/verify_regulated_release.py --artifact "$RUNNER_TEMP/prepared/image.tar" --policy "$RUNNER_TEMP/regulatory/policy.json" --receipt "$RUNNER_TEMP/regulatory/receipt.json"
      - name: Recheck main and exact-commit CI gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          for workflow in ci.yml python-tests.yml gitleaks.yml dependency-audit.yml verify_ledger.yml verify_claims.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --branch main --event push --limit 1 --json headSha,status,conclusion,event,headBranch | python3 scripts/guards/verify_publish_run.py
          done
      - name: Install archive transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
      - name: Login after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Reverify and publish the prebuilt archive without rebuilding
        id: publish
        run: |
          uv run --locked python scripts/guards/verify_regulated_release.py --artifact "$RUNNER_TEMP/prepared/image.tar" --policy "$RUNNER_TEMP/regulatory/policy.json" --receipt "$RUNNER_TEMP/regulatory/receipt.json"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/image.digest" "oci-archive:$RUNNER_TEMP/prepared/image.tar" "docker://$IMAGE:sha-$GITHUB_SHA"
          DIGEST="$(cat "$RUNNER_TEMP/image.digest")"
          skopeo copy --all --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
      - name: Sign the published digest
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
