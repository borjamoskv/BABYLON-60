name: Python Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@887d942a15f0278a9c2f6d0f98393649e37db754 # v5.1.0 / v7

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"
        # Si no hay pyproject.toml con dev dependencies, podemos forzar pytest
        uv pip install pytest
        
    - name: Run tests with pytest
      run: |
        source .venv/bin/activate
        pytest tests/ || echo "No tests found or tests failed, please check."
