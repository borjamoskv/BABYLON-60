# C5-REAL EXERGY CERTIFIED
name: Python Tests & Popperian Verification

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Build Kernel
      run: cargo build -p cortex_kernel

    - name: Run Popperian Falsification Gate
      run: python3 scripts/verify_popper_coverage.py

    - name: Run compliance suite tests
      run: |
        PYTHONPATH=src/cortex-engine pytest tests/
