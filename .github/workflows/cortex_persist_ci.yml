name: Cortex Persist CI
on: { push: { branches: [main] }, pull_request: }
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in $(find . -name "*.json" -not -path "./.git/*"); do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - run: test -f AGENTS.md && test -d .agents/skills
