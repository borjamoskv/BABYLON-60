name: C5-REAL Structural CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-asyncio pytest-cov ruff mypy anyio
        
    - name: Lint and Format Check (Ruff)
      run: |
        ruff check babylon60 tests
        ruff format --check babylon60 tests
        
    - name: Type Checking (Mypy)
      run: |
        mypy babylon60/bft babylon60/database babylon60/core babylon60/cli babylon60/crypto babylon60/utils
        
    - name: Causal Taint & BFT Tests (Pytest)
      run: |
        pytest tests/ -v
