name: BABYLON-60 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv && uv sync --all-extras
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy babylon60/ --ignore-missing-imports
      - run: .venv/bin/python -m pytest tests/ -x --tb=short -q
  
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd strike_rs && cargo test
      - run: cd strike_rs && cargo clippy -- -D warnings
