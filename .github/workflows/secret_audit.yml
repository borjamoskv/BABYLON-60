name: C5-REAL Secret Sentinel

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Ignición Diaria

jobs:
  audit-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup C5-REAL Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Execute Swarm Transductor (TOP SECRET Audit)
      run: |
        echo "[*] Initializing BFT_STATE_LOOP Secret Auditor..."
        python3 scripts/secret_swarm_auditor.py
        
    - name: Fail on Entropy Breach
      run: |
        # Validar si el Master Ledger detecta anomalías
        if grep -q "## VULNERABILIDADES DETECTADAS" AUDITORIA_TOP_SECRET.md; then
          echo "::error::[C5-REAL] ANERGÍA CRÍTICA: Se ha detectado entropía TOP SECRET en el código fuente."
          cat AUDITORIA_TOP_SECRET.md
          exit 1
        else
          echo "[*] C5-REAL: ESTADO BFT LIMPIO. Cero fricción estructural."
          exit 0
        fi
