name: C5-REAL Secret Sentinel (ULTRATHINK P0)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Scan checked-out sources
        run: python3 scripts/c5_quality_gates/secret_swarm_auditor.py --sarif --sarif-output "$RUNNER_TEMP/secret_audit.sarif"
      - name: Preserve SARIF without requiring GitHub Code Security
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-audit-sarif
          path: ${{ runner.temp }}/secret_audit.sarif
