# ============================================
# GITHUB ACTIONS — Escaneo continuo de secretos
# ============================================
name: "🔒 Security — Secret Scan"

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, develop, staging]
  schedule:
    - cron: '0 6 * * 1'  # Lunes 6AM — escaneo completo semanal

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ---- JOB 1: Gitleaks ----
  gitleaks:
    name: "🔍 Gitleaks Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historial completo para escanear todo

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: true     # Comenta en PRs

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ---- JOB 2: TruffleHog (segunda capa) ----
  trufflehog:
    name: "🐷 TruffleHog Deep Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified

  # ---- JOB 3: Checkov (IaC Security) ----
  iac-scan:
    name: "🏗️ IaC Security Scan"
    runs-on: ubuntu-latest
    if: >
      contains(github.event.head_commit.message, 'terraform') ||
      contains(github.event.head_commit.message, 'infra') ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          framework: terraform,cloudformation,kubernetes,dockerfile
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

  # ---- JOB 4: Notificación de fallo ----
  notify-on-failure:
    name: "🚨 Alert on Failure"
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: failure()
    steps:
      - name: Alert
        run: |
          echo "::error::🚨 SECRET DETECTADO — Se requiere acción INMEDIATA"
          echo "## Pasos:"
          echo "1. NO mergear este PR"
          echo "2. Rotar TODOS los secretos detectados"
          echo "3. Ejecutar el plan de limpieza de historial"
          echo "4. Notificar al equipo de seguridad"

      # Descomenta para Slack:
