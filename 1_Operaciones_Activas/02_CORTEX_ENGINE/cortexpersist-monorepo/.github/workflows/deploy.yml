name: Production Monorepo Deploy — CortexPersist C5-REAL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  deploy:
    name: Deploy All Apps
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_SIGNING_PRIVATE_KEY: ${{ secrets.CORTEX_SIGNING_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Deploy cortexpersist-com
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --cwd apps/cortexpersist-com
      - name: Deploy cortexpersist-dev
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --cwd apps/cortexpersist-dev
      - name: Deploy cortexpersist-org
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --cwd apps/cortexpersist-org
      - name: Deploy agents-archi
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --cwd apps/agents-archi
      - name: Deploy edge-middleware (Cloudflare Worker)
        working-directory: workers/edge-middleware
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pr-preview:
    name: PR Preview Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Comment preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployments — C5-REAL\n\n| App | Domain | Status |\n|---|---|---|\n| cortexpersist-com | cortexpersist.com | 🔄 deploying |\n| cortexpersist-dev | cortexpersist.dev | 🔄 deploying |\n| cortexpersist-org | cortexpersist.org | 🔄 deploying |\n| agents-archi | agents.archi | 🔄 deploying |\n\n> Anchored via CORTEX-Persist · Ω₂ Entropic Asymmetry`
            })
