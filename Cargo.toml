# C5-REAL EXERGY CERTIFIED
[workspace]
resolver = "2"
members = [
    "src/01_kernel/ring0_rust",
    "src/01_kernel/ipc_daemon",
    "src/02_engines/cortex_wasm",
    "src/02_engines/strike_rs",
    "src/02_engines/legion_engine/legion-core",
    "src/02_engines/legion_engine/legion-apfs",
    "src/02_engines/legion_engine/legion-exergy",
    "src/02_engines/legion_engine/legion-healer",
    "src/02_engines/legion_engine/legion-cli",
    "src/02_engines/legion_engine/legion-lang",
    "src/03_state/scitt_ledger/kernel_rs",
    "tests/compliance-suite"
, "src/02_engines/cortex_guard/rust_core"]

# Perfil para desarrollo rápido (Alineado con el C5-REAL)
[profile.dev]
opt-level = 0
debug = true

# Perfil C5-REAL para despliegue
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort" # Invariante Fail-Stop: no hacer unrolling de stack en errores críticos
