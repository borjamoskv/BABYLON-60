[workspace]
members = [
    "00_BABYLON_SHIELD/crates/*",
    "01_CORTEX_ENGINE/crates/*"
]
exclude = [
    "packages/*",
    "00_BABYLON_SHIELD/formal_verification"
]
resolver = "2"

[package]
name = "babylon60_root"
version = "4.0.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0 OR MIT"
description = "SharedManifest (64 B, fail-stop, EU AI Act) — BABYLON-60 formal specification"
repository = "https://github.com/borjamoskv/BABYLON-60"
readme = "README.md"
authors = ["Borja Moskv <borjamoskv@github.com>"]

[lib]
name = "babylon60"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
coset = { version = "0.3", optional = true }
ciborium = { version = "0.2", optional = true }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"

[features]
default = ["halt-receipt", "std"]
python = ["dep:pyo3"]
halt-receipt = ["dep:coset", "dep:ciborium"]
cortex-persist = ["dep:rusqlite", "dep:sha2", "dep:hex"]
cortex-telemetry = ["dep:serde", "dep:serde_json"]
std = []

[dev-dependencies]
loom = { version = "0.7" }
proptest = "1.0"
num-bigint = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.9.5"

[[test]]
name = "replay"
path = "tests/replay/mod.rs"

[[test]]
name = "differential"
path = "tests/differential/mod.rs"

[[test]]
name = "property"
path = "tests/property/mod.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bin]]
name = "babylon60_kernel"
path = "src/bin/babylon60_kernel.rs"

[[bin]]
name = "tpm_worm_poc"
path = "src/bin/tpm_worm_poc.rs"
required-features = ["cortex-persist"]
