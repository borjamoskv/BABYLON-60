[workspace]
members = [
    "crates/*"
]
resolver = "2"

[package]
name = "babylon60_root"
version = "4.0.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0 OR MIT"
description = "SharedManifest (64 B, fail-stop, EU AI Act) — BABYLON-60 formal specification"
repository = "https://github.com/borjamoskv/BABYLON-60"
readme = "README.md"
authors = ["Borja Moskv <borjamoskv@github.com>"]

[lib]
name = "babylon60"
path = "src/lib.rs"

[dependencies]
coset = { version = "0.3", optional = true }
ciborium = { version = "0.2", optional = true }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["halt-receipt", "std"]
halt-receipt = ["dep:coset", "dep:ciborium"]
cortex-persist = ["dep:rusqlite", "dep:sha2", "dep:hex"]
cortex-telemetry = ["dep:serde", "dep:serde_json"]
std = []

[dev-dependencies]
loom = { version = "0.7" }
proptest = "1.0"
num-bigint = "0.4"
sha2 = "0.10"
hex = "0.4"

[[test]]
name = "replay"
path = "tests/replay/mod.rs"

[[test]]
name = "differential"
path = "tests/differential/mod.rs"

[[test]]
name = "property"
path = "tests/property/mod.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
