[workspace]
members = [
    "crates/cadt_mediator",
    "00_ABZU_KERNEL/crates/*", "01_KISH_ENGINE/cortex/crates/*",
    "crates/*"
]
exclude = [
    "packages/*",
    "00_ABZU_KERNEL/formal_verification"
]
resolver = "2"

[package]
name = "babylon60_root"
version = "5.0.0"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE"
publish = false
description = "SharedManifest (64 B, fail-stop, EU AI Act) — BABYLON-60 formal specification"
repository = "https://github.com/borjamoskv/BABYLON-60"
readme = "README.md"
authors = ["Borja Moskv <borjamoskv@github.com>"]

[lib]
name = "babylon60"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
coset = { version = "0.3", optional = true }
ciborium = { version = "0.2", optional = true }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
base64ct = { version = "1.8", features = ["alloc"] }
libc = "0.2.190"


[features]
default = ["halt-receipt", "std", "cortex-persist", "research-math", "larsa-bft"]
microkernel = ["halt-receipt", "std", "cortex-persist"]
research-math = []
larsa-bft = []
python = ["dep:pyo3", "larsa-bft"]
halt-receipt = ["dep:coset", "dep:ciborium"]
cortex-persist = ["dep:rusqlite", "dep:sha2", "dep:hex", "dep:serde", "dep:serde_json"]
cortex-telemetry = ["dep:serde", "dep:serde_json"]
std = []
test_mock_hardware = []


[dev-dependencies]
loom = { version = "0.7" }
proptest = "1.0"
num-bigint = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"

[[test]]
name = "replay"
path = "tests/replay/mod.rs"

[[test]]
name = "differential"
path = "tests/differential/mod.rs"

[[test]]
name = "property"
path = "tests/property/mod.rs"

[[test]]
name = "seqlock_loom"
path = "tests/seqlock_loom.rs"

[[test]]
name = "adversarial_nemesis"
path = "tests/adversarial_nemesis.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "babylon60_kernel"
path = "src/bin/babylon60_kernel.rs"

[[bin]]
name = "babylon60"
path = "src/babylon60.rs"

[[bin]]
name = "babylon_top"
path = "src/bin/babylon_top.rs"
required-features = ["cortex-persist"]

[[bin]]
name = "tour"
path = "src/bin/tour.rs"
test = false
