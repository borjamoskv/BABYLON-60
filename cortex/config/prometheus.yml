global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cortex_telemetry'
    static_configs:
      # Puerto a definir por el endpoint de telemetría BPF/Python
      - targets: ['host.docker.internal:8000']
