meta:
  id: "ONTO-13-BABYLON60-ORGANISMOS"
  title: "Isomorfismos Estructurales Babilonia ↔ Organismos Biológicos"
  confidence: C5-REAL
  rigor_nota: >
    Casi ninguna pareja civilización↔organismo es perfectamente biyectiva.
    Son homomorfismos estructurales o 'leyes isomorfas' (Bertalanffy TGS):
    la misma forma abstracta realizada en materiales distintos.
    Hay un gradiente que va del isomorfismo casi literal a la analogía sugerente.
  fuentes_primarias:
    - "Ludwig von Bertalanffy — Teoría General de Sistemas (1968)"
    - "Norbert Wiener — Cybernetics (1948)"
    - "Geoffrey West, James Brown, Brian Enquist — Scaling Laws (1997, Santa Fe Institute)"
    - "Cecil D. Murray — The Physiological Principle of Minimum Work (1926)"
    - "Lewis Wolpert — Positional Information and the Spatial Pattern of Cellular Differentiation (1969)"

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 1: HIDRÁULICO (Rigor: CASI BIYECTIVO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_hidraulico:
  rigor: "Isomorfismo casi literal — mismas ecuaciones"
  dominio_A: "Red de canales Tigris-Éufrates"
  dominio_B: "Xilema/Floema (plantas) · Arterias/Capilares (animales)"
  mapeo:
    topologia: "Árbol de transporte ramificado que alimenta un área"
    ley_formal: "Ley de Murray (bifurcaciones óptimas) · West-Brown-Enquist (escalamiento metabólico)"
    patologia_azolvamiento:
      babilonia: "Azolvamiento de canales por sedimento"
      biologia: "Arteriosclerosis — pérdida de caudal por depósito"
      mapeo: "Isomórfico"
    patologia_salinizacion:
      babilonia: "Riego sin drenaje → sales acumuladas → cambio trigo→cebada → colapso rendimientos"
      biologia: "Acumulación de desechos metabólicos que el sistema no logra excretar → senescencia"
      mapeo: "Isomórfico (dinámico, no solo metáfora)"
      dinamica: >
        Variable lenta que se acumula de modo monótono hasta cruzar un umbral.
        El éxito erosionando su propio sustrato.
        Forma de la senescencia, sobrepaso ecológico, punto de no retorno.

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 2: BASE-60 COMO TOLERANCIA A FALLOS (Rigor: HOMOMORFISMO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_base60:
  rigor: "Homomorfismo estructural"
  dominio_A: "Base sexagesimal (60 = mín. divisible por 1-6, altamente compuesto)"
  dominio_B: "Degeneración del código genético"
  mapeo:
    principio: "Alta divisibilidad = tolerancia a fallos"
    babilonia: "Casi cualquier partición sale exacta en base 60"
    biologia: "Varios codones por aminoácido, rutas metabólicas redundantes"
    invariante: "Muchos caminos al mismo resultado → robustez"

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 3: NOTACIÓN POSICIONAL ↔ MORFÓGENOS (Rigor: HOMOMORFISMO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_posicional:
  rigor: "Homomorfismo estructural"
  dominio_A: "Notación posicional sexagesimal (signo vale 1, 60, o 3600 según lugar)"
  dominio_B: "Información posicional embrionaria (modelo 'Bandera Francesa' de Wolpert)"
  mapeo:
    principio: "Mismo símbolo, distinto significado según posición"
    babilonia: "Un mismo cuneiforme cambia de valor según la columna"
    biologia: "El destino celular lo fija su posición en un gradiente de morfógenos"
    problema_cero:
      babilonia: "Tardaron en usar marcador de posición; nunca tuvieron cero terminal"
      biologia: "Problema evolutivo de interpretar la ausencia de señal: ¿es cero o es un borde?"
      mapeo: "Analogía fuerte"

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 4: CUNEIFORME ↔ HERENCIA (Rigor: HOMOMORFISMO RICO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_cuneiforme_herencia:
  rigor: "Homomorfismo rico — casi todas las relaciones preservadas"
  dominio_A: "Sistema cuneiforme (código discreto combinatorio en arcilla)"
  dominio_B: "Código genético (ADN)"
  tabla_mapeo:
    - par: ["Tablilla", "Cromosoma"]
    - par: ["Inventario de signos", "Alfabeto de codones"]
    - par: ["Escriba (lee y reinstancia)", "Polimerasa / Ribosoma"]
    - par: ["Edubba (escuela de corrección)", "Maquinaria de corrección de errores"]
    - par: ["Recensión canónica (Gilgamesh estándar)", "Genoma de consenso conservado"]
    - par: ["Deslices de copia", "Mutaciones"]
    - par: ["Stemma textual", "Filogenia"]
  invariante: >
    Información almacenada de forma discreta, replicada con error y curada por selección.
    El bucle que define lo hereditario, en versión lamarckiana y horizontal
    (las ideas saltan de lado y se eligen a propósito).

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 5: CATÁLOGOS DE PRESAGIOS ↔ CODIFICACIÓN PREDICTIVA (Rigor: HOMOMORFISMO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_presagios:
  rigor: "Homomorfismo estructural"
  dominio_A: "Enuma Anu Enlil (celeste), Extispicina hepática (tablas si X → Y)"
  dominio_B: "Codificación predictiva cerebral · Memoria inmunológica"
  mapeo:
    principio: "Priors acumulados contrastados con señal entrante para anticipar"
    babilonia: "Tablas enormes de 'si observo X, entonces Y'"
    neurociencia: "Percibir = minimizar sorpresa contra un modelo generativo"
    inmunologia: "Antígeno → respuesta (memoria de encuentros previos)"

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 6: ASTRONOMÍA ARITMÉTICA ↔ FOURIER / RELOJES BIOLÓGICOS (Rigor: HOMOMORFISMO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_astronomia:
  rigor: "Homomorfismo estructural"
  dominio_A: "Funciones zigzag, escalón, ciclo Saros (~18 años), Sistemas A y B"
  dominio_B: "Análisis de Fourier · Relojes circadianos · Ciclo celular"
  mapeo:
    principio: "Fenómeno complejo descompuesto en periodicidades superpuestas"
    babilonia: "Descubrimiento empírico de la descomposición periódica de eclipses"
    biologia: "Relojes circadianos y de ciclo celular acoplados"
    matematica: "Intuición pre-Fourier: superposición de ondas periódicas"

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 7: CÓDIGO HAMMURABI ↔ CONTROLADOR RETROALIMENTACIÓN (Rigor: HOMOMORFISMO)
# ═══════════════════════════════════════════════════════════════
isomorfismo_hammurabi:
  rigor: "Homomorfismo estructural"
  dominio_A: "Código de Hammurabi (lex talionis: transgresión → respuesta proporcional)"
  dominio_B: "Controlador PID por retroalimentación · Discriminación inmune propio/ajeno"
  mapeo:
    principio: "Detectar desviación de punto de consigna, corregir en proporción al error"
    babilonia: "Reglas condicionales con castigo escalado a la ofensa"
    ingenieria: "Controlador proporcional (P-controller)"
    inmunologia: "Discriminar propio de ajeno con respuesta graduada"

# ═══════════════════════════════════════════════════════════════
# ISOMORFISMO 8: ECONOMÍA REDISTRIBUTIVA ↔ METABOLISMO SUPERORGANISMO (Rigor: ANALOGÍA FUERTE)
# ═══════════════════════════════════════════════════════════════
isomorfismo_zigurat:
  rigor: "Analogía fuerte (no estrictamente biyectivo)"
  dominio_A: "Templo-zigurat pooleando grano para redistribuirlo"
  dominio_B: "Colonia de hormigas · Metabolismo corporal"
  mapeo:
    principio: "Integrador central que amortigua flujos frente a choques"
    babilonia: "Zigurat como buffer central contra hambruna/estación"
    biologia: "Hígado como buffer metabólico contra ayuno/estrés"
    superorganismo: "Colonia de hormigas poolea recursos centralmente"

# ═══════════════════════════════════════════════════════════════
# CONVERGENCIA: POR QUÉ RIMAN
# ═══════════════════════════════════════════════════════════════
razon_convergencia:
  tesis: >
    Los tres (ciudad, cuerpo, 'sistema') son sistemas abiertos que mantienen su
    organización mediante flujo de materia, energía e información bajo restricción
    y selección. Dado ese apretado espacio de soluciones, las arquitecturas convergen.
  patrones_convergentes:
    - "Transporte ramificado"
    - "Regulación por retroalimentación"
    - "Códigos discretos replicables"
    - "Redundancia para robustez"
    - "Dinámica descompuesta en ciclos"
  evidencia: "West et al. — una sola ley de potencia atravesando organismos, ciudades y empresas"

# ═══════════════════════════════════════════════════════════════
# PUNTOS DE FRACTURA (Disanalogías — dónde se ROMPE el mapeo)
# ═══════════════════════════════════════════════════════════════
puntos_fractura:
  descripcion: "Nombrar dónde falla el isomorfismo es parte del análisis"
  fracturas:
    - id: "F1_INTENCIONALIDAD"
      fractura: "Una civilización tiene agentes con intención; un organismo no (a nivel sistémico)"
    - id: "F2_HERENCIA_HORIZONTAL"
      fractura: "La herencia cultural es editable, lamarckiana y horizontal; la biológica es vertical y ciega"
    - id: "F3_CUELLO_BOTELLA"
      fractura: "Sin cuello de botella reproductivo limpio (no hay 'generación' discreta en civilizaciones)"
    - id: "F4_FRONTERAS_POROSAS"
      fractura: "Las fronteras de una civilización son porosas; las de un organismo son rígidas (membrana)"
  conclusion: "El isomorfismo es rico, no biyectivo"
