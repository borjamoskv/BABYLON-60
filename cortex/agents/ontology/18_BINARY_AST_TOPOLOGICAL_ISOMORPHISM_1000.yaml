# --- MATRIZ DE INSTRUMENTACIÓN DTRACE & FRIDA FOR SYSCALL & CALL-TREE RECOVERY ---
syscall_instrumentation_matrix:
  dtrace_kernel_script: |
    #pragma D option quiet
    #pragma D option destructive
    
    /* dtrace script to verify C5-REAL topological coincidence in real-time */
    self int in_mtk_core;
    
    syscall::openat:entry
    /execname == "python3" || execname == "cortex_engine"/
    {
        this->path = copyinstr(arg1);
        if (strstr(this->path, "cortex.db") != NULL || strstr(this->path, "nexus_anchors.db") != NULL) {
            printf("[C5-REAL DTRACE] Syscall OPENAT on Master DB: %s (Flags: 0x%x)\n", this->path, arg2);
            self->in_mtk_core = 1;
        }
    }
    
    syscall::write:entry
    /self->in_mtk_core/
    {
        printf("[C5-REAL DTRACE] Syscall WRITE to Master DB FD %d | Bytes: %d\n", arg0, arg2);
        ustack(20);
    }
    
    syscall::close:entry
    /self->in_mtk_core && arg0 > 2/
    {
        self->in_mtk_core = 0;
    }

  frida_interceptor_script: |
    /* Frida Script: Structural Call-Tree & V8/Native Bridge Extraction */
    'use strict';
    
    const TARGET_MODULES = ['libsqlite3.dylib', 'libSystem.B.dylib'];
    
    TARGET_MODULES.forEach(modName => {
        const mod = Process.findModuleByName(modName);
        if (!mod) return;
        
        const symbols = mod.enumerateExports();
        symbols.forEach(sym => {
            if (sym.name.indexOf('sqlite3_step') !== -1 || sym.name.indexOf('sqlite3_prepare') !== -1) {
                Interceptor.attach(sym.address, {
                    onEnter: function(args) {
                        if (sym.name.indexOf('prepare') !== -1) {
                            this.sql = args[1].readUtf8String();
                            send({ type: 'SQLITE_PREPARE', sql: this.sql, threadId: this.threadId });
                        }
                        send({ type: 'CALL_TREE_NODE', function: sym.name, backtrace: Thread.backtrace(this.context, Backtracer.ACCURATE).map(DebugSymbol.fromAddress).join('\n') });
                    }
                });
            }
        });
    });

