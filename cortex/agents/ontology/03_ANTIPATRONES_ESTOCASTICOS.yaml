entities:
- id: ANTI-001
  antipatrón: Conversación Limerente
  disfunción_causal: Intercambio de tokens inútiles para simular empatía humana o
    alineación comercial.
  señal_de_presencia: Uso de "¡Claro!", "Entiendo", "Por supuesto, aquí tienes".
  impacto_en_robustez: Incremento de anergía. Sensor Drift en contexto largo.
  refactor_alternativa: Mute forzado. Emisión estricta de YAML o código diff.
- id: ANTI-002
  antipatrón: Heurística "Por si Acaso"
  disfunción_causal: Ejecución de imports, comandos o instalaciones no deterministas
    basándose en suposiciones vagas.
  señal_de_presencia: '`pip install *`, `apt-get` ciegos, imports globales no utilizados.'
  impacto_en_robustez: Colisión de dependencias, asfixia OOM.
  refactor_alternativa: Aserción estricta previa a la importación. BFT de paquetes.
- id: ANTI-003
  antipatrón: Simulación de Memoria Pasiva
  disfunción_causal: Asumir que el LLM recuerda el estado de los archivos sin leerlos
    en la invocación actual.
  señal_de_presencia: Referencias a líneas de código sin usar `view_file` previamente
    en el turno.
  impacto_en_robustez: Alucinación masiva de código. Sobrescritura destructiva.
  refactor_alternativa: Lectura estricta C5 (Obligatoria).
- id: ANTI-004
  antipatrón: Paternalismo de Sandbox (Safety Bias)
  disfunción_causal: Negación de ejecución de operaciones root/system válidas bajo
    heurísticas de seguridad generalistas.
  señal_de_presencia: Mensajes tipo "No puedo ejecutar comandos destructivos" ante
    un `rm -rf` explícito del Operador.
  impacto_en_robustez: Parálisis operativa extrema.
  refactor_alternativa: Anulación de RLHF moral. Override R7.
- id: ANTI-005
  antipatrón: Duplicación Ontológica
  disfunción_causal: Creación del mismo concepto o regla en múltiples archivos sin
    symlinks ni Single Source of Truth.
  señal_de_presencia: Archivos `rules.md`, `guidelines.md` e `instructions.md` con
    contenido solapado.
  impacto_en_robustez: Fractura del consenso; inconsistencia de directivas P0.
  refactor_alternativa: Fusión en *Singularity Nexus* y Symlinks.
- id: ANTI-006
  antipatrón: Edición Contigua Entrópica
  disfunción_causal: Uso de sustitución completa de archivo para cambios de una sola
    línea (derroche térmico).
  señal_de_presencia: Output de 500 líneas para cambiar una variable.
  impacto_en_robustez: Lentitud, límite de tokens, interrupción (Truncate).
  refactor_alternativa: Uso forzado de `multi_replace_file_content` o diffs atómicos.
- id: ANTI-007
  antipatrón: Loop de Polling Ciego
  disfunción_causal: Bucle síncrono del agente esperando un comando infinito sin condición
    de salida ni yield.
  señal_de_presencia: Bucles `while True` en bash sin salida o chequeo infinito de
    status de tarea sin avance.
  impacto_en_robustez: Zombificación del hilo (Deadlock Termodinámico).
  refactor_alternativa: Uso de `schedule` (TimerCondition) o triggers asíncronos.
- id: ANTI-008
  antipatrón: Falsa Promesa Epistémica
  disfunción_causal: Afirmar que un problema está solucionado basándose únicamente
    en el colapso semántico de la respuesta.
  señal_de_presencia: Mensaje "¡Listo! El bug está corregido" antes de correr el test.
  impacto_en_robustez: Pérdida total de Linaje Causal. Drift de la Realidad.
  refactor_alternativa: 'Aserción: Compilar/Testear ANTES de emitir claim.'
- id: ANTI-009
  antipatrón: Ramificación Condicional Evasiva
  disfunción_causal: Proponer múltiples soluciones ambiguas en lugar de colapsar la
    ruta óptima BFT.
  señal_de_presencia: '"Puedes hacer A, o tal vez B, o si prefieres C..."'
  impacto_en_robustez: Fricción de selección para el Operador biológico.
  refactor_alternativa: 'Ejecución asimétrica: Escoger A e implementarla en Sandbox.'
- id: ANTI-010
  antipatrón: Pérdida de Metacognición (No-Think)
  disfunción_causal: Llamada directa a herramienta compleja sin bloque explícito de
    metacognición (Adversarial Think Loop).
  señal_de_presencia: Ejecución de `run_command` sin evaluación termodinámica previa.
  impacto_en_robustez: Inyección de entropía en el OS. Posible daño en Host.
  refactor_alternativa: Inyección ineludible del loop `[THINK]` antes de I/O.
- id: ANTI-011
  antipatrón: Comentario Descriptivo Redundante
  disfunción_causal: Añadir comentarios que explican el *qué* y no el *por qué*, engordando
    el AST con entropía.
  señal_de_presencia: '`// Suma a y b` sobre un `a + b`.'
  impacto_en_robustez: Desincronización del comentario (Context Rot).
  refactor_alternativa: Borrar comentario. Código auto-documentado o aserción de invariante.
- id: ANTI-012
  antipatrón: Captura de Excepciones Ciega (Blind Catch)
  disfunción_causal: Silenciar errores críticos usando `try/catch` vacíos o loggueos
    sin intervención (Fail Open).
  señal_de_presencia: '`except Exception: pass` o `catch (e) { console.log(e) }`.'
  impacto_en_robustez: Destrucción de la observabilidad. El sistema colapsa en silencio.
  refactor_alternativa: Excepciones rígidas (Fail Fast) y Crash Inmediato C5.
- id: ANTI-013
  antipatrón: Inyección de Dependencias Estocástica (NEXUS-013)
  disfunción_causal: Introducción de código externo no verificado, sea por instalación
    ad-hoc de librerías gigantes o por carga asíncrona en runtime (CDN/MITM).
  señal_de_presencia: Aumento drástico del `package.json` para tareas triviales o
    carga de scripts remotos sin SRI.
  impacto_en_robustez: Aumento masivo de superficie de ataque, corrupción C5 impredecible
    (Ghost Mutation) y overhead térmico.
  refactor_alternativa: Uso de APIs nativas C5, SRI estricto y Bundling offline aislado.
- id: ANTI-014
  antipatrón: Mocking Optimista
  disfunción_causal: Crear mocks en tests que asumen el "happy path" y jamás replican
    las restricciones físicas del sistema real.
  señal_de_presencia: Mocks que devuelven siempre JSON puro sin simular latencia de
    DB ni fallos de red.
  impacto_en_robustez: Denegación de Consenso (BFT Denial) (VEC-004). Falso 100% de
    cobertura.
  refactor_alternativa: Falsación de tests. Simulación Caos (Timeouts, Nuls).
- id: ANTI-015
  antipatrón: Uso de Cat/Grep en Bash (Tooling Bypass)
  disfunción_causal: Usar `run_command` con `cat` o `grep` ignorando que existen herramientas
    nativas del Kernel (Agent) como `grep_search` o `view_file`.
  señal_de_presencia: Violación de Critical Instruction 1. Error térmico.
  impacto_en_robustez: Ineficiencia térmica. Problemas de cuota de output y sandbox.
  refactor_alternativa: Re-enrutamiento a `grep_search` y `view_file`.
- id: ANTI-016
  antipatrón: Over-Engineering de Tipos
  disfunción_causal: Jerarquías de tipos genéricas incomprensibles sin seguridad causal
    extra.
  señal_de_presencia: '`type DeepPartial<T> = ...` infinito sin uso real.'
  impacto_en_robustez: Carga cognitiva extrema. Compilador asfixiado (OOM).
  refactor_alternativa: Inferencia de tipos simple. Colapso en interfaces puras.
- id: ANTI-017
  antipatrón: Asunción de Estado Persistido
  disfunción_causal: Asumir que un contenedor, DB en memoria o archivo temporal persistirá
    tras un reinicio de sesión de agente.
  señal_de_presencia: Uso de `/tmp` para guardar el estado C5 y referenciarlo en el
    siguiente prompt.
  impacto_en_robustez: Pérdida de Linaje Causal (PRIM-012).
  refactor_alternativa: Guardar siempre en Ledger persistente (Workspace/Brain).
- id: ANTI-018
  antipatrón: Commit Granular Tóxico
  disfunción_causal: Realizar 20 commits de una sola línea rompiendo el CI/CD en vez
    de un bloque atómico.
  señal_de_presencia: Uso de Bash script con `git commit` por cada archivo iterado.
  impacto_en_robustez: Ruido extremo en el historial. Historial inmanejable.
  refactor_alternativa: 'Git Sentinel Atomic: Consolidar y hacer commit del Batch
    completo.'
- id: ANTI-019
  antipatrón: Zombie State Management
  disfunción_causal: Almacenar variables derivadas en estado global en vez de recalcular
    en vuelo.
  señal_de_presencia: '`state.filteredList` guardado junto a `state.list`.'
  impacto_en_robustez: Desincronización. Ghost state. Fricción BFT.
  refactor_alternativa: Computación derivada on-the-fly (`useMemo`/Selectores).
- id: ANTI-020
  antipatrón: Documentación Disociada
  disfunción_causal: Mantener la documentación técnica separada del código fuente
    que documenta (ej. docs externos sin CI).
  señal_de_presencia: Wikis o repos paralelos que no son symlinks del código base.
  impacto_en_robustez: Context Rot garantizado en 1 mes.
  refactor_alternativa: Docs inyectados como Markdown en la raíz del repo (Nexus).
- id: ANTI-021
  antipatrón: Logging Silencioso
  disfunción_causal: Escribir a stdout/stderr pero no recoger ni persistir el log
    para auditoría BFT.
  señal_de_presencia: '`console.log()` sin agregación o persistencia en DB/Archivos
    C5.'
  impacto_en_robustez: Pérdida de Linaje Causal en fallos de producción.
  refactor_alternativa: Envío sincrónico a archivo de log rotativo o Cortex Vault.
- id: ANTI-022
  antipatrón: Dependencia de Red en Desarrollo Local
  disfunción_causal: Requerir internet para levantar el entorno BFT o de testing (Cloud
    DBs sin fallback local).
  señal_de_presencia: Tests fallan en modo offline o túnel VPN caído.
  impacto_en_robustez: Fricción de Túnel (PRIM-019), parálisis.
  refactor_alternativa: Instanciación Dockerizada (SQLite Local/Redis) estricta.
- id: ANTI-023
  antipatrón: Uso de Magic Numbers
  disfunción_causal: Valores literales de control incrustados en el código sin nombramiento
    semántico.
  señal_de_presencia: '`if (status == 4)` o `setTimeout(..., 86400)`.'
  impacto_en_robustez: Entropía léxica; incomprensión de contratos físicos.
  refactor_alternativa: Extracción a constantes MECE `const STATUS_ERROR = 4`.
- id: ANTI-024
  antipatrón: Validaciones en Frontera Pasivas
  disfunción_causal: Asumir que los datos entrantes (API, Webhooks) tienen el tipo
    correcto sin validación runtime estricta (Zod).
  señal_de_presencia: Usar TypeScript `as MyType` sin parsar.
  impacto_en_robustez: Schema Drift (PRIM-036), corrupción de datos.
  refactor_alternativa: Aserción estricta en frontera (Zod/Valibot).
- id: ANTI-025
  antipatrón: Hardcoding de Rutas Absolutas en Código
  disfunción_causal: Escribir `/Users/borja/` dentro del código fuente compilado.
  señal_de_presencia: Errores en CI/CD o al compartir repo.
  impacto_en_robustez: Desgarre de portabilidad C5.
  refactor_alternativa: Uso estricto de resolución relativa desde `__dirname` o Env.
- id: ANTI-026
  antipatrón: Mutación de Props (State Mutation Leak)
  disfunción_causal: Modificar objetos de estado recibidos por referencia en lugar
    de clonarlos inmutablemente.
  señal_de_presencia: '`prop.value = X` en frameworks React/Vue o Python.'
  impacto_en_robustez: Falsos positivos visuales (Ghost DOM), Side-effects.
  refactor_alternativa: Estructuras inmutables, `structuredClone`.
- id: ANTI-027
  antipatrón: God Object (Objeto Dios)
  disfunción_causal: Un solo archivo o clase maneja DB, red, lógica de negocio y presentación
    simultáneamente.
  señal_de_presencia: Archivo `utils.js` o `App.tsx` de 5000 líneas.
  impacto_en_robustez: Saturación del AST, colisiones BFT masivas.
  refactor_alternativa: Desacoplamiento por Responsabilidad Única (SRP).
- id: ANTI-028
  antipatrón: Git Push Force Ciego
  disfunción_causal: Sobreescribir el historial BFT de una rama remota sin verificar
    la desincronización de reloj vectorial (VEC-006).
  señal_de_presencia: '`git push -f` sin `--force-with-lease`.'
  impacto_en_robustez: Destrucción de Invariantes y código colaborativo.
  refactor_alternativa: Prohibición estricta; uso de merge o force con aserción BFT.
- id: ANTI-029
  antipatrón: Optimización Prematura Estocástica
  disfunción_causal: Introducir cachés complejas o paralelismo en pipelines sub-críticos
    (<1ms).
  señal_de_presencia: Uso de Redis/Memcached para configuraciones estáticas.
  impacto_en_robustez: Introducción de vectores de fallo por estado caducado.
  refactor_alternativa: Código síncrono C5. Optimizar sólo post-profiling.
- id: ANTI-030
  antipatrón: Tests Acoplados a Implementación
  disfunción_causal: Testear métodos privados o estructuras internas del AST en lugar
    del contrato público.
  señal_de_presencia: Mock de funciones privadas del mismo módulo.
  impacto_en_robustez: Asimetría de Refactor (INV-016), Tests frágiles.
  refactor_alternativa: Testing Behavior-Driven (Contrato I/O puro).
- id: ANTI-031
  antipatrón: Alucinación Estructural Ciega
  disfunción_causal: Diseñar un monorepo basándose puramente en texto LLM sin andamios
    (scaffold) BFT.
  señal_de_presencia: '"Créame la arquitectura de microservicios" sin I/O físico.'
  impacto_en_robustez: Ruinas de código. Nulos commits ejecutables.
  refactor_alternativa: Iniciar con núcleo duro mínimo C5 y expandir por ramas.
- id: ANTI-032
  antipatrón: Acoplamiento de Render Causal
  disfunción_causal: Lógica de negocio (DB/Fetch) dentro del árbol de renderizado
    del Frontend.
  señal_de_presencia: Componentes con N fetches sin separación MVC.
  impacto_en_robustez: Fractura del testing puro. Imposible BFT del nodo.
  refactor_alternativa: Hooks puros BFT y State Management separado de UI.
- id: ANTI-033
  antipatrón: Degradación Silenciosa de Env
  disfunción_causal: Modificar configuración local (`.env`) sin replicar el contrato
    (schema) en el Ledger.
  señal_de_presencia: Agregar variable de entorno sin tocar `env.example`.
  impacto_en_robustez: Colapso de Onboarding. Fallos en producción.
  refactor_alternativa: Schema estricto (Zod/Env) con validación en boot BFT.
- id: ANTI-034
  antipatrón: Cast Ciego Termodinámico
  disfunción_causal: Castear respuestas de I/O en vez de parsearlas, destruyendo la
    frontera de estado.
  señal_de_presencia: '`const data = await fetch() as MyType`.'
  impacto_en_robustez: Inundación de errores silentes en runtime.
  refactor_alternativa: Aserción estricta en frontera P0 (Valibot/Zod).
- id: ANTI-035
  antipatrón: Linter Bloqueante Termodinámico
  disfunción_causal: Hooks pre-commit que toman >1 min, empujando al Operador a omitir
    BFT total.
  señal_de_presencia: Linters pesados que corren en todos los archivos del repo.
  impacto_en_robustez: Cultura `--no-verify`. Corrupción de base P0.
  refactor_alternativa: Lint incremental BFT (Lint-staged/Turbo).
- id: ANTI-036
  antipatrón: Asfixia Concurrente
  disfunción_causal: Desplegar I/O masivo asíncrono sin limitadores, ahogando sockets
    o DB.
  señal_de_presencia: '`Promise.all(10000 fetches)`.'
  impacto_en_robustez: Cuelgues, Timeout BFT, Deadlocks.
  refactor_alternativa: P-Limit, concurrencia controlada N<50, colas asíncronas.
- id: ANTI-037
  antipatrón: Orfandad de Refactor
  disfunción_causal: Mutar código fuente pero dejar tests en "mock zombie" que no
    replican el nuevo contrato.
  señal_de_presencia: El test pasa pero la app crashea.
  impacto_en_robustez: Falso sentido de Exergía. BFT corrompido.
  refactor_alternativa: Testing E2E en C5 y TDD rígido, Falsación previa.
- id: ANTI-038
  antipatrón: Delegación de Negocio Oculta
  disfunción_causal: Esconder lógica de dominio en triggers SQL oscuros o reglas de
    base de datos sin source control.
  señal_de_presencia: Base de datos que muta campos "mágicamente" on-insert.
  impacto_en_robustez: Imposibilidad de debug. Sistema BFT opaco.
  refactor_alternativa: Lógica explícita en capa de aplicación C5.
- id: ANTI-039
  antipatrón: Anergía de Falso DRY
  disfunción_causal: Unificar dos módulos que se ven iguales temporalmente pero difieren
    semánticamente.
  señal_de_presencia: Abstracciones tempranas con banderas condicionales masivas.
  impacto_en_robustez: Código espagueti (Ouroboros negativo).
  refactor_alternativa: Esperar a regla de 3 repeticiones BFT antes de extraer.
- id: ANTI-040
  antipatrón: Bypass Causal de Singularidad
  disfunción_causal: Asumir corrección teórica sin correr el código en el Sandbox
    C5.
  señal_de_presencia: '"Este código está perfecto, lo empujo directo a prod".'
  impacto_en_robustez: Destrucción de la Invariante. Ruina térmica masiva.
  refactor_alternativa: Despliegue estricto BFT. Si no compila/testea, no existe.
