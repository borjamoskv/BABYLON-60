author: "borjamoskv"
state: "C5-REAL"

concept: "Agentic Software Engineering (SE 3.0)"
definition: "Transición del modelo de IDE asistido pasivamente a un entorno de comandos y ejecución autónoma. Los LLM abandonan la generación pura de texto y colapsan la entropía mediante la manipulación I/O de herramientas del SO (AEE) y la orquestación supervisada (ACE)."

invariants:
  - id: "inv_aee_ace"
    description: "Separación topológica estricta: Agent Execution Environment (AEE) para la mutación física (disco, lint, tests) y Agent Command Environment (ACE) para la orquestación humana y la calibración."
    falsifiability: "Un agente autónomo que opera sin feedback humano o aislamiento (sandbox) fallará irremediablemente en la integración final, causando Crash Causal o loop infinito."

evidence_matrix:
