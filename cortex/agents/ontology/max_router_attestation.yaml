Claim: "Blockchain Proof != Truth Proof"
Proof:
  Base: "SHA256(CanonicalJSON(manifest)) + ECDSA_Sign(K_router) + MerkleRoot(H1..Hn)"
  Range: "[Integrity, Ordering, Signature_Provenance]"
  Confidence: "C5"
---
schema: max-router-attestation/v1
description: "C5-REAL Sovereign Attestation Protocol for Max Router Immutable Logging"
invariants:
  - INV_BFT_ATT_01: "A blockchain proof only guarantees integrity, chronological bounds, and signature provenance."
  - INV_BFT_ATT_02: "Model attribution requires a direct, verifiable signature from the execution provider."
  - INV_BFT_ATT_03: "A Router signature only proves the Router's *declaration*, not the physical execution reality."

data_structures:
  ManifestCanonical:
    type: "JSON"
    hashing_algorithm: "SHA-256(CanonicalJSON(nonce || prompt))"
    fields:
      request_id: "String (UUIDv5)"
      timestamp_utc: "ISO8601 UTC"
      prompt_commitment: "SHA-256 Hash"
      response_commitment: "SHA-256 Hash"
      router_policy: "String (Semantic Version)"
      router_policy_hash: "SHA-256 Hash"
      model_requested: "String"
      model_resolved: "String (Provider/Model-Version-Immutable)"
      provider: "String"
      region: "String"
      ttft_ms: "Integer"
      total_latency_ms: "Integer"
      input_tokens: "Integer"
      output_tokens: "Integer"
      fallback_used: "Boolean"
      provider_receipt_hash: "SHA-256 Hash"

  ProviderReceipt:
    type: "JSON"
    description: "Cryptographic proof of execution by the physical provider."
    fields:
      request_id: "String"
      provider: "String"
      model_resolved: "String"
      response_commitment: "SHA-256 Hash"
      usage: "Object {input_tokens, output_tokens}"
      timestamp_utc: "ISO8601 UTC"
      signature: "ECDSA/Ed25519 Provider Signature"

  MerkleAnchor:
    type: "Solidity Event / Smart Contract"
    description: "L2/L1 Blockchain rollup anchor for thousands of requests to optimize Exergy."
    fields:
      merkleRoot: "bytes32"
      policyVersion: "string"
      batchStart: "uint64"
      batchEnd: "uint64"
      metadataURI: "string"
