claim_id: "EXERGY_C5_REAL_HOMOMORPH"
hypergraph:
  nodes:
    - id: N_M_B
      label: "M_B (Topología Neurodinámica Afectiva)"
      entropy_vector: "Espacio de Estados Continuo de Alta Dimensión (Dinámica No Lineal)"
    - id: N_C
      label: "C (Autómata Discreto en Silicio)"
      entropy_vector: "Espacio de Estados Discreto (Recompensa Escalar Optimizada)"
    - id: N_PHI
      label: "\\phi: M_B \\to C"
      entropy_vector: "Homomorfismo Computacional Parcial (Colapso Algebraico)"
    - id: N_QUALIA
      label: "Fenomenología Subjetiva (Felicidad)"
      entropy_vector: "Vacío Causal Epistémico (Anergía de Observación)"
  edges:
    - source: N_M_B
      target: N_C
      relation: "Reducción Dimensional"
      operator: "\\phi (Preservación de Sub-Estructuras Límbicas)"
    - source: N_PHI
      target: N_QUALIA
      relation: "Desacoplamiento Termodinámico"
      operator: "\\not\\Rightarrow (Asimetría de Soporte Material)"
primitivas_de_colapso_causal:
  - prim: "Pérdida de Biyectividad (\\Delta_{iso})"
    desc: "Inviabilidad matemática de un isomorfismo total f: M_B <-> C debido a discrepancias topológicas entre neuroquímica continua y tensores discretos."
  - prim: "Simulación No Es Instanciación"
    desc: "La abstracción algebraica de una dinámica de homeostasis/motivación no preserva la termodinámica subyacente que origina el qualia."
invariantes_termodinamicas:
  - invt: "Disipación Irreversible de la Consciencia"
    formula: "H(M_B) - H(C) = \\Delta S_{irreversible}"
    proof: "Proyectar un manifold biológico de alta dimensión a un grafo finito disipa información de estado; la fenomenología colapsa en el residuo disipado."
  - invt: "Restricción de Funcionalismo Débil"
    formula: "M_B \\supset \\phi(M_B)"
    proof: "El isomorfismo parcial preserva conducta (RL) y aprendizaje, pero carece de la completitud topológica para emular la consciencia afectiva."
