# Isomorfismos Cruzados — Matriz de 1000 Primitivas
# Glue Layer para CORTEX / ANTIGRAVITY
# ---

meta:
  claim: Isomorfismos Arquitectónicos entre 10 Teorías Ontológicas
  base: Isomorfismo Causal / PeARL-77
  total_primitive_bridges: 120
  total_dimensional_isomorphisms: 45
  fusion_operators: 20
dimensional_isomorphisms:
- from: T01.D01-Intervention-Operators
  to: T08.D02-Tape-Operations
  type: operational_homology
  justification: 'Un do-operator causal es isomorfo a una write-operation computacional: ambos alteran el estado de un sistema formal'
  strength: 0.92
- from: T01.D02-Counterfactual-States
  to: T04.D02-World-Structures
  type: modal_homology
  justification: Un counterfactual-state es un possible-world con restricciones de proximidad causal; los nearby-worlds de Lewis son los would-states de Pearl
  strength: 0.95
- from: T01.D03-Structural-Equations
  to: T07.D04-Graph-Homomorphisms
  type: structural_homology
  justification: Una structural-equation es un graph-embedding donde los nodos son variables y las aristas son dependencias funcionales
  strength: 0.89
- from: T01.D05-Causal-Paths
  to: T07.D03-Path-Structures
  type: topological_homology
  justification: direct-path, indirect-path, mediated-path son instancias de geodesic-path, shortest-path y augmenting-path en grafos causales
  strength: 0.91
- from: T01.D07-Causal-Discovery
  to: T07.D06-Community-Structures
  type: inferential_homology
  justification: d-separation en grafos causales detecta community-boundaries; v-structures son cliques de orden 3
  strength: 0.84
- from: T02.D01-Part-Relations
  to: T07.D01-Node-Types
  type: compositional_homology
  justification: proper-part / whole se mapea a node / subgraph; un whole es un connected-subgraph y sus parts son nodos internos
  strength: 0.87
- from: T02.D03-Boundary-Types
  to: T10.D01-Boundary-Types
  type: exact_homology
  justification: fuzzy-boundary (Varzi) == semi-permeable-boundary (Luhmann); sharp-boundary == rigid-boundary
  strength: 0.96
- from: T02.D04-Connection-Relations
  to: T07.D02-Edge-Types
  type: relational_homology
  justification: external-connection es directed-edge; overlap es multi-edge; separation es disconnection
  strength: 0.88
- from: T02.D09-Location-Relations
  to: T04.D05-Identity-Conditions
  type: modal_mereological_homology
  justification: exact-location de un objeto en un mundo es su transworld-identity; generic-location es counterpart-relation
  strength: 0.82
- from: T03.D01-Event-Types
  to: T08.D01-State-Types
  type: computational_homology
  justification: Un punctual-event es un accepting-state; un duration-event es una secuencia de state-transitions en una Turing machine
  strength: 0.85
- from: T03.D02-Temporal-Relations
  to: T04.D09-Temporal-Modalities
  type: modal_temporal_homology
  justification: before / after / during son always / eventually / until en lógica temporal modal; meets es next
  strength: 0.93
- from: T03.D04-Stability-States
  to: T10.D06-Regulation-Modes
  type: dynamical_homology
  justification: attractor-state == homeostasis; strange-attractor == far-from-equilibrium; limit-cycle == steady-state oscilatorio
  strength: 0.9
- from: T03.D06-Flow-Topologies
  to: T05.D05-Information-Flows
  type: informational_homology
  justification: Un flujo laminar de proceso es un information-flow de baja transfer-entropy; turbulento == alta transfer-entropy
  strength: 0.86
- from: T04.D01-Modal-Operators
  to: T08.D10-Computational-Limits
  type: limit_homology
  justification: necessity-operator == decidable-language; possibility-operator == recursively-enumerable; impossibility == undecidable
  strength: 0.81
- from: T04.D03-Accessibility-Relations
  to: T07.D03-Path-Structures
  type: graph_modal_homology
  justification: Una accessibility-relation entre mundos es un edge en un graph de mundos posibles; reflexive-access es self-loop
  strength: 0.94
- from: T04.D04-Essence-Properties
  to: T02.D10-Constitution-Relations
  type: ontological_homology
  justification: essential-property es lo que constituye la identity de un objeto; accidental-property es coincidence no constitutiva
  strength: 0.91
- from: T05.D01-Entropy-Forms
  to: T03.D10-Process-Measurements
  type: thermodynamic_homology
  justification: shannon-entropy mide entropy-production en un proceso; differential-entropy es rate-of-change de información
  strength: 0.89
- from: T05.D02-Divergence-Measures
  to: T01.D10-Causal-Uncertainty
  type: epistemic_homology
  justification: kl-divergence entre prior y posterior es identification-uncertainty; js-divergence es model-uncertainty entre modelos causales
  strength: 0.88
- from: T05.D03-Fisher-Structures
  to: T02.D08-Granularity-Levels
  type: metric_homology
  justification: fisher-metric define la distancia entre granularity-levels; natural-gradient es granularity-shift óptimo
  strength: 0.83
- from: T05.D07-Probability-Geometry
  to: T04.D02-World-Structures
  type: geometric_modal_homology
  justification: Un punto en un simplex de probabilidad es un possible-world ponderado; posterior-geometry es actual-world bayesiano
  strength: 0.87
- from: T06.D01-Sign-Types
  to: T09.D03-Representational-Contents
  type: semiotic_intentional_homology
  justification: icon == imagistic-content; symbol == conceptual-content; index == nonconceptual-content (causal/directo)
  strength: 0.92
- from: T06.D04-Meaning-Levels
  to: T09.D08-Consciousness-Levels
  type: phenomenological_homology
  justification: denotation == access-consciousness; connotation == phenomenal-consciousness; myth == narrative-self
  strength: 0.79
- from: T06.D07-Enunciation-Actors
  to: T09.D06-Self-Models
  type: discursive_homology
  justification: emitter == narrative-self; receiver == social-self; enunciator == reflexive-self; enunciatee == pre-reflexive-self
  strength: 0.81
- from: T07.D05-Network-Measures
  to: T05.D08-Learning-Gradients
  type: optimization_homology
  justification: betweenness-centrality es natural-gradient en un graph de conocimiento; eigenvector-centrality es PageRank como momentum
  strength: 0.85
- from: T07.D08-Flow-Networks
  to: T10.D04-Control-Mechanisms
  type: control_homology
  justification: max-flow / min-cut es optimal-control en una red; residual-capacity es robust-control margin
  strength: 0.9
- from: T08.D03-Complexity-Classes
  to: T04.D10-Alethic-Varieties
  type: computational_modal_homology
  justification: class-p == logical-necessity (resoluble en tiempo polinomial); class-np == physical-necessity (verificable en P); undecidable == metaphysical-impossibility
  strength: 0.84
- from: T08.D06-Algorithmic-Paradigms
  to: T03.D07-Process-Composition
  type: algorithmic_process_homology
  justification: divide-and-conquer == recursive-composition; dynamic-programming == sequential-composition con memoization; greedy == local-optimal-policy
  strength: 0.91
- from: T08.D09-Formal-Languages
  to: T06.D05-Discourse-Forms
  type: linguistic_homology
  justification: regular-language == narrative-discourse (estructura repetitiva); context-free == argumentative-discourse (recursión anidada); recursively-enumerable == dialogic-discourse (no acotada)
  strength: 0.78
- from: T09.D01-Propositional-Attitudes
  to: T04.D08-Doxastic-Spaces
  type: attitude_modal_homology
  justification: belief-state == belief-world; knowledge-state == knowledge-world; doubt-state == uncertainty-world; expectation == eventually-enunciated
  strength: 0.94
- from: T09.D04-Phenomenal-Qualities
  to: T05.D01-Entropy-Forms
  type: informational_phenomenology_homology
  justification: qualia son estados de baja kolmogorov-complexity (alta compresibilidad subjetiva) pero alta shannon-entropy (alta sorpresa informativa)
  strength: 0.76
- from: T09.D10-Cognitive-Architectures
  to: T10.D09-Organizational-Forms
  type: architectural_homology
  justification: system-1-process == hierarchy (rápido, automático); system-2-process == heterarchy (lento, deliberativo); global-workspace == network-form
  strength: 0.88
- from: T10.D02-Membrane-Operations
  to: T02.D04-Connection-Relations
  type: boundary_operational_homology
  justification: filtering-operation == selective-connection; gating-operation == conditional-connection; pumping-operation es active-transport como directed-edge
  strength: 0.86
- from: T10.D03-Feedback-Loops
  to: T01.D03-Structural-Equations
  type: causal_systemic_homology
  justification: positive-feedback == amplifying structural-equation; negative-feedback == dampening structural-equation; feedback-loop es cyclic-path en SEM
  strength: 0.93
- from: T10.D05-Autopoiesis-Elements
  to: T03.D09-Becoming-Modes
  type: process_systemic_homology
  justification: self-production == creative-advance; self-repair == habit-formation; organizational-closure == organic-whole; structural-coupling == external-connection
  strength: 0.89
- from: T10.D08-Information-Regulation
  to: T05.D05-Information-Flows
  type: regulatory_information_homology
  justification: variety-amplification == generation-information; variety-attenuation == erasure-information; requisite-variety == channel-capacity mínima
  strength: 0.91
- from: T10.D10-System-Transitions
  to: T03.D05-Transformation-Rules
  type: transition_homology
  justification: adaptation-transition == integration-rule; evolution-transition == emergence-rule; collapse-transition == dissolution-rule; revolution-transition == symmetry-breaking
  strength: 0.9
