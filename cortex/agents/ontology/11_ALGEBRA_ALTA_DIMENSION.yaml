entities:
- id: PRIM-HDA-001
  primitiva: Mal Condicionamiento (Ill-Conditioning)
  mecanismo_causal: El numero de condicion de la matriz explota y amplifica errores
    de entrada de forma desmesurada.
  activacion_trigger: Kappa(A) muy grande en un solve.
  sensor_sintoma: Solucion oscila ante perturbaciones minimas.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Regularizar (Tikhonov) o resolver via SVD.
- id: PRIM-HDA-002
  primitiva: Cancelacion Catastrofica (Catastrophic Cancellation)
  mecanismo_causal: Resta de dos cantidades casi iguales que aniquila los digitos
    significativos.
  activacion_trigger: a - b con a ~ b en punto flotante.
  sensor_sintoma: Perdida subita de precision relativa.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reformular la expresion (identidades algebraicas).
- id: PRIM-HDA-003
  primitiva: Perdida de Ortogonalidad (Loss of Orthogonality)
  mecanismo_causal: La ortogonalidad de una base se degrada por redondeo acumulado
    en la proyeccion.
  activacion_trigger: Gram-Schmidt clasico sobre vectores casi paralelos.
  sensor_sintoma: Q^T Q se aleja de la identidad.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Gram-Schmidt modificado o Householder.
- id: PRIM-HDA-004
  primitiva: Colapso de Rango Numerico (Numerical Rank Collapse)
  mecanismo_causal: Valores singulares pequenos caen bajo el umbral y el rango efectivo
    se desploma.
  activacion_trigger: Sigma_k por debajo de la tolerancia relativa.
  sensor_sintoma: Rango numerico << rango simbolico.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Truncacion SVD con tolerancia relativa a sigma_max.
- id: PRIM-HDA-005
  primitiva: Deficiencia de Rango (Rank Deficiency)
  mecanismo_causal: Las columnas dejan de ser independientes y el sistema pierde unicidad
    de solucion.
  activacion_trigger: Columnas linealmente dependientes.
  sensor_sintoma: Nucleo no trivial detectado.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Minimos cuadrados de norma minima (pseudo-inversa).
- id: PRIM-HDA-006
  primitiva: Singularidad Cercana (Near-Singularity)
  mecanismo_causal: La matriz se acerca a no invertible y la inversa se vuelve gigantesca.
  activacion_trigger: det ~ 0 o sigma_min ~ 0.
  sensor_sintoma: Entradas de la inversa disparadas.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Evitar la inversa; solve regularizado.
- id: PRIM-HDA-007
  primitiva: Overflow de Norma (Norm Overflow)
  mecanismo_causal: El calculo de la norma desborda al elevar al cuadrado componentes
    grandes.
  activacion_trigger: sqrt(sum x_i^2) con x_i grandes.
  sensor_sintoma: Inf en la norma.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Escalar por el maximo antes de sumar (hypot).
- id: PRIM-HDA-008
  primitiva: Error de Producto Interno (Dot Product Error)
  mecanismo_causal: La acumulacion secuencial del producto interno acumula error de
    redondeo.
  activacion_trigger: Suma naive de un producto punto largo.
  sensor_sintoma: Producto interno con residuo alto.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Suma compensada (Kahan) o precision extendida.
- id: PRIM-HDA-009
  primitiva: Redondeo Acumulado (Accumulated Roundoff)
  mecanismo_causal: Miles de operaciones flotantes acumulan sesgo de redondeo hasta
    corromper el resultado.
  activacion_trigger: Reduccion de gran tamano sin compensacion.
  sensor_sintoma: Deriva del resultado vs referencia exacta.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Sumatorio por pares o compensado.
- id: PRIM-HDA-010
  primitiva: Inversa Inestable (Unstable Inverse)
  mecanismo_causal: Calcular la inversa explicita propaga y amplifica el error de
    condicionamiento.
  activacion_trigger: inv(A) usado para resolver A x = b.
  sensor_sintoma: Residuo del solve elevado.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Factorizar (LU/QR) y resolver, nunca invertir.
- id: PRIM-HDA-011
  primitiva: Pivote Diminuto (Tiny Pivot)
  mecanismo_causal: Un pivote casi nulo en la eliminacion multiplica el error por
    su inverso.
  activacion_trigger: Pivoteo sin intercambio de filas.
  sensor_sintoma: Multiplicadores enormes en LU.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Pivoteo parcial o completo.
- id: PRIM-HDA-012
  primitiva: Divergencia de Iteracion de Potencia (Power Iteration Divergence)
  mecanismo_causal: La iteracion de potencia no separa autovalores dominantes casi
    degenerados.
  activacion_trigger: Autovalores dominantes de modulo similar.
  sensor_sintoma: El iterado no converge a un unico vector.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Deflacion o metodo de subespacio (bloque).
- id: PRIM-HDA-013
  primitiva: Autovalores Agrupados (Clustered Eigenvalues)
  mecanismo_causal: Autovalores muy proximos ralentizan o estancan la convergencia
    iterativa.
  activacion_trigger: Cluster espectral estrecho.
  sensor_sintoma: Convergencia sub-lineal del solver.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Precondicionar o desplazamiento espectral (shift).
- id: PRIM-HDA-014
  primitiva: Deflacion Fallida (Failed Deflation)
  mecanismo_causal: La eliminacion de un autovalor ya hallado contamina el resto del
    espectro.
  activacion_trigger: Deflacion sin reortogonalizar.
  sensor_sintoma: Reaparicion de autovalores fantasma.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Deflacion estable con reortogonalizacion.
- id: PRIM-HDA-015
  primitiva: Ruptura de Lanczos (Lanczos Breakdown)
  mecanismo_causal: Los vectores de Lanczos pierden ortogonalidad y generan copias
    espurias de autovalores.
  activacion_trigger: Iteracion de Lanczos sin reortogonalizar.
  sensor_sintoma: Autovalores 'fantasma' duplicados (ghosts).
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Reortogonalizacion completa o selectiva.
- id: PRIM-HDA-016
  primitiva: Ruptura de Arnoldi (Arnoldi Breakdown)
  mecanismo_causal: La base de Krylov colapsa cuando un vector nuevo es casi combinacion
    de los previos.
  activacion_trigger: Nuevo vector de Krylov casi dependiente.
  sensor_sintoma: Norma del residuo de Arnoldi ~ 0.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reinicio (restart) o happy breakdown controlado.
- id: PRIM-HDA-017
  primitiva: Estancamiento de GMRES (GMRES Stagnation)
  mecanismo_causal: El residuo de GMRES deja de decrecer por geometria adversa del
    espectro.
  activacion_trigger: Matriz no normal mal precondicionada.
  sensor_sintoma: Curva de convergencia plana.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Precondicionamiento y reinicio GMRES(m).
- id: PRIM-HDA-018
  primitiva: Estancamiento de CG (CG Stall)
  mecanismo_causal: Gradiente conjugado se atasca en sistemas mal condicionados sin
    precondicionador.
  activacion_trigger: Kappa alto en matriz SPD.
  sensor_sintoma: Residuo estancado con oscilacion.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Precondicionador (incompleto Cholesky, multigrid).
- id: PRIM-HDA-019
  primitiva: Precondicionador Ineficaz (Ineffective Preconditioner)
  mecanismo_causal: El precondicionador no agrupa el espectro y no acelera la convergencia.
  activacion_trigger: M^-1 A con espectro aun disperso.
  sensor_sintoma: Iteraciones sin reduccion esperada.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Rediseno del precondicionador al operador.
- id: PRIM-HDA-020
  primitiva: Explosion de Fill-in (Sparse Fill-in Explosion)
  mecanismo_causal: La factorizacion de una matriz sparse genera entradas nuevas que
    agotan la memoria.
  activacion_trigger: LU/Cholesky sin reordenamiento.
  sensor_sintoma: Densificacion del factor.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reordenamiento (AMD, nested dissection).
- id: PRIM-HDA-021
  primitiva: Maldicion de la Dimensionalidad (Curse of Dimensionality)
  mecanismo_causal: El volumen crece exponencialmente con la dimension y los datos
    se vuelven ralos.
  activacion_trigger: Modelado denso en dimension alta.
  sensor_sintoma: Complejidad de muestra explota.
  escala_temporal: Progresiva
  gravedad: C3
  intervencion: Reduccion de dimension o priors estructurales.
- id: PRIM-HDA-022
  primitiva: Concentracion de la Medida (Concentration of Measure)
  mecanismo_causal: En alta dimension casi toda la masa de probabilidad se concentra
    en una cascara delgada.
  activacion_trigger: Muestreo gaussiano isotropo en d grande.
  sensor_sintoma: Distancias casi constantes entre puntos.
  escala_temporal: Progresiva
  gravedad: C3
  intervencion: Metricas aprendidas o coseno, no L2 crudo.
- id: PRIM-HDA-023
  primitiva: Colapso de Contraste de Distancias (Distance Concentration)
  mecanismo_causal: La distancia al vecino mas cercano y al mas lejano convergen,
    matando el contraste.
  activacion_trigger: kNN euclideo en dimension alta.
  sensor_sintoma: Ratio d_max/d_min -> 1.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Metrica adaptada; reducir dimension antes de kNN.
- id: PRIM-HDA-024
  primitiva: Cuasi-Ortogonalidad Aleatoria (Random Quasi-Orthogonality)
  mecanismo_causal: Vectores aleatorios en alta dimension son casi ortogonales entre
    si.
  activacion_trigger: Producto interno de vectores aleatorios.
  sensor_sintoma: Cosenos concentrados en 0.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: 'Aprovechar (no combatir): usar para sketching.'
- id: PRIM-HDA-025
  primitiva: Volumen en la Cascara (Volume in the Shell)
  mecanismo_causal: Casi todo el volumen de la bola de dimension alta esta pegado
    a su superficie.
  activacion_trigger: Integracion o muestreo uniforme en la bola.
  sensor_sintoma: Interior practicamente vacio.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Muestreo consciente de la geometria (cascara).
- id: PRIM-HDA-026
  primitiva: Fenomeno de Espacio Vacio (Empty Space Phenomenon)
  mecanismo_causal: Los datos ocupan una fraccion infinitesimal del hipercubo, dejandolo
    casi vacio.
  activacion_trigger: Densidad estimada en malla de dimension alta.
  sensor_sintoma: Celdas mayoritariamente sin muestras.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Modelos parametricos, no basados en malla.
- id: PRIM-HDA-027
  primitiva: Esfera Espinosa (Spiky Sphere)
  mecanismo_causal: El hipercubo tiene esquinas lejanas del centro que dominan geometricamente.
  activacion_trigger: Razonar por intuicion 3D en dimension alta.
  sensor_sintoma: Esquinas a distancia sqrt(d) del centro.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Confiar en el algebra, no en la intuicion visual.
- id: PRIM-HDA-028
  primitiva: Cascara Gaussiana Delgada (Thin Gaussian Annulus)
  mecanismo_causal: La gaussiana estandar concentra su masa en un anillo de radio
    raiz de d.
  activacion_trigger: Asumir masa cerca del origen.
  sensor_sintoma: Norma concentrada en sqrt(d) +/- O(1).
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Modelar el radio, no el modo.
- id: PRIM-HDA-029
  primitiva: Hubness (Hubness)
  mecanismo_causal: Ciertos puntos se vuelven vecinos de casi todos (hubs), sesgando
    kNN.
  activacion_trigger: kNN en representaciones de dimension alta.
  sensor_sintoma: Distribucion de conteo de vecino sesgada.
  escala_temporal: Progresiva
  gravedad: C3
  intervencion: Normalizacion (p.ej. mutual proximity).
- id: PRIM-HDA-030
  primitiva: Degradacion de Normas Lp (Lp Norm Degradation)
  mecanismo_causal: El contraste de las normas Lp se degrada al crecer la dimension
    (peor cuanto mayor p).
  activacion_trigger: Uso de L2/Linf en dimension alta.
  sensor_sintoma: Discriminacion de distancia colapsada.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Normas fraccionarias o metricas aprendidas.
- id: PRIM-HDA-031
  primitiva: Sobreajuste por Dimension (Dimensionality Overfitting)
  mecanismo_causal: Con mas dimensiones que muestras el modelo interpola ruido perfectamente.
  activacion_trigger: d >> n en ajuste.
  sensor_sintoma: Error de train ~ 0 y test alto.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Regularizacion, reduccion de dimension, mas datos.
- id: PRIM-HDA-032
  primitiva: Complejidad de Muestra Exponencial (Exponential Sample Complexity)
  mecanismo_causal: Estimar densidad o funcion en dimension alta requiere muestras
    exponenciales.
  activacion_trigger: Estimacion no parametrica en d grande.
  sensor_sintoma: Varianza del estimador enorme.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Supuestos estructurales (sparsity, manifold).
- id: PRIM-HDA-033
  primitiva: Colapso de Estimacion de Densidad (Density Estimation Collapse)
  mecanismo_causal: Los estimadores de densidad kernel fallan por falta de vecinos
    en dimension alta.
  activacion_trigger: KDE en dimension alta.
  sensor_sintoma: Densidad casi nula en todo el soporte.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Modelos de variedad latente de baja dimension.
- id: PRIM-HDA-034
  primitiva: Ralonamiento de Datos (Data Sparsity)
  mecanismo_causal: Los puntos quedan tan separados que toda vecindad local esta vacia.
  activacion_trigger: Metodos locales en dimension alta.
  sensor_sintoma: Vecindades sin soporte.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Metodos globales o embeddings de baja dimension.
- id: PRIM-HDA-035
  primitiva: Distorsion de Proyeccion (Projection Distortion)
  mecanismo_causal: Proyectar a dimension demasiado baja rompe el limite de Johnson-Lindenstrauss.
  activacion_trigger: Dimension objetivo por debajo del limite JL.
  sensor_sintoma: Distancias distorsionadas > epsilon.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Elegir k = O(log n / epsilon^2).
- id: PRIM-HDA-036
  primitiva: Violacion de Johnson-Lindenstrauss (JL Violation)
  mecanismo_causal: El objetivo de dimension viola la garantia probabilistica de preservacion
    de distancias.
  activacion_trigger: k demasiado pequeno para n puntos.
  sensor_sintoma: Pares con error fuera de tolerancia.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Dimensionar k segun el lema JL.
- id: PRIM-HDA-037
  primitiva: Perdida de Varianza en PCA (Truncated PCA Variance Loss)
  mecanismo_causal: Truncar PCA descarta componentes con senal real, no solo ruido.
  activacion_trigger: Cortar k por regla arbitraria.
  sensor_sintoma: Varianza explicada insuficiente.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Seleccion de k por scree/validacion.
- id: PRIM-HDA-038
  primitiva: Componentes Espurios (Spurious Components)
  mecanismo_causal: El ruido genera componentes principales sin significado (Marchenko-Pastur).
  activacion_trigger: PCA con n comparable a d.
  sensor_sintoma: Autovalores dentro del bulk aleatorio.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Umbral de Marchenko-Pastur; PCA robusto.
- id: PRIM-HDA-039
  primitiva: Rotacion de Subespacio (Subspace Rotation)
  mecanismo_causal: Autovectores de autovalores proximos rotan de forma inestable
    ante perturbaciones.
  activacion_trigger: Gap espectral pequeno.
  sensor_sintoma: Subespacio propio salta entre corridas.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Trabajar con subespacios invariantes, no vectores.
- id: PRIM-HDA-040
  primitiva: Fuga de Energia Espectral (Spectral Energy Leakage)
  mecanismo_causal: La energia se filtra entre componentes por ventanas o truncaciones
    abruptas.
  activacion_trigger: Truncacion sin ventana suave.
  sensor_sintoma: Cola espectral no fisica.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Ventaneo o regularizacion espectral.
- id: PRIM-HDA-041
  primitiva: Colapso de Embeddings (Embedding Collapse)
  mecanismo_causal: Todos los vectores aprendidos colapsan a un punto o recta, perdiendo
    informacion.
  activacion_trigger: Entrenamiento sin termino de dispersion.
  sensor_sintoma: Rango efectivo del embedding ~ 1.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Perdida contrastiva o de decorrelacion (VICReg).
- id: PRIM-HDA-042
  primitiva: Anisotropia de Embeddings (Embedding Anisotropy)
  mecanismo_causal: Los embeddings ocupan un cono estrecho, sesgando la similitud
    coseno.
  activacion_trigger: Representaciones de LLM sin post-proceso.
  sensor_sintoma: Coseno medio entre pares muy alto.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Whitening o normalizacion isotropica.
- id: PRIM-HDA-043
  primitiva: Degeneracion Representacional (Representation Degeneration)
  mecanismo_causal: Las representaciones se degeneran a un subespacio de baja dimension
    durante el entrenamiento.
  activacion_trigger: Softmax con embeddings atados.
  sensor_sintoma: Valores singulares decaen abruptamente.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Regularizacion espectral del embedding.
- id: PRIM-HDA-044
  primitiva: Colapso Dimensional Contrastivo (Contrastive Dimensional Collapse)
  mecanismo_causal: El aprendizaje contrastivo colapsa a un subespacio pese a evitar
    el colapso total.
  activacion_trigger: Sin decorrelacion de dimensiones.
  sensor_sintoma: Covarianza de features casi de rango bajo.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Terminos de covarianza (Barlow Twins/VICReg).
- id: PRIM-HDA-045
  primitiva: Explosion de Rango Tensorial (Tensor Rank Explosion)
  mecanismo_causal: El rango de un tensor crece de forma incontrolable y no admite
    descomposicion compacta.
  activacion_trigger: CP sobre tensor generico.
  sensor_sintoma: Rango CP requerido enorme.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Formatos de bajo rango (Tucker, TT) con truncacion.
- id: PRIM-HDA-046
  primitiva: Mal Planteamiento de CP (Ill-Posed CP)
  mecanismo_causal: El mejor ajuste de rango k puede no existir (border rank < rank).
  activacion_trigger: CP-ALS sobre tensor sin optimo.
  sensor_sintoma: Factores divergen sin converger.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Regularizacion o formato de rango de borde.
- id: PRIM-HDA-047
  primitiva: Degeneracion de CP (CP Degeneracy)
  mecanismo_causal: Factores de gran magnitud casi se cancelan, dando ajuste sin significado.
  activacion_trigger: CP-ALS mal condicionado.
  sensor_sintoma: Norma de factores -> infinito.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Restricciones (no negatividad, ortogonalidad).
- id: PRIM-HDA-048
  primitiva: Colapso del Nucleo de Tucker (Tucker Core Collapse)
  mecanismo_causal: El nucleo de Tucker pierde rango multilineal y colapsa modos.
  activacion_trigger: Truncacion agresiva de HOSVD.
  sensor_sintoma: Rangos multilineales desbalanceados.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Seleccion equilibrada de rangos por modo.
- id: PRIM-HDA-049
  primitiva: Explosion de Bond Dimension (Bond Dimension Blow-up)
  mecanismo_causal: La dimension de enlace del tensor-train crece exponencialmente
    para mantener precision.
  activacion_trigger: TT sobre estado muy entrelazado.
  sensor_sintoma: Bond dimension fuera de presupuesto.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Truncacion SVD por modo con tolerancia.
- id: PRIM-HDA-050
  primitiva: Truncacion TT con Perdida (Lossy TT Truncation)
  mecanismo_causal: Truncar el tensor-train descarta correlaciones y sesga el resultado.
  activacion_trigger: Redondeo TT agresivo.
  sensor_sintoma: Error de reconstruccion elevado.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Control de error acumulado por enlace.
- id: PRIM-HDA-051
  primitiva: Maldicion Tensorial (Tensor Curse)
  mecanismo_causal: Almacenar un tensor denso de orden d cuesta N^d entradas, intratable.
  activacion_trigger: Representacion densa de orden alto.
  sensor_sintoma: Memoria O(N^d).
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Formatos comprimidos (TT, Tucker, CP).
- id: PRIM-HDA-052
  primitiva: Explosion de Kronecker (Kronecker Blow-up)
  mecanismo_causal: Materializar el producto de Kronecker crea una matriz gigante
    innecesaria.
  activacion_trigger: kron(A,B) explicito.
  sensor_sintoma: Memoria (mn)^2.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Aplicar la estructura sin materializar (vec-trick).
- id: PRIM-HDA-053
  primitiva: Contraccion Mal Ordenada (Bad Contraction Order)
  mecanismo_causal: El orden de contraccion de una red tensorial dispara el coste
    intermedio.
  activacion_trigger: Path de contraccion arbitrario.
  sensor_sintoma: Tensor intermedio gigante.
  escala_temporal: Estatica
  gravedad: C2
  intervencion: Optimizar el path (opt_einsum, dinamico).
- id: PRIM-HDA-054
  primitiva: Fuga de Norma en Contraccion (Contraction Norm Blow-up)
  mecanismo_causal: La norma se dispara o se desvanece a lo largo de una contraccion
    larga.
  activacion_trigger: Red tensorial sin normalizar.
  sensor_sintoma: Overflow/underflow intermedio.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Normalizar por paso y llevar el log de la escala.
- id: PRIM-HDA-055
  primitiva: Suma No Asociativa (Non-Associative Sum)
  mecanismo_causal: La suma flotante no es asociativa y el resultado depende del orden
    de reduccion.
  activacion_trigger: Reduccion paralela sin orden fijo.
  sensor_sintoma: Resultado no reproducible entre corridas.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Orden de reduccion fijo o suma compensada.
- id: PRIM-HDA-056
  primitiva: Overflow de Softmax (Softmax Overflow)
  mecanismo_causal: La exponencial desborda si no se resta el maximo del vector de
    logits.
