  activacion_trigger: Compresion de features en d limitada.
  sensor_sintoma: Cross-talk entre features.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Diccionarios sparse; mas dimension o SAE.
- id: INV-HDA-001
  invariante: Invarianza del Rango
  logica___principio: El rango es invariante bajo cambio de base y multiplicacion
    por matrices invertibles.
  implicacion_operacional: El rango caracteriza el operador, no su representacion.
  condicion_de_borde: Rango cambia al reexpresar en otra base.
  metrica_falsable: rank(PAQ) == rank(A) para P,Q invertibles.
- id: INV-HDA-002
  invariante: Invarianza de la Traza (Similaridad)
  logica___principio: La traza es invariante bajo similaridad y equivale a la suma
    de autovalores.
  implicacion_operacional: Traza como invariante escalar del operador.
  condicion_de_borde: tr(S^-1 A S) != tr(A).
  metrica_falsable: tr(A) == suma de autovalores.
- id: INV-HDA-004
  invariante: Invarianza del Espectro
  logica___principio: Los autovalores son invariantes bajo similaridad.
  implicacion_operacional: El espectro es propiedad del operador, no de la base.
  condicion_de_borde: Autovalores cambian bajo cambio de base.
  metrica_falsable: spec(S^-1 A S) == spec(A).
- id: INV-HDA-005
  invariante: Isometria Preserva Norma
  logica___principio: Una transformacion ortogonal/unitaria conserva la norma euclidea.
  implicacion_operacional: Rotar/reflejar no cambia longitudes.
  condicion_de_borde: norm(Qx) != norm(x) con Q ortogonal.
  metrica_falsable: norm(Qx) == norm(x).
- id: INV-HDA-006
  invariante: Unitaria Preserva Producto Interno
  logica___principio: Las transformaciones unitarias conservan el producto interno.
  implicacion_operacional: Los angulos se preservan bajo unitarias.
  condicion_de_borde: <Qx,Qy> != <x,y>.
  metrica_falsable: <Qx,Qy> == <x,y>.
- id: INV-HDA-007
  invariante: Preservacion de Angulos
  logica___principio: Las transformaciones conformes/ortogonales conservan los angulos.
  implicacion_operacional: La geometria angular es invariante ortogonal.
  condicion_de_borde: Angulo alterado por Q ortogonal.
  metrica_falsable: cos(Qx,Qy) == cos(x,y).
- id: INV-HDA-008
  invariante: Preservacion de Distancias
  logica___principio: Una isometria conserva todas las distancias entre puntos.
  implicacion_operacional: La estructura metrica es invariante isometrico.
  condicion_de_borde: d(Tx,Ty) != d(x,y).
  metrica_falsable: d(Tx,Ty) == d(x,y).
- id: INV-HDA-009
  invariante: Ortogonalidad de Q en QR
  logica___principio: El factor Q de la descomposicion QR es ortonormal por construccion.
  implicacion_operacional: QR provee una base ortonormal estable.
  condicion_de_borde: Q^T Q se aleja de I.
  metrica_falsable: norm(Q^T Q - I) ~ eps.
- id: INV-HDA-010
  invariante: Invarianza de Valores Singulares
  logica___principio: Los valores singulares son invariantes bajo transformaciones
    ortogonales bilaterales.
  implicacion_operacional: La SVD captura la geometria intrinseca del operador.
  condicion_de_borde: sigma cambia bajo U A V ortogonales.
  metrica_falsable: sv(UAV) == sv(A).
- id: INV-HDA-011
  invariante: Frobenius via Valores Singulares
  logica___principio: La norma de Frobenius es la raiz de la suma de cuadrados de
    los valores singulares.
  implicacion_operacional: Frobenius mide energia total del operador.
  condicion_de_borde: Frobenius != raiz(sum sigma^2).
  metrica_falsable: normF(A)^2 == suma sigma_i^2.
- id: INV-HDA-012
  invariante: Norma Espectral
  logica___principio: La norma espectral es el mayor valor singular.
  implicacion_operacional: Mide la maxima amplificacion del operador.
  condicion_de_borde: norm2(A) != sigma_max.
  metrica_falsable: norm2(A) == sigma_max.
- id: INV-HDA-013
  invariante: Teorema Rango-Nulidad
  logica___principio: La dimension del nucleo mas el rango igualan la dimension del
    dominio.
  implicacion_operacional: Conservacion de dimension en una aplicacion lineal.
  condicion_de_borde: rank + nullity != n.
  metrica_falsable: rank(A) + dim ker(A) == n.
- id: INV-HDA-014
  invariante: Dimension de Suma de Subespacios
  logica___principio: dim(U+W) = dim U + dim W - dim(U interseccion W).
  implicacion_operacional: Conteo de dimensiones bajo union de subespacios.
  condicion_de_borde: Formula de Grassmann violada.
  metrica_falsable: dim(U+W) + dim(U cap W) == dimU + dimW.
- id: INV-HDA-015
  invariante: Independencia bajo Isomorfismo
  logica___principio: Un isomorfismo lineal preserva la independencia lineal.
  implicacion_operacional: La estructura de dependencia es invariante.
  condicion_de_borde: Isomorfismo colapsa vectores independientes.
  metrica_falsable: Independencia preservada por T invertible.
- id: INV-HDA-016
  invariante: Multiplicatividad del Determinante
  logica___principio: El determinante de un producto es el producto de los determinantes.
  implicacion_operacional: det es un homomorfismo multiplicativo.
  condicion_de_borde: det(AB) != det(A)det(B).
  metrica_falsable: det(AB) == det(A) det(B).
- id: INV-HDA-017
  invariante: Invarianza del Polinomio Caracteristico
  logica___principio: El polinomio caracteristico es invariante bajo similaridad.
  implicacion_operacional: Codifica el espectro de forma independiente de base.
  condicion_de_borde: charpoly cambia bajo similaridad.
  metrica_falsable: charpoly(S^-1 A S) == charpoly(A).
- id: INV-HDA-018
  invariante: Invarianza del Polinomio Minimo
  logica___principio: El polinomio minimo es invariante de similaridad.
  implicacion_operacional: Captura la estructura de bloques del operador.
  condicion_de_borde: minpoly cambia de base.
  metrica_falsable: minpoly invariante bajo similaridad.
- id: INV-HDA-019
  invariante: Forma Canonica de Jordan
  logica___principio: La forma de Jordan es un invariante completo de similaridad
    sobre un cuerpo algebraicamente cerrado.
  implicacion_operacional: Clasifica operadores hasta similaridad.
  condicion_de_borde: Dos matrices similares con distinta Jordan.
  metrica_falsable: Jordan(A) unica salvo orden de bloques.
- id: INV-HDA-020
  invariante: Ley de Inercia de Sylvester
  logica___principio: El numero de autovalores positivos, negativos y nulos de una
    forma cuadratica es invariante de congruencia.
  implicacion_operacional: La firma clasifica formas cuadraticas.
  condicion_de_borde: Firma cambia bajo congruencia invertible.
  metrica_falsable: Signatura (p,q,z) invariante.
- id: INV-HDA-021
  invariante: Suma de Autovalores = Traza
  logica___principio: La suma de autovalores (con multiplicidad) iguala la traza.
  implicacion_operacional: Relacion invariante espectro-traza.
  condicion_de_borde: sum lambda != tr(A).
  metrica_falsable: sum lambda_i == tr(A).
- id: INV-HDA-022
  invariante: Producto de Autovalores = Determinante
  logica___principio: El producto de autovalores iguala el determinante.
  implicacion_operacional: Relacion invariante espectro-determinante.
  condicion_de_borde: prod lambda != det(A).
  metrica_falsable: prod lambda_i == det(A).
- id: INV-HDA-023
  invariante: Subespacios Propios de Matrices que Conmutan
  logica___principio: Matrices que conmutan comparten subespacios invariantes.
  implicacion_operacional: Diagonalizacion simultanea de operadores compatibles.
  condicion_de_borde: AB = BA sin base propia comun.
  metrica_falsable: Base propia comun para A,B con AB=BA.
- id: INV-HDA-024
  invariante: Parseval / Plancherel
  logica___principio: En base ortonormal la energia se conserva entre el vector y
    sus coeficientes.
  implicacion_operacional: La norma es invariante bajo cambio a base ortonormal.
  condicion_de_borde: sum de coeficientes^2 != norm^2.
  metrica_falsable: norm(x)^2 == sum abs(<x,e_i>)^2.
- id: INV-HDA-025
  invariante: Varianza Total = Traza de Covarianza
  logica___principio: La varianza total es invariante bajo rotacion y equivale a la
    traza de la covarianza.
  implicacion_operacional: PCA reparte, no crea ni destruye, varianza.
  condicion_de_borde: Varianza total cambia al rotar.
  metrica_falsable: sum var == tr(Cov) invariante.
- id: INV-HDA-026
  invariante: Ortogonalidad de Componentes Principales
  logica___principio: Los componentes principales son ortogonales entre si.
  implicacion_operacional: PCA da una base ortonormal de maxima varianza.
  condicion_de_borde: PCs no ortogonales.
  metrica_falsable: PC_i . PC_j == 0 para i != j.
- id: INV-HDA-027
  invariante: Garantia Johnson-Lindenstrauss
  logica___principio: Con k = O(log n / eps^2) una proyeccion aleatoria preserva distancias
    hasta 1+/-eps.
  implicacion_operacional: La compresion es posible sin perder geometria de pares.
  condicion_de_borde: k por debajo del limite JL.
  metrica_falsable: Distorsion de pares <= eps con alta probabilidad.
- id: INV-HDA-028
  invariante: Proyeccion Aleatoria Preserva Producto Interno
  logica___principio: Una proyeccion aleatoria escalada preserva el producto interno
    en esperanza.
  implicacion_operacional: El sketching conserva la geometria en promedio.
  condicion_de_borde: Sesgo sistematico del producto interno.
  metrica_falsable: E[<Px,Py>] == <x,y>.
- id: INV-HDA-029
  invariante: Norma Esperada bajo Proyeccion
  logica___principio: La proyeccion gaussiana escalada conserva la norma al cuadrado
    en esperanza.
  implicacion_operacional: El sketch es un estimador insesgado de la norma.
  condicion_de_borde: E[norm(Px)^2] != norm(x)^2.
  metrica_falsable: E[norm(Px)^2] == norm(x)^2.
- id: INV-HDA-030
  invariante: Concentracion Gaussiana en sqrt(d)
  logica___principio: La masa de una gaussiana estandar se concentra en una cascara
    de radio raiz de d.
  implicacion_operacional: El 'centro' geometrico esta vacio en alta dimension.
  condicion_de_borde: Masa concentrada cerca del origen.
  metrica_falsable: norm ~ sqrt(d) con desviacion O(1).
- id: INV-HDA-031
  invariante: Cuasi-Ortogonalidad Aleatoria
  logica___principio: Se pueden empaquetar exp(d) vectores casi ortogonales en dimension
    d.
  implicacion_operacional: La dimension alta ofrece capacidad casi-ortogonal enorme.
  condicion_de_borde: Pocos vectores casi ortogonales posibles.
  metrica_falsable: Existen 2^{O(d)} vectores con coseno < eps.
- id: INV-HDA-032
  invariante: Invarianza Rotacional de la Gaussiana
  logica___principio: La gaussiana isotropa es invariante bajo rotaciones.
  implicacion_operacional: No hay direccion privilegiada en ruido isotropo.
  condicion_de_borde: Densidad depende de la direccion.
  metrica_falsable: N(0,I) invariante bajo Q ortogonal.
- id: INV-HDA-033
  invariante: Invarianza de Volumen bajo SL(n)
  logica___principio: Las transformaciones de determinante 1 preservan el volumen.
  implicacion_operacional: El volumen es invariante del grupo especial lineal.
  condicion_de_borde: Volumen cambia con det != 1.
  metrica_falsable: vol(Ax) == vol(x) si det(A)=1.
- id: INV-HDA-034
  invariante: Antisimetria del Producto Exterior
  logica___principio: 'El producto exterior es alternante: intercambiar dos factores
    cambia el signo.'
  implicacion_operacional: El wedge codifica orientacion y volumen con signo.
  condicion_de_borde: Componente simetrica no nula.
  metrica_falsable: x ^ y == - y ^ x.
- id: INV-HDA-035
  invariante: Invarianza de la Orientacion (det>0)
  logica___principio: Las transformaciones con determinante positivo preservan la
    orientacion.
  implicacion_operacional: La orientacion es invariante del grupo GL+.
  condicion_de_borde: Flip de orientacion con det<0.
  metrica_falsable: Orientacion preservada si det(A)>0.
- id: INV-HDA-037
  invariante: Positividad bajo Congruencia
  logica___principio: La definicion positiva se preserva bajo congruencia con matriz
    invertible.
  implicacion_operacional: El cono PSD es invariante de congruencia.
  condicion_de_borde: M^T A M pierde positividad con M invertible.
  metrica_falsable: A PSD => M^T A M PSD.
- id: INV-HDA-038
  invariante: Teorema Espectral
  logica___principio: Toda matriz simetrica real es diagonalizable en una base ortonormal
    de autovectores.
  implicacion_operacional: Base ortonormal garantizada para operadores simetricos.
  condicion_de_borde: Simetrica sin base propia ortonormal.
  metrica_falsable: A = Q Lambda Q^T con Q ortogonal.
- id: INV-HDA-039
  invariante: Existencia de la SVD
  logica___principio: Toda matriz admite descomposicion en valores singulares.
  implicacion_operacional: Factorizacion universal de cualquier operador.
  condicion_de_borde: Matriz sin SVD.
  metrica_falsable: A = U Sigma V^T siempre existe.
- id: INV-HDA-040
  invariante: Rango = Valores Singulares No Nulos
  logica___principio: El rango iguala el numero de valores singulares estrictamente
    positivos.
  implicacion_operacional: Definicion numericamente robusta del rango.
  condicion_de_borde: Rango != conteo de sigma > 0.
  metrica_falsable: rank(A) == card(sigma_i > 0).
- id: INV-HDA-041
  invariante: Eckart-Young
  logica___principio: La mejor aproximacion de rango k en norma espectral/Frobenius
    es truncar la SVD.
  implicacion_operacional: Optimalidad de la truncacion SVD.
  condicion_de_borde: Aproximacion de rango k que bate a SVD truncada.
  metrica_falsable: min norm(A - A_k) alcanzado por SVD_k.
- id: INV-HDA-042
  invariante: Norma Nuclear como Envolvente del Rango
  logica___principio: La norma nuclear es la envolvente convexa del rango en la bola
    espectral.
  implicacion_operacional: Relajacion convexa estandar del rango.
  condicion_de_borde: Sustituto convexo del rango que no sea la nuclear.
  metrica_falsable: nuclear = suma sigma_i.
- id: INV-HDA-043
  invariante: Desigualdad Triangular
  logica___principio: La norma satisface la desigualdad triangular.
  implicacion_operacional: Fundamento de la estructura metrica.
  condicion_de_borde: norm(x+y) > norm(x)+norm(y).
  metrica_falsable: norm(x+y) <= norm(x)+norm(y).
- id: INV-HDA-044
  invariante: Cauchy-Schwarz
  logica___principio: El producto interno esta acotado por el producto de las normas.
  implicacion_operacional: Acota correlaciones y define angulos.
  condicion_de_borde: <x,y> > norm(x)norm(y).
  metrica_falsable: abs(<x,y>) <= norm(x) norm(y).
- id: INV-HDA-045
  invariante: Identidad del Paralelogramo
  logica___principio: Las normas de producto interno satisfacen la identidad del paralelogramo.
  implicacion_operacional: Caracteriza las normas hilbertianas.
  condicion_de_borde: Identidad del paralelogramo falla.
  metrica_falsable: norm(x+y)^2 + norm(x-y)^2 == 2norm(x)^2+2norm(y)^2.
- id: INV-HDA-046
  invariante: Pitagoras Ortogonal
  logica___principio: Para vectores ortogonales la norma al cuadrado es aditiva.
  implicacion_operacional: Descomposicion de energia en direcciones ortogonales.
  condicion_de_borde: norm(x+y)^2 != norm(x)^2+norm(y)^2 con x perp y.
  metrica_falsable: x perp y => norm(x+y)^2 == norm(x)^2+norm(y)^2.
- id: INV-HDA-047
  invariante: Proyeccion Ortogonal Minimiza Distancia
  logica___principio: La proyeccion ortogonal sobre un subespacio es el punto mas
    cercano.
  implicacion_operacional: Solucion variacional de minimos cuadrados.
  condicion_de_borde: Otro punto del subespacio mas cercano.
  metrica_falsable: argmin norm(x-u) alcanzado por la proyeccion.
- id: INV-HDA-048
  invariante: Doble Complemento Ortogonal
  logica___principio: El complemento ortogonal del complemento ortogonal es el subespacio
    original.
  implicacion_operacional: Dualidad involutiva de subespacios.
  condicion_de_borde: (U perp) perp != U.
  metrica_falsable: (U^perp)^perp == U.
- id: INV-HDA-049
  invariante: Descomposicion Ortogonal
  logica___principio: El espacio se descompone en un subespacio y su complemento ortogonal.
  implicacion_operacional: Todo vector se separa en componente y residuo.
  condicion_de_borde: V != U + U perp.
  metrica_falsable: V == U (+) U^perp.
- id: INV-HDA-050
  invariante: Invarianza de Nucleo e Imagen
  logica___principio: El nucleo y la imagen son estables bajo composicion con isomorfismos.
  implicacion_operacional: La estructura de la aplicacion es intrinseca.
  condicion_de_borde: ker/im cambian con isomorfismo.
  metrica_falsable: ker(TA), im(AT) relacionados por iso.
- id: INV-HDA-051
  invariante: Valores Singulares bajo Transposicion
  logica___principio: A y su transpuesta comparten los mismos valores singulares.
  implicacion_operacional: La geometria singular es simetrica en filas/columnas.
  condicion_de_borde: sv(A) != sv(A^T).
  metrica_falsable: sv(A) == sv(A^T).
- id: INV-HDA-052
  invariante: Autovalores de A^T A No Negativos
  logica___principio: Los autovalores de A^T A son los cuadrados de los valores singulares,
    no negativos.
  implicacion_operacional: Conexion espectro-singular fundamental.
  condicion_de_borde: Autovalor negativo de A^T A.
  metrica_falsable: eig(A^T A) == sigma^2 >= 0.
- id: INV-HDA-053
  invariante: Entrelazado de Cauchy
  logica___principio: Los autovalores de una submatriz principal entrelazan los de
    la matriz.
  implicacion_operacional: Cota estructural sobre submatrices simetricas.
  condicion_de_borde: Entrelazado de autovalores violado.
  metrica_falsable: lambda_k(A) <= lambda_k(submatriz) <= lambda_{k+1}(A).
- id: INV-HDA-054
  invariante: Desigualdad de Weyl
  logica___principio: La perturbacion de autovalores esta acotada por la norma de
    la perturbacion.
  implicacion_operacional: Estabilidad del espectro ante ruido.
  condicion_de_borde: Salto de autovalor mayor que la perturbacion.
  metrica_falsable: abs(lambda_k(A+E)-lambda_k(A)) <= norm2(E).
- id: INV-HDA-055
  invariante: Davis-Kahan
  logica___principio: La rotacion de un subespacio propio esta acotada por la perturbacion
    sobre el gap espectral.
  implicacion_operacional: Estabilidad de subespacios con buen gap.
  condicion_de_borde: Rotacion grande con gap grande.
  metrica_falsable: sin(theta) <= norm(E)/gap.
- id: INV-HDA-056
  invariante: Courant-Fischer (Min-Max)
  logica___principio: Los autovalores tienen caracterizacion variacional min-max.
  implicacion_operacional: Autovalores como optimos de cocientes de Rayleigh.
  condicion_de_borde: Caracterizacion min-max falla.
  metrica_falsable: lambda_k == min-max del cociente de Rayleigh.
- id: INV-HDA-057
  invariante: Hoffman-Wielandt
  logica___principio: La distancia entre espectros esta acotada por la norma de Frobenius
    de la diferencia.
  implicacion_operacional: Estabilidad global del espectro para normales.
  condicion_de_borde: Emparejamiento espectral peor que Frobenius.
  metrica_falsable: sum(lambda_i - mu_i)^2 <= normF(A-B)^2.
- id: INV-HDA-058
  invariante: Traza de Kronecker
  logica___principio: La traza de un producto de Kronecker es el producto de las trazas.
  implicacion_operacional: Factorizacion de invariantes bajo producto tensorial.
  condicion_de_borde: tr(A kron B) != tr(A)tr(B).
  metrica_falsable: tr(A kron B) == tr(A) tr(B).
- id: INV-HDA-059
  invariante: Autovalores de Kronecker
  logica___principio: Los autovalores de A kron B son los productos de los autovalores.
  implicacion_operacional: Espectro tensorial factoriza.
  condicion_de_borde: Espectro de Kronecker no factoriza.
  metrica_falsable: eig(A kron B) == {a_i b_j}.
- id: INV-HDA-060
  invariante: Rango de Kronecker
  logica___principio: El rango de A kron B es el producto de los rangos.
  implicacion_operacional: El rango es multiplicativo bajo Kronecker.
  condicion_de_borde: rank(A kron B) != rank(A)rank(B).
  metrica_falsable: rank(A kron B) == rank(A) rank(B).
- id: INV-HDA-061
  invariante: Asociatividad del Producto Tensorial
  logica___principio: El producto tensorial es asociativo salvo isomorfismo natural.
  implicacion_operacional: La estructura monoidal esta bien definida hasta iso.
  condicion_de_borde: Reasociacion no isomorfa.
  metrica_falsable: (U x V) x W ~= U x (V x W).
- id: INV-HDA-062
  invariante: Universalidad del Producto Tensorial
  logica___principio: El producto tensorial es universal para aplicaciones bilineales.
  implicacion_operacional: Toda bilineal factoriza unicamente por el tensor.
  condicion_de_borde: Bilineal sin factorizacion unica.
  metrica_falsable: Factorizacion universal existe y es unica.
- id: INV-HDA-063
  invariante: Multilinealidad del Determinante
  logica___principio: El determinante es lineal en cada columna por separado.
  implicacion_operacional: Base del calculo y expansion del determinante.
  condicion_de_borde: det no lineal en una columna.
  metrica_falsable: det lineal en cada argumento.
- id: INV-HDA-064
  invariante: Alternancia del Determinante
  logica___principio: El determinante se anula si dos columnas son iguales y cambia
    de signo al intercambiarlas.
  implicacion_operacional: Codifica dependencia lineal y orientacion.
  condicion_de_borde: det no alterna.
  metrica_falsable: Columnas iguales => det == 0.
- id: INV-HDA-065
  invariante: Invarianza del Rango Multilineal
  logica___principio: El rango multilineal (Tucker) es invariante bajo transformaciones
    de base por modo.
  implicacion_operacional: Nocion intrinseca de rango tensorial.
  condicion_de_borde: Rango multilineal cambia de base.
  metrica_falsable: multirank invariante bajo cambios por modo.
- id: INV-HDA-066
  invariante: Border Rank <= Rank
  logica___principio: El rango de borde nunca supera al rango tensorial.
  implicacion_operacional: Cota que explica la mala postura de CP.
  condicion_de_borde: border rank > rank.
  metrica_falsable: border_rank(T) <= rank(T).
- id: INV-HDA-067
  invariante: Libertad de Gauge en Tensor Trains
  logica___principio: Insertar G G^-1 entre nucleos no cambia el tensor representado.
  implicacion_operacional: Redundancia de gauge de las redes tensoriales.
  condicion_de_borde: Insercion de gauge altera el tensor.
  metrica_falsable: TT invariante bajo G G^-1.
- id: INV-HDA-068
  invariante: Concentracion de Lipschitz
  logica___principio: Una funcion Lipschitz de una gaussiana se concentra en torno
    a su media.
  implicacion_operacional: Estabilidad de funciones suaves en alta dimension.
  condicion_de_borde: Funcion Lipschitz con cola pesada.
  metrica_falsable: P(abs(f-Ef)>t) <= 2 exp(-t^2/2L^2).
- id: INV-HDA-069
  invariante: Isoperimetria Gaussiana
  logica___principio: Los semiespacios minimizan el area de frontera para volumen
    gaussiano dado.
  implicacion_operacional: Optimalidad geometrica en el espacio gaussiano.
  condicion_de_borde: Conjunto que bate al semiespacio.
  metrica_falsable: Frontera minima alcanzada por semiespacios.
- id: INV-HDA-070
  invariante: Invarianza Ciclica de la Traza
  logica___principio: La traza es invariante bajo permutacion ciclica de factores.
  implicacion_operacional: Simplifica invariantes de productos matriciales.
  condicion_de_borde: tr(ABC) != tr(BCA).
  metrica_falsable: tr(ABC) == tr(BCA).
- id: INV-HDA-071
  invariante: Norma de Schatten bajo Unitaria
  logica___principio: Las normas de Schatten son invariantes bajo transformaciones
    unitarias.
  implicacion_operacional: Familia de normas intrinsecas del operador.
  condicion_de_borde: Schatten cambia bajo unitaria.
  metrica_falsable: Schatten_p(UAV) == Schatten_p(A).
- id: INV-HDA-072
  invariante: Producto de Frobenius bajo Unitarias
  logica___principio: El producto interno de Frobenius es invariante bajo unitarias
    bilaterales.
  implicacion_operacional: Geometria de matrices invariante ortogonal.
  condicion_de_borde: <UAV,UBV>_F != <A,B>_F.
  metrica_falsable: <UAV, UBV>_F == <A,B>_F.
- id: INV-HDA-073
  invariante: Coherencia de Mac Lane
  logica___principio: Pentagono y triangulo implican que todo diagrama de coherencia
    conmuta.
  implicacion_operacional: Una estructura monoidal debil es tan buena como una estricta.
  condicion_de_borde: Diagrama de coherencia que no conmuta.
  metrica_falsable: Todos los diagramas de asociador conmutan.
- id: INV-HDA-074
  invariante: Univalencia (Iso = Identidad)
  logica___principio: Tipos equivalentes son iguales; el isomorfismo es un camino
    de identidad.
  implicacion_operacional: Transporte de estructura a lo largo de equivalencias.
  condicion_de_borde: Iso sin identidad correspondiente.
  metrica_falsable: (A ~= B) equivalente a (A == B).
- id: INV-HDA-075
  invariante: Invarianza Homotopica del Tipo
  logica___principio: Las propiedades de un tipo son invariantes bajo equivalencia.
  implicacion_operacional: Solo importa el tipo salvo equivalencia.
  condicion_de_borde: Propiedad que distingue equivalentes.
  metrica_falsable: P(A) sii P(B) cuando A ~= B.
- id: INV-HDA-076
  invariante: Invarianza de infinito-Grupoide
  logica___principio: La estructura de infinito-grupoide es invariante bajo equivalencia.
  implicacion_operacional: Los tipos homotopicos son los objetos fundamentales.
  condicion_de_borde: Equivalencia que altera la estructura.
  metrica_falsable: Estructura preservada por equivalencia debil.
- id: INV-HDA-077
  invariante: Ley de Intercambio (2-Categoria)
  logica___principio: La composicion horizontal y vertical de 2-morfismos conmuta.
  implicacion_operacional: Coherencia basica de estructuras bidimensionales.
  condicion_de_borde: Ley de intercambio falla.
  metrica_falsable: (a*b)(c*d) == (ac)*(bd).
- id: INV-HDA-078
  invariante: Coherencia del Asociador
  logica___principio: El asociador de una categoria monoidal satisface el pentagono.
  implicacion_operacional: Fija la reasociacion de forma coherente.
  condicion_de_borde: Pentagono no conmuta.
  metrica_falsable: Identidad del pentagono se cumple.
- id: INV-HDA-079
  invariante: Invariantes de Postnikov
  logica___principio: Los grupos de homotopia son invariantes de la torre de Postnikov.
  implicacion_operacional: Clasifican el tipo homotopico por niveles.
  condicion_de_borde: Invariante de Postnikov cambia bajo equivalencia.
  metrica_falsable: pi_n invariante bajo equivalencia debil.
- id: INV-HDA-080
  invariante: Invarianza Homotopica de Euler
  logica___principio: La caracteristica de Euler es invariante homotopico.
  implicacion_operacional: Invariante topologico calculable.
  condicion_de_borde: chi cambia bajo equivalencia homotopica.
  metrica_falsable: chi invariante bajo homotopia.
- id: INV-HDA-082
  invariante: Functorialidad
  logica___principio: Un functor preserva composicion e identidades.
  implicacion_operacional: Los functores transportan estructura de forma coherente.
  condicion_de_borde: F(g o f) != F(g) o F(f).
  metrica_falsable: F(g o f) == F(g) o F(f) y F(id)==id.
- id: INV-HDA-083
  invariante: Naturalidad
  logica___principio: Una transformacion natural conmuta con los morfismos (cuadrado
    natural).
  implicacion_operacional: Transformaciones respetan la estructura functorial.
  condicion_de_borde: Cuadrado de naturalidad no conmuta.
  metrica_falsable: Cuadrado natural conmuta para todo morfismo.
- id: INV-HDA-084
  invariante: Transporte Paralelo Plano
  logica___principio: En una conexion plana el transporte paralelo es independiente
    del camino.
  implicacion_operacional: Curvatura cero implica holonomia trivial local.
  condicion_de_borde: Transporte depende del camino con curvatura 0.
  metrica_falsable: Holonomia trivial en region simplemente conexa.
- id: INV-HDA-085
  invariante: Invarianza de la Dimension (Brouwer)
  logica___principio: La dimension topologica es invariante bajo homeomorfismo.
  implicacion_operacional: R^n y R^m no son homeomorfos si n != m.
  condicion_de_borde: Homeomorfismo entre dimensiones distintas.
  metrica_falsable: dim invariante bajo homeomorfismo.
- id: INV-HDA-087
  invariante: Forma Normal de Smith
  logica___principio: Sobre un DIP toda matriz tiene forma normal de Smith con factores
    invariantes unicos.
  implicacion_operacional: Clasifica modulos finitamente generados.
  condicion_de_borde: Factores invariantes no unicos.
  metrica_falsable: Factores invariantes d_1 divide d_2 divide ... unicos.
- id: INV-HDA-088
  invariante: Factores Invariantes / Divisores Elementales
  logica___principio: Los divisores elementales clasifican el modulo salvo isomorfismo.
  implicacion_operacional: Invariante completo de estructura de modulo.
  condicion_de_borde: Dos modulos con mismos divisores no isomorfos.
  metrica_falsable: Divisores elementales determinan el modulo.
- id: INV-HDA-089
  invariante: Invarianza del Indice de Fredholm
  logica___principio: El indice de Fredholm es estable bajo perturbaciones compactas.
  implicacion_operacional: Invariante robusto de operadores.
  condicion_de_borde: Indice cambia bajo perturbacion compacta.
  metrica_falsable: ind(A+K) == ind(A) para K compacto.
- id: INV-HDA-090
  invariante: Teorema de la Dimension
  logica___principio: Todas las bases de un espacio vectorial tienen el mismo cardinal.
  implicacion_operacional: La dimension esta bien definida.
  condicion_de_borde: Dos bases de distinto tamano.
  metrica_falsable: card(base_1) == card(base_2).
- id: INV-HDA-091
  invariante: Invarianza de Correlacion bajo Escala
  logica___principio: El coeficiente de correlacion es invariante bajo escalados y
    traslaciones afines.
  implicacion_operacional: Similitud direccional independiente de unidades.
  condicion_de_borde: Correlacion cambia al reescalar.
  metrica_falsable: corr(ax+b, cy+d) == corr(x,y).
- id: INV-HDA-092
  invariante: Monotonia de Valores Singulares (Submatriz)
  logica___principio: Los valores singulares de una submatriz entrelazan los de la
    matriz.
  implicacion_operacional: Cota estructural bajo eliminacion de filas/columnas.
  condicion_de_borde: Entrelazado singular violado.
  metrica_falsable: sigma_k(sub) <= sigma_k(A).
- id: INV-HDA-093
  invariante: Conservacion de la Norma en Forma Canonica
  logica___principio: La forma canonica de una red tensorial preserva la norma del
    estado.
  implicacion_operacional: Canonicalizacion sin perdida de norma.
  condicion_de_borde: Norma cambia al canonicalizar.
  metrica_falsable: norm(TT_canonico) == norm(TT).
- id: INV-HDA-094
  invariante: Invarianza del Producto Escalar bajo Transporte Isometrico
  logica___principio: El transporte isometrico conserva el producto escalar entre
    vectores.
  implicacion_operacional: La metrica se preserva a lo largo del transporte.
  condicion_de_borde: Producto escalar cambia con transporte isometrico.
  metrica_falsable: <Tx,Ty> == <x,y> bajo transporte isometrico.
- id: INV-HDA-095
  invariante: Estabilidad de Rango bajo Perturbacion Pequena
  logica___principio: El rango no decrece bajo perturbaciones menores que el menor
    valor singular no nulo.
  implicacion_operacional: El rango es semicontinuo inferiormente.
  condicion_de_borde: Rango cae con perturbacion < sigma_r.
  metrica_falsable: rank(A+E) >= rank(A) si norm(E) < sigma_r.
- id: INV-HDA-096
  invariante: Aditividad del Producto Interno de Frobenius
  logica___principio: El producto interno de Frobenius induce una geometria euclidea
    en el espacio de matrices.
  implicacion_operacional: Las matrices forman un espacio de Hilbert de dimension
    finita.
  condicion_de_borde: Producto de Frobenius no bilineal.
  metrica_falsable: <A,B>_F == tr(A^T B).
- id: INV-HDA-097
  invariante: Invarianza de la Media bajo Proyeccion Insesgada
  logica___principio: Un esquema de sketching insesgado preserva la media de la cantidad
    estimada.
  implicacion_operacional: Estimadores aleatorios centrados en el valor real.
  condicion_de_borde: E[estimador] != valor.
  metrica_falsable: E[sketch(x)] == x.
- id: INV-HDA-098
  invariante: Conservacion de la Suma de Cuadrados (ANOVA)
  logica___principio: La suma total de cuadrados se descompone en explicada mas residual.
  implicacion_operacional: Descomposicion ortogonal de la varianza.
  condicion_de_borde: SST != SSR + SSE.
  metrica_falsable: SST == SSR + SSE.
- id: INV-HDA-099
  invariante: Invarianza de la Distancia de Mahalanobis
  logica___principio: La distancia de Mahalanobis es invariante bajo transformaciones
    lineales invertibles.
  implicacion_operacional: Metrica adaptada a la covarianza, independiente de base.
  condicion_de_borde: Mahalanobis cambia bajo transformacion lineal.
  metrica_falsable: d_M invariante bajo A invertible.
- id: INV-HDA-100
  invariante: Invarianza Fundamental HDA-HoTT
  logica___principio: En fundamentos univalentes, la estructura algebraica de alta
    dimension es la de los infinito-grupoides (tipos).
  implicacion_operacional: Algebra de alta dimension = teoria de tipos homotopica.
  condicion_de_borde: Estructura que distingue tipos equivalentes.
  metrica_falsable: Objetos = tipos salvo equivalencia.
- id: ANTI-HDA-001
  antipatron: Invertir la Matriz Explicitamente
  disfuncion_causal: Calcular inv(A) para resolver Ax=b en vez de factorizar, amplificando
    el error y el coste.
  senal_de_presencia: Uso de inv(A)*b o pinv por defecto.
  impacto_en_robustez: Perdida de precision y O(n^3) innecesario.
  refactor_alternativa: Factorizar (LU/QR/Cholesky) y resolver.
- id: ANTI-HDA-002
  antipatron: Ecuaciones Normales
  disfuncion_causal: Resolver minimos cuadrados via A^T A, que eleva al cuadrado el
    numero de condicion.
  senal_de_presencia: Formar A^T A explicitamente.
  impacto_en_robustez: 'Kappa^2: perdida catastrofica de precision.'
  refactor_alternativa: QR o SVD sobre A directamente.
- id: ANTI-HDA-003
  antipatron: Gram-Schmidt Clasico
  disfuncion_causal: Ortogonalizar con Gram-Schmidt clasico, que pierde ortogonalidad
    por redondeo.
  senal_de_presencia: CGS en bases mal condicionadas.
  impacto_en_robustez: Q^T Q lejos de I.
  refactor_alternativa: Gram-Schmidt modificado o Householder.
- id: ANTI-HDA-004
  antipatron: Comparar Floats por Igualdad
  disfuncion_causal: Usar == sobre flotantes ignorando el error de redondeo.
  senal_de_presencia: if x == 0.0 sobre resultados calculados.
  impacto_en_robustez: Ramas erroneas por epsilon.
  refactor_alternativa: Comparacion con tolerancia relativa/absoluta.
- id: ANTI-HDA-005
  antipatron: Softmax sin Restar el Maximo
  disfuncion_causal: Exponenciar logits sin estabilizar por el maximo.
  senal_de_presencia: exp(logits) directo.
  impacto_en_robustez: Overflow a NaN/Inf.
  refactor_alternativa: softmax(x - max(x)).
- id: ANTI-HDA-006
  antipatron: Norma sin Escalado
  disfuncion_causal: Calcular sqrt(sum x^2) sin escalar, con overflow/underflow para
    valores extremos.
  senal_de_presencia: Norma naive de vectores mal escalados.
  impacto_en_robustez: Inf o 0 espurio.
  refactor_alternativa: Escalado por el maximo (hypot/BLAS nrm2).
- id: ANTI-HDA-007
  antipatron: Umbral de Rango Absoluto
  disfuncion_causal: Decidir el rango con un umbral fijo en vez de relativo a sigma_max.
  senal_de_presencia: Cortar sigma con constante fija.
  impacto_en_robustez: Rango mal estimado segun la escala.
  refactor_alternativa: 'Tolerancia relativa: sigma > tol * sigma_max.'
- id: ANTI-HDA-008
  antipatron: Euclideo como Similitud en Alta Dimension
  disfuncion_causal: Usar distancia L2 como similitud ignorando la concentracion de
    distancias.
  senal_de_presencia: kNN euclideo directo en d grande.
  impacto_en_robustez: Vecinos sin significado (contraste nulo).
  refactor_alternativa: Coseno, metrica aprendida o reduccion previa.
- id: ANTI-HDA-009
  antipatron: kNN Ingenuo en Alta Dimension
  disfuncion_causal: Aplicar kNN sin corregir hubness ni concentracion.
  senal_de_presencia: Recuperacion por vecinos crudos.
  impacto_en_robustez: Hubs dominan; recall sesgado.
  refactor_alternativa: Mutual proximity; reducir dimension antes.
- id: ANTI-HDA-010
  antipatron: PCA sin Centrar
  disfuncion_causal: Ejecutar PCA sin centrar (ni escalar) los datos.
  senal_de_presencia: SVD sobre datos crudos.
  impacto_en_robustez: Primer componente captura la media.
  refactor_alternativa: Centrar y (si procede) estandarizar.
- id: ANTI-HDA-011
  antipatron: Retener Componentes por Varianza Ciega
  disfuncion_causal: Quedarse con k componentes por umbral de varianza sin separar
    senal de ruido.
  senal_de_presencia: Corte por varianza acumulada fija.
  impacto_en_robustez: Componentes de ruido retenidos.
  refactor_alternativa: Umbral Marchenko-Pastur; validacion cruzada.
- id: ANTI-HDA-012
  antipatron: Asumir Embeddings Isotropos
  disfuncion_causal: Tratar embeddings como isotropos ignorando el cono de anisotropia.
  senal_de_presencia: Coseno crudo sobre embeddings de LLM.
  impacto_en_robustez: Similitud inflada y sesgada.
  refactor_alternativa: Whitening o normalizacion isotropica.
- id: ANTI-HDA-013
  antipatron: CP sin Regularizar
  disfuncion_causal: Ajustar CP sin restricciones, cayendo en degeneracion (factores
    que divergen y cancelan).
  senal_de_presencia: CP-ALS sin penalizacion.
  impacto_en_robustez: Factores -> infinito sin converger.
  refactor_alternativa: No negatividad/ortogonalidad o border rank.
- id: ANTI-HDA-014
  antipatron: Orden de Contraccion Arbitrario
  disfuncion_causal: Contraer una red tensorial en orden fijo sin optimizar el path.
  senal_de_presencia: einsum sin optimizar.
  impacto_en_robustez: Tensor intermedio explosivo.
  refactor_alternativa: Optimizar el path (opt_einsum).
- id: ANTI-HDA-015
  antipatron: Materializar Kronecker
  disfuncion_causal: Formar el producto de Kronecker explicito en vez de aplicar su
    estructura.
  senal_de_presencia: kron(A,B) denso.
  impacto_en_robustez: Memoria (mn)^2 innecesaria.
  refactor_alternativa: 'Vec-trick: (B^T kron A) vec(X).'
- id: ANTI-HDA-016
  antipatron: Densificar Sparse
  disfuncion_causal: Convertir una matriz sparse a densa para 'simplificar'.
  senal_de_presencia: toarray() sobre matriz enorme.
  impacto_en_robustez: Explosion de memoria.
  refactor_alternativa: Rutinas sparse nativas.
- id: ANTI-HDA-017
  antipatron: Determinante como Test de Singularidad
  disfuncion_causal: Usar det ~ 0 para juzgar singularidad, cuando escala mal con
    la dimension.
  senal_de_presencia: if det(A) < eps.
  impacto_en_robustez: Diagnostico enganoso (det escala con n).
  refactor_alternativa: Numero de condicion o rango via SVD.
- id: ANTI-HDA-018
  antipatron: Bucle Escalar en vez de BLAS
  disfuncion_causal: Implementar algebra con bucles Python en lugar de rutinas vectorizadas.
  senal_de_presencia: for anidados sobre matrices.
  impacto_en_robustez: Ordenes de magnitud mas lento.
  refactor_alternativa: BLAS/LAPACK vectorizado; batching.
- id: ANTI-HDA-019
  antipatron: Sobre-Estrictificar
  disfuncion_causal: Colapsar una estructura debil (categorica) a estricta, perdiendo
    coherencia.
  senal_de_presencia: Forzar asociatividad estricta.
  impacto_en_robustez: Perdida de morfismos de coherencia.
  refactor_alternativa: Trabajar hasta homotopia; respetar coherencia.
- id: ANTI-HDA-020
  antipatron: Confundir Rango con Border Rank
  disfuncion_causal: Truncar tensores asumiendo rank = border rank y sin control de
    error.
  senal_de_presencia: Aproximacion de rango k sin verificar.
  impacto_en_robustez: Error no acotado por mala postura.
  refactor_alternativa: Formato de rango de borde; control de error.
- id: RED-HDA-001
  redundancia_c5: SVD como Oraculo Numerico
  funcion_topologica: Provee rango, pseudo-inversa, mejor bajo rango y numero de condicion
    desde una unica factorizacion.
  riesgo_mitigado: Colapso de rango, mal condicionamiento, inversa inestable.
  coste_overhead: O(mn min(m,n)) por descomposicion.
  dependencias: LAPACK gesdd/gesvd.
- id: RED-HDA-002
  redundancia_c5: Pivoteo
  funcion_topologica: Intercambia filas/columnas para evitar pivotes diminutos y estabilizar
    la factorizacion.
  riesgo_mitigado: Pivote diminuto, inestabilidad de LU.
  coste_overhead: Coste de busqueda del pivote.
  dependencias: LU/QR con pivoteo.
- id: RED-HDA-003
  redundancia_c5: Householder / MGS
  funcion_topologica: Ortogonalizacion estable via reflexiones o Gram-Schmidt modificado.
  riesgo_mitigado: Perdida de ortogonalidad.
  coste_overhead: Ligeramente mayor que CGS.
  dependencias: QR de Householder.
- id: RED-HDA-004
  redundancia_c5: Refinamiento Iterativo
  funcion_topologica: Corrige la solucion de un solve calculando y reinyectando el
    residuo.
  riesgo_mitigado: Redondeo acumulado en el solve.
  coste_overhead: Un residuo y solve extra por iteracion.
  dependencias: Residuo en precision extendida.
- id: RED-HDA-005
  redundancia_c5: Precondicionamiento
  funcion_topologica: Transforma el sistema para agrupar el espectro y acelerar la
    convergencia.
  riesgo_mitigado: Estancamiento de CG/GMRES.
  coste_overhead: Construccion y aplicacion del precondicionador.
  dependencias: ILU, multigrid, Jacobi por bloques.
- id: RED-HDA-006
  redundancia_c5: Aritmetica Compensada
  funcion_topologica: Suma/producto interno de Kahan que recupera los bits de redondeo
    perdidos.
  riesgo_mitigado: Cancelacion, redondeo acumulado.
  coste_overhead: ~4x flops en la reduccion.
  dependencias: Kahan/Neumaier; FMA.
- id: RED-HDA-007
  redundancia_c5: Regularizacion de Tikhonov
  funcion_topologica: Anade un termino ridge que convierte un problema mal planteado
    en bien planteado.
  riesgo_mitigado: Mal condicionamiento, mala postura.
  coste_overhead: Sesgo controlado por lambda.
  dependencias: Seleccion de lambda (L-curve, GCV).
- id: RED-HDA-008
  redundancia_c5: Sketching + Verificacion
  funcion_topologica: Reduce dimension con proyeccion aleatoria y verifica el resultado
    a posteriori.
  riesgo_mitigado: Coste O(n^3), maldicion de dimension.
  coste_overhead: Error controlado con chequeo posterior.
  dependencias: JL, CountSketch, leverage.
- id: RED-HDA-009
  redundancia_c5: Reortogonalizacion
  funcion_topologica: Reortogonaliza los vectores de Krylov para evitar autovalores
    fantasma.
  riesgo_mitigado: Ruptura de Lanczos/Arnoldi.
  coste_overhead: Ortogonalizacion adicional por paso.
  dependencias: Reortogonalizacion selectiva.
- id: RED-HDA-010
  redundancia_c5: Forma Canonica de Tensor Network
  funcion_topologica: Fija el gauge de una red tensorial para estabilizar norma y
    truncacion.
  riesgo_mitigado: Fuga de norma, truncacion mal controlada.
  coste_overhead: Barrido de canonicalizacion (QR/SVD).
  dependencias: Gauge fixing; forma canonica mixta.
