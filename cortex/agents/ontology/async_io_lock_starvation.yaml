Claim: La inyección de llamadas I/O síncronas (ej. sqlite3 puro) dentro de un ciclo de eventos asíncrono bloquea el hilo principal físicamente, provocando inanición de eventos (Event Loop Starvation) y la parálisis silenciosa de todos los actores del Swarm.
Proof: 
  Base: 0x2D5F9A1B
  Range: [0, 1]
  Confidence: C5-REAL
Isomorphisms:
  - Estructura_Fisica: "Llamada bloqueante al sistema (syscall) sobre el disco en el hilo principal sin ceder ejecución (yield) al planificador."
  - Estructura_Logica: "import sqlite3; db.execute('COMMIT') inyectado directamente en un flujo def async."
  - Invariante_C5_REAL: "Colapso asíncrono estricto. Toda E/S de base de datos delega al WAL vía aiosqlite o mediante ThreadPoolExecutor segregado (Ley Ω1, INV_BFT_02)."
Blast_Radius_Matrix:
  Vector: Asynchronous I/O Lock (Event Loop Starvation)
  Blast_Radius: Parálisis térmica del orquestador, fallos de latido (Heartbeat Timeout) de subagentes y generación de Actores Zombie.
  Target_Invariant: INV_BFT_02, Asynchronous I/O Lock
  Anergy_Risk: MAX (Colapso Sistémico de Concurrencia BFT)
