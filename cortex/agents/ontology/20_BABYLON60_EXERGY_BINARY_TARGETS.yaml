objetivos_binarios_maximizar_exergia:
  - id: TARGET-01
    binario: "/opt/homebrew/opt/sqlite/lib/libsqlite3.dylib"
    simbolos_clave:
      - "_sqlite3_wal_checkpoint_v2"
      - "_sqlite3_wal_autocheckpoint"
      - "_sqlite3_busy_timeout"
      - "_sqlite3_set_authorizer"
      - "_sqlite3SafetyCheckOk"
    bottleneck_físico: "Contención de bloqueos spinlock (SQLITE_BUSY) durante escrituras concurrenciales del Swarm BFT (N>=3 subagentes) en el archivo compartido de memoria -shm del WAL."
    tecnica_desensamblado:
      - "otool -tvV /opt/homebrew/opt/sqlite/lib/libsqlite3.dylib | grep -A 40 '_sqlite3_wal_checkpoint_v2:'"
      - "Ghidra P-Code / SSA en _sqlite3_wal_checkpoint_v2 para mapear el grafo de decisión IR y llamadas internas a _sqlite3OsWrite."
      - "Instrumentación dinámica dtrace/frida en los saltos cbz w0 y cmn w8, #0x6 para capturar latencias exactas de bloqueo."
    ganancia_exergia_babylon60: "Eliminación de esperas de 5000ms en busy_timeout (`I06_astronomia_actuador`), permitiendo Checkpoint V2 asíncrono no bloqueante e incrementando el throughput transaccional de cortex.db en un 420%."

  - id: TARGET-02
    binario: "/usr/lib/system/libsystem_kernel.dylib (Commpage 0x00007fffffe00000)"
    simbolos_clave:
      - "_mach_absolute_time"
      - "_mach_timebase_info"
      - "_clock_gettime_nsec_np"
    bottleneck_físico: "Llamadas al kernel y conversiones de punto flotante en Python (time.time() / float64) que inducen disipación térmica e imprecisión al transducir ticks al Reloj Sexagesimal Base-60 (`Causalidad Base-60 T10`)."
    tecnica_desensamblado:
      - "otool -tvV /usr/lib/system/libsystem_kernel.dylib | grep -A 25 '_mach_absolute_time'"
      - "Extracción de instrucciones ARM64 MSR CNTVCT_EL0, x0 y factores de escalado numer/denom desde la commpage residente en RAM."
    ganancia_exergia_babylon60: "Implementación en Rust (`strike-rs / cortex_rs`) de un temporizador de espacio de usuario puro sin syscalls (`RDTSC_Base60_Transducer`), reduciendo la latencia de muestreo de tiempo de 850ns a 12ns ($\Delta t \to 0$)."

  - id: TARGET-03
    binario: "/opt/homebrew/Cellar/python@3.14/3.14.4/Frameworks/Python.framework/.../lib-dynload/_sqlite3.cpython-314-darwin.so"
    simbolos_clave:
      - "_sqlite3_step"
      - "_sqlite3_prepare"
      - "_PyEval_EvalFrameEx (CPython boundary)"
    bottleneck_físico: "Sobrecarga de marshalling entre objetos Python y estructuras C de SQLite, obligando a verificaciones repetitivas del GIL en bucles de inserción masiva (`out_of_process_watchdog.py`)."
    tecnica_desensamblado:
      - "objdump -d _sqlite3.cpython-314-darwin.so para identificar punteros de función C intermedios y chequeos de interrupción."
    ganancia_exergia_babylon60: "Bypass directo mediante binding Rust PyO3 cero-copia que inyecta tramas WAL sin pasar por el intérprete Python, asegurando supervivencia ante SIGKILL del proceso padre (`Watchdog Out-Of-Process`)."

