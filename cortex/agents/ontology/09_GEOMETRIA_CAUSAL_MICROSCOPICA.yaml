  activacion_trigger: Poda de enlaces de la cadena.
  sensor_sintoma: Longitud de cadena cae abruptamente.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Restaurar enlaces de la cadena maximal.
- id: PRIM-EST-054
  primitiva: Deriva de la Geodesica Discreta (Discrete Geodesic Drift)
