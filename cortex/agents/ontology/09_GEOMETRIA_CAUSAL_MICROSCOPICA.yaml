entities:
- id: PRIM-EST-001
  primitiva: Ruptura de Transitividad (Transitivity Break)
  mecanismo_causal: El orden causal pierde a<c pese a existir a<b y b<c, rompiendo
    el poset.
  activacion_trigger: Composicion de relaciones sin cierre transitivo.
  sensor_sintoma: Aserto a<b<c falla el test de closure.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Recalcular cierre transitivo y anclar en Ledger BFT.
- id: PRIM-EST-002
  primitiva: Ciclo Causal Cerrado (Closed Timelike Curve)
  mecanismo_causal: Aparicion de un bucle a<b<...<a que viola la acyclicidad del DAG
    causal.
  activacion_trigger: Insercion de arista que retro-conecta un descendiente.
  sensor_sintoma: Detector de ciclos reporta componente fuertemente conexo.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Abortar mutacion; podar arista y forzar DAG estricto.
- id: PRIM-EST-003
  primitiva: Fallo de Antisimetria (Antisymmetry Failure)
  mecanismo_causal: Coexisten a<b y b<a colapsando la distincion de precedencia.
  activacion_trigger: Doble insercion simetrica sin arbitro de orden.
  sensor_sintoma: Par (a,b) presente en ambas direcciones de la matriz.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Apoptosis del par; reasertar orden por reloj de nacimiento.
- id: PRIM-EST-004
  primitiva: Auto-enlace Reflexivo (Reflexive Self-Link)
  mecanismo_causal: Un evento se relaciona consigo mismo (e<e) violando la irreflexividad.
  activacion_trigger: Bucle degenerado en el generador de relaciones.
  sensor_sintoma: Diagonal de la matriz causal distinta de cero.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Anular diagonal; irreflexividad como invariante P0.
- id: PRIM-EST-005
  primitiva: Fractura de Embedding Fiel (Faithful Embedding Fracture)
  mecanismo_causal: El causet deja de admitir inmersion isometrica aproximada en variedad
    alguna.
  activacion_trigger: Sprinkling deformado o coarse-grain agresivo.
  sensor_sintoma: Test de Hauptvermutung sin variedad candidata.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Rechazar causet no-manifoldlike; re-sprinklear.
- id: PRIM-EST-006
  primitiva: Divergencia del Estimador de Dimension (Myrheim-Meyer Divergence)
  mecanismo_causal: El estimador de dimension de ordenamiento diverge o da valor no
    fisico.
  activacion_trigger: Fraccion de relaciones fuera del rango de continuum.
  sensor_sintoma: Dimension estimada -> inf o negativa.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Cruzar con estimador de cadena; descartar region.
- id: PRIM-EST-007
  primitiva: Sobredensidad de Sprinkling (Sprinkling Overdensity)
  mecanismo_causal: Region con densidad de puntos muy superior a rho, sesgando el
    volumen.
  activacion_trigger: Realizacion de Poisson con cluster local.
  sensor_sintoma: Conteo local >> rho*V esperado.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Re-muestrear; validar homogeneidad estadistica.
- id: PRIM-EST-008
  primitiva: Subdensidad de Sprinkling (Sprinkling Void)
  mecanismo_causal: Vacio de puntos que finge una region sin eventos causales.
  activacion_trigger: Fluctuacion negativa de Poisson.
  sensor_sintoma: Celda con N=0 donde rho*V>1.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Aumentar ensemble; promediar realizaciones.
- id: PRIM-EST-009
  primitiva: Ruptura de Lorentz por Reticula (Lattice Lorentz Breaking)
  mecanismo_causal: Uso implicito de reticula regular que fija un frame preferido.
  activacion_trigger: Discretizacion periodica del espacio-tiempo.
  sensor_sintoma: Anisotropia direccional en conteos de intervalos.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Sustituir reticula por sprinkling de Poisson.
- id: PRIM-EST-010
  primitiva: Cadena Infinita No Acotada (Unbounded Chain)
  mecanismo_causal: Existe una cadena descendente sin minimo, negando el pasado finito.
  activacion_trigger: Falta de elemento minimal en un ramal.
  sensor_sintoma: Test de local finiteness no termina.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Imponer pasado finito; truncar en frontera inicial.
- id: PRIM-EST-011
  primitiva: Explosion de Anticadena (Antichain Explosion)
  mecanismo_causal: Un 'momento de tiempo' contiene demasiados eventos espacialoides.
  activacion_trigger: Foliacion con rebanada demasiado gruesa.
  sensor_sintoma: Ancho (Dilworth) crece sin cota.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Refinar foliacion; acotar grosor del presente.
- id: PRIM-EST-012
  primitiva: Perdida de Local Finiteness (Local Finiteness Loss)
  mecanismo_causal: El intervalo [x,y] contiene cardinalidad infinita, rompiendo la
    discretez.
  activacion_trigger: Densidad divergente entre dos eventos.
  sensor_sintoma: card[x,y] no acotado.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Rechazar region; reimponer rho finito.
- id: PRIM-EST-013
  primitiva: Fallo Volumen-Numero (Volume-Number Mismatch)
  mecanismo_causal: Se rompe la proporcion N ~ rho*V que ancla el volumen al conteo.
  activacion_trigger: Sprinkling no uniforme o rho mal calibrado.
  sensor_sintoma: Regresion N vs V con residuo alto.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Recalibrar rho; reasertar correspondencia.
- id: PRIM-EST-014
  primitiva: Corrupcion del Diagrama de Hasse (Hasse Corruption)
  mecanismo_causal: La reduccion transitiva incluye enlaces redundantes o pierde coberturas.
  activacion_trigger: Reduccion transitiva mal computada.
  sensor_sintoma: Enlace presente con camino alternativo mayor.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Recomputar reduccion transitiva canonica.
- id: PRIM-EST-015
  primitiva: Enlace Fantasma (Phantom Link)
  mecanismo_causal: Existe relacion sin enlace de cobertura que la soporte.
  activacion_trigger: Insercion de arista larga sin intermediarios.
  sensor_sintoma: Relacion sin testigo de camino minimal.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reconstruir enlaces desde el orden.
- id: PRIM-EST-016
  primitiva: Falta de Enlace de Cobertura (Missing Cover)
  mecanismo_causal: Dos eventos consecutivos carecen del link de cobertura esperado.
  activacion_trigger: Poda excesiva de aristas.
  sensor_sintoma: Intervalo de longitud 1 vacio sin link.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Restaurar link de cobertura minimal.
- id: PRIM-EST-017
  primitiva: Deriva del Cono de Luz (Light-Cone Tilt)
  mecanismo_causal: El cono de luz local se inclina, sesgando quien puede causar a
    quien.
  activacion_trigger: Curvatura mal representada o frame arrastrado.
  sensor_sintoma: Asimetria pasado/futuro por evento.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Reanclar cono nulo a la estructura conforme.
- id: PRIM-EST-018
  primitiva: Degeneracion del Cono Nulo (Null Cone Degeneration)
  mecanismo_causal: El cono nulo colapsa y la separacion nula deja de discriminar.
  activacion_trigger: Signatura al borde de degenerar.
  sensor_sintoma: Distancia nula indistinguible de temporaloide.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Regularizar metrica; restaurar signatura Lorentz.
- id: PRIM-EST-019
  primitiva: Inversion de Signatura Metrica (Signature Flip)
  mecanismo_causal: La metrica pasa de Lorentziana (-+++) a Euclidea, matando la causalidad.
  activacion_trigger: Continuacion de Wick indebida en region fisica.
  sensor_sintoma: Autovalor temporal cambia de signo.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Rotacion inversa; fijar signatura fisica.
- id: PRIM-EST-020
  primitiva: Fractura de Orden Causal (Causal Order Fracture)
  mecanismo_causal: El orden parcial se fragmenta en relaciones inconsistentes.
  activacion_trigger: Mutaciones concurrentes sin arbitro BFT.
  sensor_sintoma: Matriz causal no es poset valido.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reconstruir poset desde log append-only.
- id: PRIM-EST-021
  primitiva: Ambiguedad Pasado/Futuro (Time-Orientation Loss)
  mecanismo_causal: Se pierde la orientacion temporal global; futuro y pasado se confunden.
  activacion_trigger: Falta de campo de tiempo coherente.
  sensor_sintoma: Cono sin etiqueta de orientacion.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Fijar orientacion temporal global.
- id: PRIM-EST-022
  primitiva: No Orientabilidad Temporal (Non-Time-Orientability)
  mecanismo_causal: La variedad subyacente no admite orientacion temporal continua.
  activacion_trigger: Topologia con banda de Mobius temporal.
  sensor_sintoma: Transporte de cono invierte el futuro.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Rechazar topologia; exigir orientabilidad.
- id: PRIM-EST-023
  primitiva: Colapso del Diamante Causal (Causal Diamond Collapse)
  mecanismo_causal: El intervalo de Alexandrov [x,y] se vacia pese a x<y.
  activacion_trigger: Densidad local nula entre dos eventos.
  sensor_sintoma: card(I(x,y))=0 con x<y verdadero.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reponer densidad; validar diamante no vacio.
- id: PRIM-EST-024
  primitiva: Explosion del Diamante Causal (Causal Diamond Blow-up)
  mecanismo_causal: El intervalo de Alexandrov crece sin cota util para la localidad.
  activacion_trigger: Sobredensidad dentro del diamante.
  sensor_sintoma: Cardinalidad de intervalo fuera de escala.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Coarse-grain controlado del intervalo.
- id: PRIM-EST-025
  primitiva: Fallo de Limite Continuo (Continuum Limit Failure)
  mecanismo_causal: No existe coarse-graining que aproxime una variedad suave.
  activacion_trigger: Causet tipico de Kleitman-Rothschild.
  sensor_sintoma: Sin variedad al aumentar rho.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Restringir al sub-ensemble manifoldlike.
- id: PRIM-EST-026
  primitiva: Rugosidad de Coarse-Graining (Coarse-Graining Roughness)
  mecanismo_causal: El decimado introduce enlaces espurios que deforman la geometria.
  activacion_trigger: Decimado uniforme ciego.
  sensor_sintoma: Curvatura discreta con ruido tras decimar.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Decimado por sprinkling secundario, no uniforme.
- id: PRIM-EST-027
  primitiva: Divergencia de la Accion BD (Benincasa-Dowker Blow-up)
  mecanismo_causal: La accion causal discreta diverge por falta de amortiguacion no
    local.
  activacion_trigger: Uso de accion BD sin suavizado mesoescala.
  sensor_sintoma: Fluctuaciones de accion ~ sqrt(N) dominan.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Introducir escala de suavizado no local.
- id: PRIM-EST-028
  primitiva: Ruido de Curvatura Discreta (Discrete Curvature Noise)
  mecanismo_causal: El d'Alembertiano discreto arroja curvatura fluctuante sin senal.
  activacion_trigger: Conteo de intervalos pequenos sin promediar.
  sensor_sintoma: Ricci discreto oscila sin media estable.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Promediar sobre mesoescala; ensemble.
- id: PRIM-EST-029
  primitiva: No-localidad Patologica (Pathological Non-locality)
  mecanismo_causal: El operador causal acopla eventos arbitrariamente lejanos.
  activacion_trigger: Kernel BD sin corte de rango.
  sensor_sintoma: Contribuciones no locales dominan la suma.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Amortiguar cola no local (epsilon-smearing).
- id: PRIM-EST-030
  primitiva: Inestabilidad del d'Alembertiano (Discrete d'Alembertian Instability)
  mecanismo_causal: El operador de onda discreto no converge a su limite continuo.
  activacion_trigger: Coeficientes de capas mal calibrados.
  sensor_sintoma: Propagador discreto diverge de retardado.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Recalibrar pesos por capa causal.
- id: PRIM-EST-031
  primitiva: Deriva de la Escala de Planck (Planck-Scale Drift)
  mecanismo_causal: La escala de discretez fundamental deriva entre regiones.
  activacion_trigger: rho no constante en el sprinkling.
  sensor_sintoma: Longitud minima varia espacialmente.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Fijar rho como invariante global.
- id: PRIM-EST-032
  primitiva: Fractura de la Espuma (Spacetime Foam Tearing)
  mecanismo_causal: La espuma espacio-temporal se desgarra en la microescala.
  activacion_trigger: Fluctuaciones topologicas descontroladas.
  sensor_sintoma: Genus local inestable.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Regularizar topologia a escala de Planck.
- id: PRIM-EST-033
  primitiva: Percolacion Causal Prematura (Premature Causal Percolation)
  mecanismo_causal: El orden causal percola conectando todo prematuramente.
  activacion_trigger: Densidad de relaciones sobre umbral critico.
  sensor_sintoma: Componente causal gigante emerge pronto.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Reducir fraccion de relaciones bajo umbral.
- id: PRIM-EST-034
  primitiva: Aislamiento de Nodo Causal (Causal Node Isolation)
  mecanismo_causal: Un evento queda con pasado y futuro vacios (desconectado).
  activacion_trigger: Sprinkling en region sin vecinos causales.
  sensor_sintoma: Evento con grado causal 0.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Reconectar o purgar nodo huerfano.
- id: PRIM-EST-035
  primitiva: Proliferacion de Nodos Huerfanos (Orphan Element Proliferation)
  mecanismo_causal: Exceso de elementos maximales/minimales sin linaje.
  activacion_trigger: Fragmentacion del poset.
  sensor_sintoma: Muchos maximales/minimales aislados.
  escala_temporal: Retrasada
  gravedad: C4
  intervencion: Consolidar linaje; anclar a frontera.
- id: PRIM-EST-036
  primitiva: Bifurcacion de Genesis (Genesis Bifurcation)
  mecanismo_causal: Multiples anticadenas minimales compiten como origen.
  activacion_trigger: Varios 'Big Bang' minimales concurrentes.
  sensor_sintoma: '>1 anticadena minimal sin ancestro.'
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Unificar origen; anticadena minimal unica.
- id: PRIM-EST-037
  primitiva: Fallo de Crecimiento Secuencial (Sequential Growth Failure)
  mecanismo_causal: La probabilidad de transicion de Rideout-Sorkin queda mal definida.
  activacion_trigger: Pesos de transicion no normalizados.
  sensor_sintoma: Suma de transiciones distinta de 1.
  escala_temporal: Progresiva
  gravedad: C4
  intervencion: Renormalizar probabilidades de nacimiento.
- id: PRIM-EST-038
  primitiva: Violacion de Covarianza Discreta (Discrete Covariance Violation)
  mecanismo_causal: La fisica depende del etiquetado (orden de nacimiento).
  activacion_trigger: Observables leen labels en vez de estructura.
  sensor_sintoma: Resultado cambia al reetiquetar.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Marginalizar sobre extensiones lineales.
- id: PRIM-EST-039
  primitiva: Ruptura de Bell Causality (Bell Causality Breach)
  mecanismo_causal: El crecimiento acopla probabilidades de eventos espacialoides.
  activacion_trigger: Transicion depende de region no ancestral.
  sensor_sintoma: Correlacion espacialoide en growth.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Imponer condicion de Bell en transiciones.
- id: PRIM-EST-040
  primitiva: Fallo de Covarianza General (General Covariance Failure)
  mecanismo_causal: No hay analogo discreto de invariancia difeomorfica.
  activacion_trigger: Observables no invariantes de orden.
  sensor_sintoma: Dependencia de coordenada residual.
  escala_temporal: Estatica
  gravedad: C3
  intervencion: Definir observables invariantes de labeling.
- id: PRIM-EST-041
  primitiva: Dominancia de Kleitman-Rothschild (KR Order Dominance)
  mecanismo_causal: El ensemble se domina por posets de 3 capas no fisicos.
  activacion_trigger: Medida uniforme sobre posets.
  sensor_sintoma: Fraccion KR -> 1 al crecer N.
  escala_temporal: Retrasada
  gravedad: C3
  intervencion: Sesgar medida hacia manifoldlike.
- id: PRIM-EST-042
  primitiva: Colapso a Tres Capas (Three-Layer Collapse)
  mecanismo_causal: El causet colapsa a la estructura tripartita de KR.
  activacion_trigger: Ausencia de sesgo dinamico.
  sensor_sintoma: Altura del poset = 3.
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Dinamica que favorezca cadenas largas.
- id: PRIM-EST-043
  primitiva: Pinch por Post Causal (Causal Post Pinch)
  mecanismo_causal: Un unico elemento por el que pasa todo el orden (cuello de botella).
  activacion_trigger: Region que estrangula el flujo causal.
  sensor_sintoma: Elemento con pasado y futuro totales.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Aliviar cuello; validar seccion transversal.
- id: PRIM-EST-044
  primitiva: Pinch Topologico (Topological Pinch)
  mecanismo_causal: La geometria se estrangula a un punto, degenerando el volumen.
  activacion_trigger: Colapso local de la seccion espacial.
  sensor_sintoma: Volumen de rebanada -> 0.
  escala_temporal: Progresiva
  gravedad: C5
  intervencion: Regularizar seccion; evitar degeneracion.
- id: PRIM-EST-045
  primitiva: Fractura de Conectividad Causal (Causal Connectivity Fracture)
  mecanismo_causal: El poset se parte en componentes causalmente disjuntos.
  activacion_trigger: Perdida de relaciones puente.
  sensor_sintoma: '>1 componente causal.'
  escala_temporal: Inmediata
  gravedad: C5
  intervencion: Reconstruir puentes o declarar multiverso controlado.
- id: PRIM-EST-046
  primitiva: Isla Causal (Causal Island)
  mecanismo_causal: Sub-causet aislado sin relacion con el resto del universo.
