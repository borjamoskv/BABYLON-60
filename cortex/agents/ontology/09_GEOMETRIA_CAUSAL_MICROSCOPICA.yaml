- id: INV-GCM-001
  invariante: Invarianza de Lorentz Local
  logica___principio: El sprinkling de Poisson es el unico proceso que no distingue
    un frame; la discretez no crea frame preferido.
  implicacion_operacional: Prohibida toda reticula regular; solo muestreo aleatorio
    de Poisson.
  condicion_de_borde: Reticula periodica en uso.
  metrica_falsable: Anisotropia direccional de intervalos = 0.
- id: INV-GCM-002
  invariante: Conservacion del Orden Causal
  logica___principio: La relacion de precedencia < es la estructura fundamental y
    no puede alterarse retroactivamente.
  implicacion_operacional: Toda mutacion solo anade al futuro; el pasado es inmutable.
  condicion_de_borde: Reescritura del orden pasado.
  metrica_falsable: Hash del pasado en t0 == en t1.
- id: INV-GCM-003
  invariante: Acyclicidad (DAG)
  logica___principio: No existen bucles causales; el causet es un grafo aciclico dirigido.
  implicacion_operacional: Prohibidas las CTC; toda arista va de pasado a futuro.
  condicion_de_borde: Ciclo detectado.
  metrica_falsable: Numero de ciclos == 0.
- id: INV-GCM-004
  invariante: Antisimetria del Orden
  logica___principio: Si a<b entonces nunca b<a.
  implicacion_operacional: El arbitro de orden rechaza pares simetricos.
  condicion_de_borde: Par simetrico presente.
  metrica_falsable: Pares (a,b) con ambos sentidos == 0.
- id: INV-GCM-005
  invariante: Transitividad
  logica___principio: Si a<b y b<c entonces a<c, de forma absoluta.
  implicacion_operacional: El cierre transitivo se mantiene idempotente.
  condicion_de_borde: Aserto transitivo falla.
  metrica_falsable: Violaciones de transitividad == 0.
- id: INV-GCM-006
  invariante: Irreflexividad
  logica___principio: Ningun evento se precede a si mismo.
  implicacion_operacional: La diagonal de la matriz causal es nula.
  condicion_de_borde: e<e detectado.
  metrica_falsable: Traza de la matriz causal == 0.
- id: INV-GCM-007
  invariante: Local Finiteness
  logica___principio: Todo intervalo [x,y] contiene un numero finito de elementos.
  implicacion_operacional: La discretez es fundamental, no aproximada.
  condicion_de_borde: card[x,y] infinito.
  metrica_falsable: Cardinalidad de intervalo < infinito siempre.
- id: INV-GCM-008
  invariante: Correspondencia Volumen-Numero
  logica___principio: 'El numero de elementos equivale al volumen espacio-temporal:
    N ~ rho*V.'
  implicacion_operacional: El conteo ancla el volumen; no se postula metrica aparte.
  condicion_de_borde: N/V != rho.
  metrica_falsable: Regresion N vs V con pendiente rho.
- id: INV-GCM-009
  invariante: Covarianza General Discreta
  logica___principio: La fisica no depende del etiquetado de los elementos.
  implicacion_operacional: Observables invariantes bajo reetiquetado.
  condicion_de_borde: Resultado cambia al reetiquetar.
  metrica_falsable: Delta de observable bajo relabel == 0.
- id: INV-GCM-010
  invariante: Conservacion de rho
  logica___principio: La densidad fundamental de Planck es una constante universal.
  implicacion_operacional: rho fijo en todo el sprinkling.
  condicion_de_borde: rho local varia.
  metrica_falsable: Varianza de rho entre regiones == 0.
- id: INV-GCM-011
  invariante: Invarianza de la Escala de Planck
  logica___principio: Existe una longitud minima invariante l_P = rho^(-1/4).
  implicacion_operacional: Ninguna estructura por debajo de l_P.
  condicion_de_borde: Estructura sub-Planck.
  metrica_falsable: Escala minima observada = l_P.
- id: INV-GCM-012
  invariante: Orientacion Temporal
  logica___principio: Existe una asignacion global continua de futuro y pasado.
  implicacion_operacional: Cada cono lleva etiqueta de orientacion coherente.
  condicion_de_borde: Cono sin orientacion.
  metrica_falsable: Campo de orientacion continuo verificado.
- id: INV-GCM-013
  invariante: Distincion Pasado/Futuro
  logica___principio: Los conjuntos pasado y futuro de un evento son disjuntos.
  implicacion_operacional: Past(e) ∩ Future(e) = vacio siempre.
  condicion_de_borde: Solape pasado/futuro.
  metrica_falsable: Interseccion pasado/futuro == vacio.
- id: INV-GCM-014
  invariante: Estructura Conforme del Orden
  logica___principio: El orden causal determina la metrica hasta un factor conforme
    (Malament).
  implicacion_operacional: La geometria conforme se lee del orden.
  condicion_de_borde: Orden incompleto.
  metrica_falsable: Metrica conforme reconstruida consistente.
- id: INV-GCM-015
  invariante: Numero Fija el Volumen
  logica___principio: El conteo N fija el factor conforme que el orden deja libre.
  implicacion_operacional: orden + numero = geometria completa.
  condicion_de_borde: Numero ausente.
  metrica_falsable: Factor conforme determinado por N.
- id: INV-GCM-016
  invariante: Signatura Lorentziana
  logica___principio: La metrica es Lorentziana (-+++), no Euclidea.
  implicacion_operacional: Prohibida continuacion de Wick en region fisica.
  condicion_de_borde: Signatura Euclidea.
  metrica_falsable: Un autovalor temporal negativo.
- id: INV-GCM-017
  invariante: Estructura de Cono de Luz
  logica___principio: Cada evento posee cono de luz que separa causal de espacial.
  implicacion_operacional: La separacion causal se define por el cono.
  condicion_de_borde: Cono degenerado.
  metrica_falsable: Clasificacion causal/espacial bien definida.
- id: INV-GCM-018
  invariante: Hiperbolicidad Global
  logica___principio: Existe una superficie de Cauchy; el sistema es predictible.
  implicacion_operacional: Toda region tiene rebanada de Cauchy.
  condicion_de_borde: CTC o frontera interna.
  metrica_falsable: Existe superficie de Cauchy.
- id: INV-GCM-019
  invariante: Invarianza de la Accion BD bajo Relabel
  logica___principio: La accion de Benincasa-Dowker es invariante de etiquetado.
  implicacion_operacional: S_BD funcion solo del orden y numero.
  condicion_de_borde: S depende de labels.
  metrica_falsable: Delta S bajo relabel == 0.
- id: INV-GCM-020
  invariante: Curvatura Escalar Discreta Media
  logica___principio: La media de la curvatura discreta converge a la escalar continua.
  implicacion_operacional: Coarse-grain recupera Ricci continuo.
  condicion_de_borde: Media de curvatura deriva.
  metrica_falsable: <R_discreto> -> R_continuo.
- id: INV-GCM-021
  invariante: Invarianza del Estimador de Dimension
  logica___principio: La dimension de Myrheim-Meyer es un invariante estadistico del
    orden.
  implicacion_operacional: Dimension leida de la fraccion de relaciones.
  condicion_de_borde: r fuera de rango.
  metrica_falsable: d estimada estable en ensemble.
- id: INV-GCM-022
  invariante: Conservacion del Ordering Fraction
  logica___principio: La fraccion de pares relacionados codifica la dimension.
  implicacion_operacional: r es funcion monotona de la dimension.
  condicion_de_borde: r inconsistente.
  metrica_falsable: r reproduce d conocido.
- id: INV-GCM-023
  invariante: Cadena Maximal ~ Tiempo Propio
  logica___principio: La longitud de la cadena mas larga estima el tiempo propio.
  implicacion_operacional: Geodesica temporaloide = cadena maxima.
  condicion_de_borde: Constante de proporcion deriva.
  metrica_falsable: Longitud de cadena / tiempo propio estable.
- id: INV-GCM-024
  invariante: Abundancia de Intervalos
  logica___principio: La distribucion de tamanos de intervalo es un invariante geometrico.
  implicacion_operacional: n_k codifica dimension y curvatura.
  condicion_de_borde: n_k desplazado.
  metrica_falsable: Histograma n_k reproduce continuum.
- id: INV-GCM-025
  invariante: Invarianza de Poisson bajo Isometria
  logica___principio: El proceso de sprinkling es invariante bajo isometrias del continuo.
  implicacion_operacional: La estadistica no cambia bajo el grupo de isometrias.
  condicion_de_borde: Sprinkling anisotropo.
  metrica_falsable: Estadistica invariante bajo isometria.
- id: INV-GCM-026
  invariante: Independencia Estadistica del Sprinkling
  logica___principio: Los puntos se rocian de forma independiente (proceso de Poisson).
  implicacion_operacional: Sin correlaciones entre puntos.
  condicion_de_borde: Correlacion de puntos != 0.
  metrica_falsable: Funcion de correlacion de 2 puntos == 0.
- id: INV-GCM-027
  invariante: Numero Medio en Volumen
  logica___principio: El numero esperado de elementos es rho*V.
  implicacion_operacional: El volumen se mide contando.
  condicion_de_borde: <N> != rho*V.
  metrica_falsable: <N> = rho*V verificado.
- id: INV-GCM-028
  invariante: Fluctuacion de Poisson sqrt(N)
  logica___principio: La varianza del conteo iguala la media (Poisson).
  implicacion_operacional: N se trata como estadistico, no exacto.
  condicion_de_borde: Var(N) != <N>.
  metrica_falsable: Var(N)/<N> = 1.
- id: INV-GCM-029
  invariante: Idempotencia del Cierre Transitivo
  logica___principio: Aplicar el cierre transitivo dos veces no cambia el orden.
  implicacion_operacional: closure(closure(P)) = closure(P).
  condicion_de_borde: Closure no idempotente.
  metrica_falsable: Delta de segundo closure == 0.
- id: INV-GCM-030
  invariante: Idempotencia de la Reduccion Transitiva
  logica___principio: La reduccion transitiva (Hasse) es unica e idempotente.
  implicacion_operacional: El diagrama de Hasse es canonico.
  condicion_de_borde: Reduccion no unica.
  metrica_falsable: Reduccion estable y unica.
- id: INV-GCM-031
  invariante: Unicidad del Enlace de Cobertura
  logica___principio: La relacion de cobertura esta determinada por el orden.
  implicacion_operacional: Los links se derivan, no se postulan.
  condicion_de_borde: Cobertura ambigua.
  metrica_falsable: Links reconstruidos == links dados.
- id: INV-GCM-032
  invariante: Invarianza de Minimales/Maximales
  logica___principio: El conjunto de elementos minimales y maximales es invariante
    de isometria.
  implicacion_operacional: Frontera inicial/final bien definida.
  condicion_de_borde: Minimales inconsistentes.
  metrica_falsable: Conteo de minimales invariante.
- id: INV-GCM-033
  invariante: Bell Causality en Growth
  logica___principio: El crecimiento no acopla probabilidades de eventos espacialoides.
  implicacion_operacional: Transiciones respetan la estructura causal.
  condicion_de_borde: Correlacion espacialoide.
  metrica_falsable: Correlacion de Bell == 0.
- id: INV-GCM-034
  invariante: Covarianza General en Sequential Growth
  logica___principio: El orden de nacimiento (label) no afecta la fisica.
  implicacion_operacional: 'Rideout-Sorkin: covarianza de etiquetado.'
  condicion_de_borde: Fisica depende de nacimiento.
  metrica_falsable: Observable invariante de orden de nacimiento.
- id: INV-GCM-035
  invariante: Normalizacion de Transiciones
  logica___principio: Las probabilidades de nacimiento suman 1.
  implicacion_operacional: La dinamica de growth es una medida de probabilidad.
  condicion_de_borde: Suma != 1.
  metrica_falsable: Suma de transiciones == 1.
- id: INV-GCM-036
  invariante: Markov de Crecimiento
  logica___principio: La transicion depende solo del estado presente, no de la historia.
  implicacion_operacional: Growth sin memoria.
  condicion_de_borde: Memoria en el proceso.
  metrica_falsable: Dependencia de historia lejana == 0.
- id: INV-GCM-037
  invariante: Lambda Everpresent ~ 1/sqrt(V)
  logica___principio: La constante cosmologica fluctua como +/-1/sqrt(V) (Sorkin).
  implicacion_operacional: Lambda emerge del conteo, no se ajusta a mano.
  condicion_de_borde: Lambda fuera de 1/sqrt(V).
  metrica_falsable: abs(Lambda) ~ 1/sqrt(V).
- id: INV-GCM-038
  invariante: Conservacion de la Fluctuacion de Lambda
  logica___principio: La fluctuacion de Lambda se hereda de la de N.
  implicacion_operacional: sqrt(N) se propaga a Lambda.
  condicion_de_borde: Varianza de Lambda erronea.
  metrica_falsable: Var(Lambda) consistente con Var(N).
- id: INV-GCM-039
  invariante: Ley de Area de Entropia
  logica___principio: La entropia de horizonte escala con el area, no el volumen.
  implicacion_operacional: S = A/4 en unidades de Planck.
  condicion_de_borde: S ~ volumen.
  metrica_falsable: Ajuste S vs A lineal.
- id: INV-GCM-040
  invariante: Conservacion de Moleculas de Horizonte
  logica___principio: El numero de moleculas de horizonte es proporcional al area.
  implicacion_operacional: Contar moleculas mide entropia.
  condicion_de_borde: Conteo no lineal en A.
  metrica_falsable: N_moleculas proporcional a A.
- id: INV-GCM-041
  invariante: Ley de Area de Enredo
  logica___principio: La entropia de enredo obedece ley de area con corte causal.
  implicacion_operacional: El corte causal regulariza el enredo.
  condicion_de_borde: S ~ volumen.
  metrica_falsable: S_enredo ~ A.
- id: INV-GCM-042
  invariante: Causalidad del Propagador
  logica___principio: El propagador discreto es retardado (solo hacia el futuro).
  implicacion_operacional: Sin senales hacia el pasado.
  condicion_de_borde: Componente avanzada != 0.
  metrica_falsable: Propagador avanzado == 0.
- id: INV-GCM-043
  invariante: Retardo del d'Alembertiano
  logica___principio: El operador de onda discreto respeta la causalidad.
  implicacion_operacional: B(x) suma solo sobre el pasado de x.
  condicion_de_borde: Contribucion futura.
  metrica_falsable: Soporte del operador en el pasado.
- id: INV-GCM-044
  invariante: Normalizacion de la Amplitud
  logica___principio: La suma sobre causets esta normalizada (unitaridad).
  implicacion_operacional: Probabilidades totales suman 1.
  condicion_de_borde: Norma != 1.
  metrica_falsable: norma(amplitud total) == 1.
- id: INV-GCM-045
  invariante: Invarianza de Fase bajo Relabel
  logica___principio: La fase exp(iS) es invariante de etiquetado.
  implicacion_operacional: S invariante -> fase invariante.
  condicion_de_borde: Fase depende de labels.
  metrica_falsable: Delta de fase bajo relabel == 0.
- id: INV-GCM-046
  invariante: Conservacion de la Medida sobre Causets
  logica___principio: La medida sobre el espacio de causets es covariante.
  implicacion_operacional: Sum-over-histories bien definida.
  condicion_de_borde: Medida dependiente de labeling.
  metrica_falsable: Medida invariante verificada.
- id: INV-GCM-047
  invariante: Invarianza de la Suma sobre Historias
  logica___principio: La funcion de particion no depende de la parametrizacion.
  implicacion_operacional: Z invariante bajo reetiquetado.
  condicion_de_borde: Z depende de labels.
  metrica_falsable: Delta Z bajo relabel == 0.
- id: INV-GCM-048
  invariante: Invarianza del Stem
  logica___principio: El pasado-conjunto (stem) determina univocamente al elemento.
  implicacion_operacional: Reconstruccion por stems inyectiva.
  condicion_de_borde: Stems degenerados.
  metrica_falsable: Stem -> elemento inyectivo.
- id: INV-GCM-049
  invariante: Teorema de Reconstruccion
  logica___principio: Orden mas numero reconstruyen la geometria (hasta isometria).
  implicacion_operacional: No se necesita informacion adicional.
  condicion_de_borde: Reconstruccion multivaluada.
  metrica_falsable: Geometria reconstruida unica.
- id: INV-GCM-050
  invariante: Manifoldlikeness (clase fisica)
  logica___principio: Solo los causets fielmente inmersibles son fisicos.
  implicacion_operacional: Se restringe el ensemble a manifoldlike.
  condicion_de_borde: Causet KR en ensemble fisico.
  metrica_falsable: Fraccion no-manifoldlike suprimida.
- id: INV-GCM-051
  invariante: Hauptvermutung
  logica___principio: Un causet se inmerge en a lo sumo una variedad, salvo isometria
    aproximada.
  implicacion_operacional: La variedad emergente es esencialmente unica.
  condicion_de_borde: Dos variedades no isometricas.
  metrica_falsable: Variedad de inmersion unica.
- id: INV-GCM-052
  invariante: Conservacion de la Topologia de Frontera
  logica___principio: La topologia de la frontera causal es invariante.
  implicacion_operacional: Frontera reconstruible desde el bulk.
  condicion_de_borde: Genus de frontera inconsistente.
  metrica_falsable: Topologia de frontera estable.
- id: INV-GCM-053
  invariante: Dimension Espectral IR
  logica___principio: La dimension espectral tiende a d en el IR.
  implicacion_operacional: El continuo emerge a gran escala.
  condicion_de_borde: d_s(IR) != d.
  metrica_falsable: d_s -> d en el IR.
- id: INV-GCM-054
  invariante: Reduccion a d=2 en UV
  logica___principio: La dimension espectral tiende a 2 en el UV.
  implicacion_operacional: Reduccion dimensional universal.
  condicion_de_borde: d_s(UV) != 2.
  metrica_falsable: d_s -> 2 en el UV.
- id: INV-GCM-055
  invariante: Conservacion de la Dimension de Hausdorff
  logica___principio: La dimension de Hausdorff es un invariante geometrico.
  implicacion_operacional: Auto-similaridad controlada.
  condicion_de_borde: d_H inestable.
  metrica_falsable: d_H estable en el continuo.
- id: INV-GCM-056
  invariante: Invarianza del Limite Continuo
  logica___principio: El limite rho -> infinito esta bien definido.
  implicacion_operacional: Coarse-grain converge a variedad.
  condicion_de_borde: Sin variedad limite.
  metrica_falsable: Convergencia a variedad verificada.
- id: INV-GCM-057
  invariante: Localidad Aproximada Acotada
  logica___principio: La no-localidad del causet esta acotada por una escala mesoescala.
  implicacion_operacional: El operador BD se suaviza a escala l >> l_P.
  condicion_de_borde: No-localidad divergente.
  metrica_falsable: Rango efectivo acotado.
- id: INV-GCM-058
  invariante: Coeficiente de Swerve Acotado
  logica___principio: La difusion de momento (swerve) esta acotada por rho.
  implicacion_operacional: El swerve es minusculo a escala macro.
  condicion_de_borde: Swerve macroscopico.
  metrica_falsable: Coeficiente de swerve ~ 1/rho.
- id: INV-GCM-059
  invariante: Swerve de Media Cero
  logica___principio: El swerve no sesga el momento medio.
  implicacion_operacional: Difusion sin deriva neta.
  condicion_de_borde: Deriva de momento != 0.
  metrica_falsable: <delta p> == 0.
- id: INV-GCM-060
  invariante: Ausencia de Foliacion Preferida
  logica___principio: No existe rebanado temporal privilegiado.
  implicacion_operacional: Toda foliacion es igualmente valida (covarianza).
  condicion_de_borde: Foliacion preferida en uso.
  metrica_falsable: Observables invariantes de foliacion.
- id: INV-GCM-061
  invariante: Ausencia de Frame Preferido
  logica___principio: Ningun sistema de referencia es privilegiado (Lorentz).
  implicacion_operacional: El sprinkling garantiza isotropia estadistica.
  condicion_de_borde: Frame preferido detectado.
  metrica_falsable: Isotropia estadistica verificada.
- id: INV-GCM-062
  invariante: Consistencia de la Cadena de Growth
  logica___principio: La cadena de Markov de crecimiento es consistente entre pasos.
  implicacion_operacional: Las transiciones componen coherentemente.
  condicion_de_borde: Inconsistencia entre pasos.
  metrica_falsable: Composicion de transiciones valida.
- id: INV-GCM-063
  invariante: Invarianza bajo Automorfismo
  logica___principio: El causet es invariante bajo su grupo de automorfismos.
  implicacion_operacional: Las simetrias preservan el orden.
  condicion_de_borde: Automorfismo rompe orden.
  metrica_falsable: Aut preserva la relacion <.
- id: INV-GCM-064
  invariante: Conservacion del Grupo de Simetria
  logica___principio: El grupo de simetria del causet es un invariante.
  implicacion_operacional: card(Aut) bien definido y estable.
  condicion_de_borde: card(Aut) inconsistente.
  metrica_falsable: Grupo de automorfismos estable.
- id: INV-GCM-065
  invariante: Equivalencia de Extensiones Lineales
  logica___principio: Toda extension lineal valida del poset es fisicamente equivalente.
  implicacion_operacional: Ninguna extension es preferida.
  condicion_de_borde: Resultado depende de extension.
  metrica_falsable: Invariancia sobre extensiones lineales.
- id: INV-GCM-066
  invariante: Independencia del Etiquetado Natural
  logica___principio: El etiquetado natural no aporta informacion fisica.
  implicacion_operacional: Solo la estructura de orden importa.
  condicion_de_borde: Dependencia de labeling.
  metrica_falsable: Delta bajo relabel natural == 0.
- id: INV-GCM-067
  invariante: Conservacion de Longitud de Cadena (Coarse)
  logica___principio: La longitud de cadena se conserva estadisticamente al decimar.
  implicacion_operacional: Coarse-grain preserva la altura relativa.
  condicion_de_borde: Altura no escala.
  metrica_falsable: Longitud de cadena escala con rho.
- id: INV-GCM-068
  invariante: Manifoldlikeness bajo Coarse-Grain
  logica___principio: El decimado preserva la clase manifoldlike (deseable).
  implicacion_operacional: El RG conserva la variedad emergente.
  condicion_de_borde: Coarse poset no-manifoldlike.
  metrica_falsable: Inmersion fiel tras decimar.
- id: INV-GCM-069
  invariante: Conservacion de la Distribucion de Intervalos
  logica___principio: La distribucion de cardinalidad de intervalos es invariante.
  implicacion_operacional: n_k caracteriza la geometria.
  condicion_de_borde: n_k deriva.
  metrica_falsable: Distribucion n_k estable.
- id: INV-GCM-070
  invariante: Relacion Pasado/Futuro Exclusivo
  logica___principio: Los conjuntos exclusivos de pasado y futuro particionan el causet.
  implicacion_operacional: Cada evento clasifica al resto.
  condicion_de_borde: Clasificacion incompleta.
  metrica_falsable: Particion pasado/futuro/espacial completa.
- id: INV-GCM-071
  invariante: Conservacion del Volumen del Presente
  logica___principio: El presente (anticadena engrosada) tiene volumen definido.
  implicacion_operacional: El 'ahora' tiene grosor fijo.
  condicion_de_borde: Presente sin volumen.
  metrica_falsable: Volumen de presente estable.
- id: INV-GCM-072
  invariante: Transitividad de la Descendencia
  logica___principio: La relacion de descendencia es transitiva.
  implicacion_operacional: Descendiente de descendiente es descendiente.
  condicion_de_borde: Descendencia no transitiva.
  metrica_falsable: Violaciones de descendencia == 0.
- id: INV-GCM-073
  invariante: Metrica hasta Factor Conforme (Orden)
  logica___principio: El orden fija la metrica salvo escala local.
  implicacion_operacional: La causalidad da 9/10 de la metrica.
  condicion_de_borde: Orden no fija conforme.
  metrica_falsable: Metrica conforme derivada del orden.
- id: INV-GCM-074
  invariante: Invarianza de la Distancia Causal
  logica___principio: La distancia causal (cadena maxima) es un invariante.
  implicacion_operacional: Metrica temporaloide bien definida.
  condicion_de_borde: Distancia inestable.
  metrica_falsable: Distancia causal reproducible.
- id: INV-GCM-075
  invariante: Clase Unica de Geodesica
  logica___principio: La geodesica discreta define una clase invariante de cadenas
    maximas.
  implicacion_operacional: El promedio de cadenas maximas es geodesico.
  condicion_de_borde: Clase multivaluada sin promedio.
  metrica_falsable: Cadena media converge a geodesica.
- id: INV-GCM-076
  invariante: Invarianza bajo Isomorfismo de Poset
  logica___principio: Dos causets isomorfos son fisicamente identicos.
  implicacion_operacional: Solo la clase de isomorfismo importa.
  condicion_de_borde: Fisica distingue isomorfos.
  metrica_falsable: Delta entre isomorfos == 0.
- id: INV-GCM-077
  invariante: Conservacion de la Cardinalidad N
  logica___principio: El numero total de elementos es un invariante del estado.
  implicacion_operacional: N no cambia salvo por growth.
  condicion_de_borde: N cambia sin nacimiento.
  metrica_falsable: N constante entre mutaciones.
- id: INV-GCM-078
  invariante: Fraccion de Relaciones -> Dimension
  logica___principio: La fraccion de relaciones determina la dimension del continuo.
  implicacion_operacional: r es el estimador primario de d.
  condicion_de_borde: r inconsistente con d.
  metrica_falsable: r(d) reproduce dimension.
- id: INV-GCM-079
  invariante: Ancho de Anticadena (Dilworth)
  logica___principio: El ancho maximo de anticadena es un invariante del poset.
  implicacion_operacional: 'Dilworth: ancho = min cobertura por cadenas.'
  condicion_de_borde: Ancho inconsistente.
  metrica_falsable: Ancho = min chain cover.
- id: INV-GCM-080
  invariante: Altura = Cadena Maxima (Mirsky)
  logica___principio: La altura del poset iguala la longitud de la cadena maxima.
  implicacion_operacional: 'Mirsky: altura = min cobertura por anticadenas.'
  condicion_de_borde: Altura inconsistente.
  metrica_falsable: Altura = min antichain cover.
- id: INV-GCM-081
  invariante: Aditividad del Volumen
  logica___principio: El volumen de regiones disjuntas es aditivo (conteo).
  implicacion_operacional: N(A U B) = N(A)+N(B) para disjuntos.
  condicion_de_borde: No aditividad.
  metrica_falsable: Conteo aditivo verificado.
- id: INV-GCM-082
  invariante: Invarianza de Poisson bajo Union Disjunta
  logica___principio: El sprinkling en regiones disjuntas es independiente.
  implicacion_operacional: Conteos disjuntos independientes.
  condicion_de_borde: Correlacion entre regiones.
  metrica_falsable: Covarianza entre disjuntos == 0.
- id: INV-GCM-083
  invariante: Causalidad Retardada del Campo
  logica___principio: Los campos sobre el causet se propagan solo al futuro.
  implicacion_operacional: Ecuaciones de campo retardadas.
  condicion_de_borde: Propagacion al pasado.
  metrica_falsable: Solucion avanzada == 0.
- id: INV-GCM-084
  invariante: Unitaridad del Causet Cuantico
  logica___principio: La evolucion cuantica del causet conserva la probabilidad.
  implicacion_operacional: Amplitudes normalizadas.
  condicion_de_borde: Norma no conservada.
  metrica_falsable: Norma cuantica constante.
- id: INV-GCM-085
  invariante: Monotonia del Pasado en Growth
  logica___principio: El pasado de un elemento nunca decrece durante el crecimiento.
  implicacion_operacional: El pasado solo crece.
  condicion_de_borde: Pasado decrece.
  metrica_falsable: card(Past(e)) monotono no decreciente.
- id: INV-GCM-086
  invariante: Acyclicidad bajo Growth
  logica___principio: Cada nacimiento se anade al futuro, preservando la acyclicidad.
  implicacion_operacional: El nuevo elemento no precede a los viejos.
  condicion_de_borde: Nacimiento hacia el pasado.
  metrica_falsable: Ciclos tras nacimiento == 0.
- id: INV-GCM-087
  invariante: Invarianza de Temporalidad Interna
  logica___principio: La nocion de 'antes/despues' interna es intrinseca al orden.
  implicacion_operacional: No se necesita reloj externo.
  condicion_de_borde: Temporalidad ambigua.
  metrica_falsable: Orden interno bien definido.
- id: INV-GCM-088
  invariante: Accion Discreta Media bajo Coarse-Grain
  logica___principio: La media de la accion discreta se conserva al decimar.
  implicacion_operacional: El RG preserva la accion efectiva.
  condicion_de_borde: Accion media deriva.
  metrica_falsable: <S> estable bajo coarse-grain.
- id: INV-GCM-089
  invariante: Correspondencia Orden-Metrica Conforme
  logica___principio: El orden causal codifica exactamente la clase conforme de la
    metrica.
  implicacion_operacional: Causalidad determina angulos, no escalas.
  condicion_de_borde: Orden no da conforme.
  metrica_falsable: Clase conforme reconstruida.
- id: INV-GCM-090
  invariante: Invarianza Causal bajo Difeomorfismo
  logica___principio: En el continuo, la estructura causal es invariante difeomorfica.
  implicacion_operacional: Los difeos preservan conos de luz.
  condicion_de_borde: Difeo altera causalidad.
  metrica_falsable: Conos de luz invariantes bajo difeo.
- id: INV-GCM-091
  invariante: Teorema de Malament
  logica___principio: Un isomorfismo causal implica una isometria conforme.
  implicacion_operacional: La causalidad fija la geometria conforme.
  condicion_de_borde: Iso causal sin iso conforme.
  metrica_falsable: Malament verificado localmente.
- id: INV-GCM-092
  invariante: Estructura Causal = 9/10 de la Metrica
  logica___principio: La estructura causal determina la metrica salvo el factor de
    volumen.
  implicacion_operacional: Falta solo el elemento de volumen (numero).
  condicion_de_borde: Metrica indeterminada con orden.
  metrica_falsable: Solo 1 grado (conforme) libre.
- id: INV-GCM-093
  invariante: Reconstruccion Metrica Completa
  logica___principio: Estructura causal + elemento de volumen = metrica completa.
  implicacion_operacional: orden (conforme) + numero (volumen) = g.
  condicion_de_borde: Reconstruccion incompleta.
  metrica_falsable: Metrica g reconstruida unica.
- id: INV-GCM-094
  invariante: Conservacion de la Poisson bajo Refinamiento
  logica___principio: Subdividir la region no altera la naturaleza Poisson.
  implicacion_operacional: El proceso es consistente a toda escala.
  condicion_de_borde: Refinamiento rompe Poisson.
  metrica_falsable: Poisson estable bajo refinamiento.
- id: INV-GCM-095
  invariante: Invarianza de la Densidad Espectral de Cadenas
  logica___principio: La distribucion de longitudes de cadena es un invariante.
  implicacion_operacional: Codifica dimension y curvatura.
  condicion_de_borde: Distribucion deriva.
  metrica_falsable: Espectro de cadenas estable.
- id: INV-GCM-096
  invariante: Conservacion de la Relacion de Enlace
  logica___principio: La densidad de enlaces por elemento es un invariante dimensional.
  implicacion_operacional: Grado de link codifica dimension.
  condicion_de_borde: Grado inconsistente.
  metrica_falsable: Grado medio de link estable.
- id: INV-GCM-097
  invariante: Invarianza del Numero de Ordenamiento
  logica___principio: La probabilidad de que dos elementos esten relacionados es invariante.
  implicacion_operacional: P(a<b) fija por la dimension.
  condicion_de_borde: P(a<b) deriva.
  metrica_falsable: Ordering fraction invariante.
- id: INV-GCM-098
  invariante: Conservacion de la Estructura de Poset bajo Growth
  logica___principio: Las relaciones ya establecidas persisten durante el crecimiento.
  implicacion_operacional: El growth solo anade, nunca borra relaciones.
  condicion_de_borde: Relacion borrada en growth.
  metrica_falsable: Relaciones preexistentes intactas.
- id: INV-GCM-099
  invariante: Principio de Causa Comun (Reichenbach)
  logica___principio: Toda correlacion entre eventos espacialoides se explica por
    una causa comun en su pasado conjunto.
  implicacion_operacional: No hay correlaciones sin ancestro causal comun.
  condicion_de_borde: Correlacion sin pasado comun.
  metrica_falsable: Correlacion trazable a J^-(a) interseccion J^-(b).
- id: INV-GCM-100
  invariante: Invarianza Fundamental Causet-Continuo
  logica___principio: La geometria del continuo emerge de las relaciones causales
    discretas mas el conteo.
  implicacion_operacional: Order + Number = Geometry (axioma nuclear).
  condicion_de_borde: Emergencia fallida.
  metrica_falsable: Continuo emergente reproducible.
- id: ANTI-GCM-001
  antipatron: Reticula Regular
  disfuncion_causal: Discretizar en una reticula periodica introduce ejes preferidos
    y destruye la invarianza de Lorentz.
  senal_de_presencia: Uso de grid cubico, hipercubico o triangulacion regular como
    'espacio-tiempo'.
  impacto_en_robustez: Rompe INV Lorentz; anisotropia observable en todo estimador.
  refactor_alternativa: Sprinkling de Poisson aleatorio; la aleatoriedad es la que
    salva Lorentz.
- id: ANTI-GCM-002
  antipatron: Coordenadas Preferidas
  disfuncion_causal: Anclar el modelo a un sistema de coordenadas concreto reintroduce
    un frame absoluto.
  senal_de_presencia: Observables que dependen de x,t elegidos en vez del orden.
  impacto_en_robustez: Falso frame; predicciones no covariantes.
  refactor_alternativa: Formular todo en terminos del orden < y el conteo N.
- id: ANTI-GCM-003
  antipatron: Tiempo Global Absoluto
  disfuncion_causal: Asumir un tiempo newtoniano universal para rebanar el causet.
  senal_de_presencia: Foliacion unica cableada como 'el tiempo'.
  impacto_en_robustez: Viola covarianza; foliacion preferida.
  refactor_alternativa: Marginalizar sobre foliaciones o usar tiempo intrinseco (altura).
- id: ANTI-GCM-004
  antipatron: Discretizacion Ingenua del Tiempo
  disfuncion_causal: Time-stepping uniforme que trata el tiempo como una dimension
    mas de reloj.
  senal_de_presencia: Bucle de pasos temporales de tamano fijo.
  impacto_en_robustez: Deriva de foliacion; artefactos de paso.
  refactor_alternativa: Crecimiento secuencial covariante (Rideout-Sorkin).
- id: ANTI-GCM-005
  antipatron: Cierre Transitivo Perezoso
  disfuncion_causal: Usar los enlaces (coberturas) como si fueran la relacion causal
    completa.
  senal_de_presencia: Consultar links en vez del cierre transitivo.
  impacto_en_robustez: Relaciones causales perdidas; orden incompleto.
  refactor_alternativa: Mantener y consultar el cierre transitivo del orden.
- id: ANTI-GCM-006
  antipatron: Confundir Enlace con Relacion
  disfuncion_causal: Tratar la relacion de cobertura como la relacion de precedencia.
  senal_de_presencia: '''a<b'' inferido solo si hay link directo.'
  impacto_en_robustez: Transitividad rota en consultas.
  refactor_alternativa: Distinguir link (cobertura) de relacion (orden).
- id: ANTI-GCM-007
  antipatron: Continuum Prematuro
  disfuncion_causal: Asumir que el causet es manifoldlike antes de verificarlo.
  senal_de_presencia: Reconstruir metrica sin test de inmersion fiel.
  impacto_en_robustez: Geometria espuria sobre causet KR.
  refactor_alternativa: Verificar manifoldlikeness antes de reconstruir.
- id: ANTI-GCM-008
  antipatron: Ignorar Fluctuaciones de Poisson
  disfuncion_causal: Tratar el conteo N como exacto, olvidando la varianza sqrt(N).
  senal_de_presencia: Usar N sin barras de error estadisticas.
  impacto_en_robustez: Falsa precision; Lambda mal estimada.
  refactor_alternativa: Propagar sqrt(N) a todo observable derivado.
- id: ANTI-GCM-009
  antipatron: Sprinkling Determinista
  disfuncion_causal: Colocar puntos de forma determinista (regular o cuasi-aleatoria)
    en vez de Poisson.
  senal_de_presencia: Secuencias de baja discrepancia o mallas jitteadas.
  impacto_en_robustez: Correlaciones espurias; Lorentz roto.
  refactor_alternativa: Proceso de Poisson genuino con RNG fuerte.
- id: ANTI-GCM-010
  antipatron: Localidad Ingenua
  disfuncion_causal: Asumir que operadores diferenciales son locales sobre el causet.
  senal_de_presencia: d'Alembertiano de vecinos inmediatos sin suavizado.
  impacto_en_robustez: No-localidad patologica; operador inestable.
  refactor_alternativa: Operador BD no local amortiguado a mesoescala.
- id: ANTI-GCM-011
  antipatron: Etiquetado con Significado Fisico
  disfuncion_causal: Atribuir sentido fisico al orden de nacimiento o a los labels.
  senal_de_presencia: Observables funcion del label del elemento.
  impacto_en_robustez: Viola covarianza general discreta.
  refactor_alternativa: Solo la estructura de orden y el numero son fisicos.
- id: ANTI-GCM-012
  antipatron: Suma sobre Historias sin Regularizar
  disfuncion_causal: Sumar sobre todos los causets con medida uniforme.
  senal_de_presencia: Particion Z sin sesgo dinamico.
  impacto_en_robustez: Dominan ordenes KR no fisicos; Z diverge.
  refactor_alternativa: Accion + medida que suprima lo no-manifoldlike.
- id: ANTI-GCM-013
  antipatron: Ignorar Ordenes de Kleitman-Rothschild
  disfuncion_causal: Olvidar que el poset aleatorio tipico es de 3 capas y no-manifoldlike.
  senal_de_presencia: Muestrear posets uniformemente 'porque son causets'.
  impacto_en_robustez: Ensemble dominado por basura no geometrica.
  refactor_alternativa: Restringir o sesgar el ensemble a manifoldlike.
- id: ANTI-GCM-014
  antipatron: Dimension de un Solo Estimador
  disfuncion_causal: Confiar en un unico estimador de dimension.
  senal_de_presencia: Reportar dimension solo por Myrheim-Meyer.
  impacto_en_robustez: Sesgo no detectado; dimension erronea.
  refactor_alternativa: Cruzar estimadores (ordering fraction, cadena, midpoint).
- id: ANTI-GCM-015
  antipatron: Frontera Ignorada
  disfuncion_causal: Omitir los terminos de frontera en la accion causal.
  senal_de_presencia: Accion BD sin correccion de borde.
  impacto_en_robustez: Accion sesgada; curvatura de borde perdida.
  refactor_alternativa: Incluir terminos de frontera (Gibbons-Hawking discreto).
- id: ANTI-GCM-016
  antipatron: Accion sin Amortiguacion No Local
  disfuncion_causal: Usar la accion BD cruda sin suavizado de escala intermedia.
  senal_de_presencia: Sumar sobre capas sin epsilon-smearing.
  impacto_en_robustez: Fluctuaciones ~sqrt(N) ahogan la senal.
  refactor_alternativa: Introducir escala de no-localidad l >> l_P.
- id: ANTI-GCM-017
  antipatron: Coarse-Graining Uniforme Ciego
  disfuncion_causal: Decimar por bloques uniformes ignorando la estructura causal.
  senal_de_presencia: Agrupar por celdas de coordenadas fijas.
  impacto_en_robustez: Rompe el orden; fusiones espurias.
  refactor_alternativa: Decimar por un segundo sprinkling (RG causal).
- id: ANTI-GCM-018
  antipatron: Geodesica como Linea Recta
  disfuncion_causal: Asumir que la geodesica es una recta coordenada, no la cadena
