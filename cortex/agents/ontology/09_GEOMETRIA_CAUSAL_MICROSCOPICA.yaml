  senal_de_presencia: Medir distancia por coordenadas en vez de longest chain.
  impacto_en_robustez: Distancia causal erronea; metrica falsa.
  refactor_alternativa: Geodesica = clase de cadenas maximas.
- id: ANTI-GCM-019
  antipatron: Reconstruccion Metrica sin Numero
  disfuncion_causal: Recuperar la metrica solo del orden, olvidando el volumen.
  senal_de_presencia: Derivar g sin usar el conteo N.
  impacto_en_robustez: Factor conforme indeterminado.
  refactor_alternativa: orden (conforme) + numero (volumen) = metrica.
- id: ANTI-GCM-020
  antipatron: Causalidad como Post-Proceso
  disfuncion_causal: Construir la geometria primero y anadir causalidad despues.
  senal_de_presencia: Metrica postulada y conos derivados a posteriori.
  impacto_en_robustez: Invierte el axioma; causalidad no fundamental.
  refactor_alternativa: La causalidad (el orden) es el dato primario; la geometria
    emerge.
