  activacion_trigger: Corte de sprinkling en region finita.
  sensor_sintoma: Frontera causal sin causa fisica.
  escala_temporal: Estatica
  gravedad: C2
  intervencion: Extender region; validar horizonte fisico.
- id: PRIM-EST-048
  primitiva: Miscuenta de Molecula de Horizonte (Horizon Molecule Miscount)
