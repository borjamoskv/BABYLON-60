# --- CATEGORÍA 3: ANTIPATRONES ARQUITECTÓNICOS Y DE INVARIANTE (ANTI-041 → ANTI-045) ---
antipatrones_arquitectura_invariantes:
  - id: ANTI-041
    nombre: Distributed Monolith (Monolito Distribuido)
    disfuncion_causal: "Microservicios fuertemente acoplaos donde la caída o cambio de uno obliga a desplegar o detener a los demás en cascada."
    senal_presencia: "Llamadas síncronas RPC en cadena (`A -> B -> C -> D`) para resolver una sola petición de usuario."
    impacto_exergia: "Multiplicación de la latencia por suma de redes. Fragilidad sistémica máxima."
    remediacion_c5: "Desacoplamiento por eventos asíncronos (`Event-Driven BFT WAL`) y bases de datos por contexto de frontera (`Bounded Context`)."

  - id: ANTI-042
    nombre: Spider Web Architecture (Acoplamiento en Malla)
    disfuncion_causal: "Módulos que se referencian cruzadamente sin una jerarquía de capas clara en el DAG de dependencias."
    senal_presencia: "Imports circulares (`A import B` y `B import A`) resueltos con trucos de importación tardía."
    impacto_exergia: "Imposibilidad de testing unitario aislado. El grafo de clases colapsa en un solo nodo espagueti."
    remediacion_c5: "Inversión de dependencias (`DIP`). Inyección de abstracciones y estratificación jerárquica estricta (`DAG limpio`)."

  - id: ANTI-043
    nombre: API Vendor Lock-in (Acoplamiento Propietario Ciego)
    disfuncion_causal: "Acoplar el modelo de dominio interno directamente a las estructuras JSON/SDK de un proveedor de nube o IA externo."
    senal_presencia: "Usar objetos `Stripe.Charge` o `OpenAI.ChatCompletion` directamente como modelos de base de datos o lógica interna."
    impacto_exergia: "Cautividad tecnológica. Reescritura del 80% del código si el proveedor cambia su API o precios."
    remediacion_c5: "Patrón Adaptador / Transductor en Frontera (`Port & Adapters / Hexagonal`)."

  - id: ANTI-044
    nombre: Problema Círculo-Elipse (LSP Violation / Invariante Roto)
    disfuncion_causal: "Heredar una clase modificando postcondiciones o precondiciones de manera que un subtipo rompe las expectativas del supertipo."
    senal_presencia: "Clase `Cuadrado` que hereda de `Rectangulo` y sobrescribe `setAncho` modificando también la altura en silencio."
    impacto_exergia: "Violación del Principio de Sustitución de Liskov (`LSP`). Bugs sutiles y polimorfismo corrupto."
    remediacion_c5: "Composición sobre Herencia (`Composition over Inheritance`). Definición estricta de invariantes de clase."

  - id: ANTI-045
    nombre: Falta de Programación Defensiva (State Corruption)
    disfuncion_causal: "Permitir que un objeto sea instanciado en un estado inválido o nulo y esperar que el llamador lo inicialice después."
    senal_presencia: 'Constructores vacíos que requieren llamar a `obj.init(a, b)` antes de poder usar `obj.doWork()`.'
    impacto_exergia: "Excepciones `NullPointerException` esparcidas en tiempo de ejecución (`Temporal Coupling`)."
    remediacion_c5: "Invariante de Constructor: un objeto instanciado es un objeto 100% válido y listo para operar desde `__init__`."

