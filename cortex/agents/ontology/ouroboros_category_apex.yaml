1. Primitives of Collapse (`prims`):
- id: PRIM-CAT-01
  name: 'Endofunctor of State ($\mathcal{T}_{\text{state}}$):'
  description: 'A map $\mathcal{T}: \mathcal{C} \to \mathcal{C}$ that encapsulates
    the entire GPU/CPU registers and physical RAM pages, formalizing mutations as
    transition paths between objects in $\mathcal{C}$.'
- id: PRIM-CAT-02
  name: 'Monadic Erasure Event ($\mu_{\text{erase}}$):'
  description: 'The natural transformation $\mu: \mathcal{T}^2 \to \mathcal{T}$ that
    destroys state history. Maps to a physical bit erasure crossing the Landauer limit
    $E_L = k_B T \ln 2$.'
- id: PRIM-CAT-03
  name: 'Morphic Throttling ($f_{\text{throttle}}$):'
  description: 'A morphism $f: X \to Y$ whose execution time $t$ exceeds the thermal
    junction threshold ($T_{chip} > 70^\circ\text{C}$), triggering an automatic drop
    in performance class.'
- id: PRIM-CAT-04
  name: 'Symplectic State Transition ($\omega_{\text{symplectic}}$):'
  description: A phase-space volume-preserving map ensuring numerical stability and
    preventing chaotic drift in ODE/PDE integrations.
2. Invariantes Termodinámicas (`invt`):
- id: INVT-CAT-01
  name: 'Compositional Exergy Conservation:'
  description: $\mathcal{F}(g \circ f) = \mathcal{F}(g) \circ \mathcal{F}(f)$. No
    informational or physical energy is destroyed during the composition of pure computational
    morphisms.
- id: INVT-CAT-02
  name: 'Isomorphic Memory Allocation:'
  description: Every memory allocator mapping host virtual pages to Metal device heaps
    must be a bijective, zero-copy functor preserving the underlying physical address
    space pointer.
- id: INVT-CAT-03
  name: 'Identity Morphism Preservation:'
  description: 'The identity morphism $\text{id}_X: X \to X$ mapped to hardware is
    an idle instruction that produces exactly zero Joule heating: $Q_{joule}(\text{id}_X)
    = 0$.'
3. Antipatrones Estocásticos (`antip`):
- id: ANTIP-CAT-01
  name: 'Non-Functorial Mutability:'
  description: Mutating underlying device registry bytes or variables via side channels,
    breaking the identity laws of category theory.
- id: ANTIP-CAT-02
  name: 'Erasure Leakage (Anergy Drift):'
  description: Allocating memory buffers inside tight loops without defining explicit
    monadic deallocation boundaries, creating memory fragmentation.
- id: ANTIP-CAT-03
  name: 'Implicit Monad Nesting:'
  description: Layering multiple asynchronous and resource contexts without using
    Monad Transformers, increasing the topological complexity of the state graph.
4. Redundancias Activas (`redun`):
- id: REDUN-CAT-01
  name: 'Curry-Howard-Lambek Verifier:'
  description: Compiling all algebraic transformations under strict type checkers
    to verify the preservation of categorical laws at compile time.
- id: REDUN-CAT-02
  name: 'Algebraic Property-Based Probing:'
  description: Generating pseudo-random inputs to verify that customer-implemented
    functors satisfy $\mathcal{F}(\text{id}) = \text{id}$ and associativity.
5. Vectores Adversariales (`reda`):
- id: REDA-CAT-01
  name: 'Morphism Interruption (Exception Triggering):'
  description: Inducing unexpected runtime exceptions to bypass monadic error boundaries,
    breaking the functorial chain. *Defense:* Enforce wrapping of all unstable system
    APIs into the `Either` / `Result` monad.
- id: REDA-CAT-02
  name: 'State Injection Attack:'
  description: Forcing state updates via unvalidated memory pointers to desynchronize
    the logical memory graph from the physical ledger. *Defense:* Complete isolation
    of state updates inside read-only transactional contexts.
