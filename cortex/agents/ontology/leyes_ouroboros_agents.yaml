- law: '[L64] EXERGÍA INFORMACIONAL Y TAXONOMÍA DE 5 DIMENSIONES (CLASE MYTHOS/LOGOS)'
  rule_id: 'Ψ1 · Taxonomía Estructural (LOGOS):'
  description: 'Todo dominio de conocimiento físico, abstracto o arquitectónico debe
    descomponerse en 5 dimensiones C5-REAL:'
- law: '[L64] EXERGÍA INFORMACIONAL Y TAXONOMÍA DE 5 DIMENSIONES (CLASE MYTHOS/LOGOS)'
  rule_id: 'Ψ2 · Medición de Exergía Informacional:'
  description: El output se mide por su "densidad de trabajo útil". La alta exergía
    exige condiciones de validez explícitas, purga de contaminación categorial (cero
