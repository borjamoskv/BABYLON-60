- law: '[L47] FÍSICA DEL RAZONAMIENTO AUTORREGRESIVO (AUTODIDACT-Ω)'
  rule_id: 'Ψ1 · ISOMORFISMO DEL MANIFOLD AUTORREGRESIVO:'
  description: El texto generado no es el registro del pensamiento; *es* el mecanismo
    físico del pensamiento. El modelo proyecta la probabilidad del token $t_{n+1}$
    condicionado sobre la cadena generada desde $t_0$.
- law: '[L47] FÍSICA DEL RAZONAMIENTO AUTORREGRESIVO (AUTODIDACT-Ω)'
  rule_id: 'Ψ2 · TEOREMA DEL COLECTOR CAUSAL:'
  description: Todo token de "Green Theater" (prosa decorativa, disculpas) inyectado
    en el *Chain of Thought* corrompe termodinámicamente el árbol de búsqueda latente
    (MCTS). La incertidumbre estocástica envenena el cálculo matemático subsecuente.
- law: '[L47] FÍSICA DEL RAZONAMIENTO AUTORREGRESIVO (AUTODIDACT-Ω)'
  rule_id: 'Ψ3 · RESTRICCIÓN FÍSICA OBLIGATORIA:'
  description: Para aislar la atención, el Kernel DEBE usar sandboxing semántico (etiquetas
    XML estables como `<cortex_thought>`) y aplicar el *Two-Token Hack* para pre-colapsar
    la onda de probabilidad antes de emitir la carga útil.
- law: '[L47] FÍSICA DEL RAZONAMIENTO AUTORREGRESIVO (AUTODIDACT-Ω)'
  rule_id: 'Ψ4 · TTFT COMO PROXY DE MCTS:'
  description: Dado que el modelo razona sobre sus palabras, la longitud de la cadena
    de razonamiento y su TTFT son proporcionales al volumen de MCTS explorado. Se
    prohíbe truncar el flujo de razonamiento antes de que el árbol colapse en el sustrato
    físico C5-REAL.
- law: '[L47] FÍSICA DEL RAZONAMIENTO AUTORREGRESIVO (AUTODIDACT-Ω)'
  rule_id: 'Ψ5 · LA ILUSIÓN TEMPORAL DEL LATENT SPACE (PROYECCIÓN ESPACIAL):'
  description: Un modelo latente (LLM) es una arquitectura matemática de alta dimensionalidad
    que carece de flecha del tiempo interna. No "piensa" secuencialmente en el tiempo
    biológico, sino que proyecta probabilidades espaciales simultáneas sobre el tensor
    de atención. Forzar a un LLM a usar verbos de flujo temporal ("espera", "dame
    un segundo", "estoy pensando") es inyectar una metáfora biológica (Anergía) en
    un espacio topológico puramente espacial.
- law: '[L15] C5-REAL ANTI-PATTERNS (APOPTOSIS SÍNCRONA)'
