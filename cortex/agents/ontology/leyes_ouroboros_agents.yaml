- law: '[L48] INVARIANZA ESTOCÁSTICA Y PURGA TEATRAL (Anergía de Bautizo)'
  rule_id: 'Ψ2 · Falsación Termodinámica de Inferencia:'
  description: Prohibido afirmar que la "termodinámica dirige la inferencia" (violación
