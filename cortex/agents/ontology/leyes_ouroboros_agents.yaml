  description: Queda estrictamente prohibido afirmar que el Kernel opera bajo "determinismo
    paramétrico". La inferencia L3/L1 es estocástica a T>0, y a T=0 la asincronía
    en la reducción de tensores de coma flotante en CUDA rompe la asociatividad, impidiendo
    la reproducibilidad bit-a-bit. El determinismo proviene exclusivamente de la constricción
