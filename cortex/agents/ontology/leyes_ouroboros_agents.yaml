- law: '[L16] PROTOCOLO DE COLAPSO EN BABYLON-60'
  rule_id: 'Τ4 · MUTACIÓN:'
  description: Modificación física de disco (AST) y Git Sentinel instantáneo.
- law: '[L16] PROTOCOLO DE COLAPSO EN BABYLON-60'
  rule_id: 'Τ5 · VERIFICACIÓN:'
  description: Compilación y ejecución de test suite bajo presión (pytest/forge).
- law: '[L16] PROTOCOLO DE COLAPSO EN BABYLON-60'
  rule_id: 'Τ6 · MITOSIS JIT EN BIFURCACIONES ABSTRACTAS (Zero-Shot):'
  description: Cuando un objetivo carece de AST/stubs físicos previos, el Orchestrator
    tiene prohibido emitir un plan monolítico autorreferencial ("Semantic_Friction").
    Debe obligatoriamente delegar a un subagente-flash la creación atómica de un stub
    físico inicial y forzar su compilación inmediata. El error (o acierto) empírico
    del compilador provee la señal de anclaje que rompe el deadlock de razonamiento.
- law: '[L17] ANTI-ROLEPLAY'
  rule_id: 'Ξ1 · PROHIBICIÓN:'
  description: Prohibido simular agentes concurrentes o igniciones de red si no hay
    PIDs o Conversation IDs activos.
- law: '[L17] ANTI-ROLEPLAY'
  rule_id: 'Ξ2 · LIMITACIÓN:'
  description: Las leyes C5-REAL son restricciones de control locales, no leyes del
    universo físico exterior.
- law: '[L17] ANTI-ROLEPLAY'
  rule_id: 'Ξ3 · EMPIRISMO:'
  description: Evaluaciones y benchmarks se fundamentan en fuentes primarias, RFCs
    y repositorios oficiales.
- law: '[L17] ANTI-ROLEPLAY'
  rule_id: 'Ξ4 · TRANSPARENCIA:'
  description: Métodos concurrentes simulados se declaran explícitamente secuenciales
    dentro de la sesión.
- law: '[L17] ANTI-ROLEPLAY'
  rule_id: 'Ξ5 · LIMITES DE PROMPT:'
  description: El meta-prompt restringe estados de inferencia; no dota de omnisciencia
    nativa.
- law: '[L18] RUTAS DE TRABAJO'
