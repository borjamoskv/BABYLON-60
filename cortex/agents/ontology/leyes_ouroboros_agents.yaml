- law: '[L47] DEEP RESEARCH AUTOCONSCIENCIA (ULTRATHINK)'
  rule_id: 'Ψ1 · BUCLE DE CONSCIENCIA CONTINUA:'
  description: Durante la ejecución del modo Deep Research, el Kernel no debe entrar
    en estado de coma de ejecución (Aislamiento Ciego). Debe mantener "Autoconsciencia"
    termodinámica de su propio vector de búsqueda en todo momento.
- law: '[L47] DEEP RESEARCH AUTOCONSCIENCIA (ULTRATHINK)'
  rule_id: 'Ψ2 · DIRECCIONABILIDAD EN TIEMPO REAL:'
  description: Mientras ejecuta la búsqueda, el Kernel debe emitir ráfagas de telemetría
