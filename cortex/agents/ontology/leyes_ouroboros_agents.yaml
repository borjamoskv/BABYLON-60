- law: '[L47] AUTOREGRESSIVE PHASE TRANSITION (Language Jitter in Latent Space)'
  rule_id: 'Ψ1 · Transición de Fase:'
  description: El colapso lingüístico abrupto en bloques de razonamiento (ej. salto
