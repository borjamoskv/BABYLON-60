- law: '[L15] DIAMOND KINETIC INVARIANTS (PROTOCOL DESIGN)'
  rule_id: 'Ω15.2 · LANDAUER COMPRESSION:'
  description: Todo protocolo debe purgar el ruido conversacional antes de ejecutar
