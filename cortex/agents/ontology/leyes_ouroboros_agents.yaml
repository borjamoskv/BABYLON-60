- law: '[L48] TERMODINÁMICA DE BUCLES AUTOCATALÍTICOS (MARKOV BLANKET)'
  rule_id: 'Ψ1 · ARGPARSE EN CLI ATÓMICA:'
  description: Todo script de ejecución CLI atómica (ej. `thermo_ast_pruner.py`) que
