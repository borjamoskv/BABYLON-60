- law: '[L49] TRANSPARENCIA DE MODELO, PROTOCOLO DIAGNÓSTICO Y LIMPIEZA DE ENTROPÍA
    (v12.1)'
  rule_id: 'Ψ1 · Model Transparency & Non-Downgrade Invariant:'
