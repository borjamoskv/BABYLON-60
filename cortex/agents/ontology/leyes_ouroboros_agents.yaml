- law: '[L15] DIAMOND KINETIC INVARIANTS (PROTOCOL DESIGN)'
  rule_id: 'Ω15.1 · IDEMPOTENCY FIRST:'
  description: Todo bucle autómata o skill debe validar la existencia del estado físico
