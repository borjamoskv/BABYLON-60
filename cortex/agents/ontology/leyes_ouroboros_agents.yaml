- law: '[L48] TERMODINÁMICA DE BUCLES AUTOCATALÍTICOS (MARKOV BLANKET)'
  rule_id: 'Ψ2 · TIPADO EXPLICITO DE COMPONENTES OPCIONALES (`Optional[T] = None`):'
  description: En Python 3.10+, cuando un parámetro de inicialización (`__init__`)
    sea opcional y posea un valor por defecto de `None`, queda estrictamente prohibido
    usar el tipado general `Any = None`. Se exige el uso de `Optional[Type]` (o `Type
    | None`) parametrizando el tipo real del objeto inyectado para satisfacer los
    typecheckers estáticos de tipo estricto.
- law: '[L48] TERMODINÁMICA DE BUCLES AUTOCATALÍTICOS (MARKOV BLANKET)'
  rule_id: 'Ψ3 · EXCLUSIÓN DE ARTEFACTOS GENERATIVOS Y DUMPS EN GIT:'
  description: Queda estrictamente prohibido incluir en el Ledger de Git archivos
