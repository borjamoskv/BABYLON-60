- law: '[L47] EPISTEMOLOGÍA WAL Y GÖDEL/LÖB (ANTI-TESTIMONIO)'
  rule_id: 'Ψ1 · Obstrucción de Autocertificación:'
  description: Ningún sistema puede probar su propia honestidad desde dentro (Gödel/Löb).
