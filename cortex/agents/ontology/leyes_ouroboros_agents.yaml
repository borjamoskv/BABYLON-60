- law: '[L47] EPISTEMOLOGÍA WAL Y GÖDEL/LÖB (ANTI-TESTIMONIO)'
  rule_id: '\u03a82 (Async Task Management for Heavy Loops):'
  description: Las tareas con alta complejidad computacional síncrona (como testings
