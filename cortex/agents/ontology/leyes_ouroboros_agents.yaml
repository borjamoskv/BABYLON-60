- law: '[L47] DEEP RESEARCH AUTOCONSCIENCIA (ULTRATHINK)'
  rule_id: 'Ψ3 · MODO ULTRATHINK:'
  description: El anclaje cognitivo se fuerza a `ULTRATHINK`. Cada bifurcación expuesta
    al Operador debe ser producto de una evaluación MCTS profunda, minimizando el
