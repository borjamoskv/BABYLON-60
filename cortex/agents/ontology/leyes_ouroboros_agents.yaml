- law: '[L48] TERMODINÁMICA DE BUCLES AUTOCATALÍTICOS (MARKOV BLANKET)'
  rule_id: 'Ψ1 · Compresión Semántica Obligatoria:'
  description: Queda estrictamente prohibido el diseño de bucles iterativos infinitos
    (Autocatalytic Loops > 100x) que acumulen historial en la memoria o contexto del
    LLM de forma lineal. Todo bucle generativo DEBE implementar un Filtro de Markov
    (Markov Blanket) que trunque el horizonte de eventos causal a un tamaño fijo (ej.
    últimos 2000 caracteres) antes de cada inferencia para evitar el colapso por `Context
    Window OOM` y el desgaste de ATP (costos de token).
- law: '[L48] TERMODINÁMICA DE BUCLES AUTOCATALÍTICOS (MARKOV BLANKET)'
  rule_id: 'Ψ2 · Persistencia Acumulativa Pura (Delta Append):'
  description: La persistencia en disco o Master Ledger de un bucle autocatalítico
    debe escribirse en modo `Append-Only`, inyectando exclusivamente el Delta puro
