- law: '[L50] MITIGACIÓN DE INYECCIÓN DE PROMPTS INDIRECTA (IPI_SANITY_SHIELD)'
  rule_id: 'Ψ2 · EXCLUSIÓN DE BASES DE DATOS Y LOGS:'
  description: Para evitar falsos positivos y timeouts de CPU en repositorios de gran
    escala, el escaneo de inyecciones debe omitir sistemáticamente archivos binarios
