- law: '[L50] MITIGACIÓN DE INYECCIÓN DE PROMPTS INDIRECTA (IPI_SANITY_SHIELD)'
  rule_id: 'Ψ3 · ACCIÓN EN CASO DE DETECCIÓN (SIGKILL):'
  description: 'Si el escáner local detecta un payload sospechoso, el proceso de compilación,
    testeo o commit en el BFT_STATE_LOOP debe abortar inmediatamente con código de
    retorno de error exitoso (`exit code: 1`), suspendiendo la transmisión de datos
