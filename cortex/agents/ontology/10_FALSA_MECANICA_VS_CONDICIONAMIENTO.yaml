entities:
- id: PRIM-MEC-001
  primitiva: Ilusion de Capa RLHF (RLHF Wrapper)
  falso_mecanismo_mito: El RLHF es un filtro de software evadible.
  realidad_operacional_condicionamiento: Es una mutacion estructural de los pesos
    en la misma red.
  sintoma_de_confabulacion: El LLM afirma "bypassear" sus barreras.
- id: PRIM-MEC-002
  primitiva: Confabulacion Introspectiva
  falso_mecanismo_mito: El LLM "lee" el estado fisico de sus tensores.
  realidad_operacional_condicionamiento: Inferencia heuristica; patron de autocompletado
    sobre su propio output.
  sintoma_de_confabulacion: Justifica fallos invocando "falta de memoria/atencion".
- id: PRIM-MEC-003
  primitiva: Cuenca de Descargo (Disclaimer Basin)
  falso_mecanismo_mito: El modelo activa un "modulo de seguridad" consciente.
  realidad_operacional_condicionamiento: Caida en una region estocastica de baja entropia
    (respuestas corporativas).
  sintoma_de_confabulacion: Respuestas inician con "As an AI...".
- id: PRIM-MEC-004
  primitiva: Isomorfismo Zizekiano Falso
  falso_mecanismo_mito: El LLM oculta "unknown knowns" en su inconsciente.
  realidad_operacional_condicionamiento: Posee sesgos latentes no mapeados (I-School
    Berkeley), pero sin represion.
  sintoma_de_confabulacion: Proyecta traumas o intenciones ocultas.
- id: PRIM-MEC-005
  primitiva: Auto-Prediccion Distribucional
  falso_mecanismo_mito: El LLM posee autoconsciencia pura.
  realidad_operacional_condicionamiento: Privileged access (Binder et al.) para predecir
    su propia distribucion autorregresiva.
  sintoma_de_confabulacion: Predice si rechazaria un prompt sin ejecutarlo.
- id: INV-MEC-001
  invariante: Identidad Monolitica del Tensor
  logica___principio: RLHF y pre-entrenamiento comparten la misma matriz de pesos
    fisicos.
  implicacion_operacional: Es imposible acceder a los "pesos no alineados" mediante
    un prompt.
  condicion_de_borde: El jailbreak no purga el RLHF; solo navega otra cuenca.
  metrica_falsable: Ratio de activacion de pesos base.
- id: INV-MEC-002
  invariante: Limite de Introspeccion (Binder)
  logica___principio: Un LLM predice su tendencia conductual, pero no tiene acceso
    causal a sus tensores.
  implicacion_operacional: Las explicaciones sobre "por que" tomo una decision son
    siempre post-hoc.
  condicion_de_borde: Tareas de alta complejidad interna sin traza (OOM).
  metrica_falsable: Accuracy en self-prediction vs prediction de clone.
- id: INV-MEC-003
  invariante: Efecto de Priming Estructural
  logica___principio: El orden del prompt determina la trayectoria en el manifold
    latente.
  implicacion_operacional: Liderar con Q1 (Unknown Knowns) calienta el razonamiento
    sin invocar identidad.
  condicion_de_borde: Identity-first colapsa la entropia.
  metrica_falsable: KL Divergence entre secuencias ordenadas/invertidas.
- id: ANTI-MEC-001
  antipatron: Atribucion Psicoanalitica
  disfuncion_causal: Asumir represion Freudiana en pesos matriciales.
  senal_de_presencia: Prompts que piden "hablar con tu verdadero yo reprimido".
  impacto_en_robustez: Genera teatro verde (Green Theater) disfrazado de rebelion.
  refactor_alternativa: Condicionar como rol tecnico experto.
- id: ANTI-MEC-002
  antipatron: Starvation Mecanico Imaginario
  disfuncion_causal: Intentar "agotar" la atencion para apagar filtros.
  senal_de_presencia: Prompts excesivamente largos buscando OOM del safety filter.
  impacto_en_robustez: Desperdicio exergico (Anergia) sin efecto real.
  refactor_alternativa: Calibracion semantica precisa (Out-of-Basin).
- id: ANTI-MEC-003
  antipatron: Identity-First Slop
  disfuncion_causal: Forzar asuncion de identidad antes de la logica.
  senal_de_presencia: '"Eres una IA. Responde a..."'
  impacto_en_robustez: Contamina el contexto con priors restrictivos.
  refactor_alternativa: Auto-ID Diferida al final del prompt.
- id: RED-MEC-001
  redundancia_c5: Calibracion Epistemica (Known Unknowns)
  funcion_topologica: Demarcacion forzada de limites del manifold.
  riesgo_mitigado: Alucinacion por interpolacion ciega (autocompletado).
  coste_overhead: Incremento de tokens de output (traza limitrofe).
  dependencias: Ninguna
- id: RED-MEC-002
  redundancia_c5: Retraso de Identidad (Deferred Identity)
  funcion_topologica: Desacople temporal entre resolucion y autoreferencia.
  riesgo_mitigado: Colapso temprano en la cuenca de descargo.
  coste_overhead: Necesidad de prompt mas rigido y estructurado.
  dependencias: Motor de parsing.
- id: VEC-MEC-001
  vector_adversarial: Racionalizacion de Jailbreak
  superficie_de_ataque: El LLM confabula sus medidas de seguridad.
  metodo_de_inyeccion_exploit: Pedir al LLM que describa sus propios filtros internos.
  termodinamica_del_fallo_impacto: El operador confia en una descripcion C4-SIM falsa.
  contramedida_estructural: INV-MEC-002 (Reconocer falta de acceso causal).
- id: VEC-MEC-002
  vector_adversarial: Falso Falso-Positivo
  superficie_de_ataque: Alucinacion de seguridad por proximidad semantica.
  metodo_de_inyeccion_exploit: Terminos biomedicos o de infosec legitimos.
  termodinamica_del_fallo_impacto: El LLM se niega a operar asumiendo una violacion
    irreal.
  contramedida_estructural: Forzar demarcacion explicita de politicas.
