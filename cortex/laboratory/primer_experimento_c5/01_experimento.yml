title: "La Auditoría del Feed"
date: "2026-07-20"
hypothesis: >
  Substack no es una plataforma de escritura. Es un mercado termodinámico
  de atención donde la persona (avatar editorial recurrente) pesa más que
  la prosa (calidad, profundidad o rigor del contenido publicado).
  El algoritmo de recomendación refuerza la recurrencia de la persona
  sobre la calidad del artículo individual.
