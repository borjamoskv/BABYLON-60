<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="pinkCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Top Saucer (Classic Dome Saucer) -->
  <g filter="url(#glow)" transform="translate(400, 220)">
    <!-- Dome -->
    <path d="M -90 -10 C -90 -60, 90 -60, 90 -10 Z" fill="rgba(0,240,255,0.15)" stroke="#00F0FF" stroke-width="4"/>
    <!-- Disc Body -->
    <ellipse cx="0" cy="0" rx="220" ry="35" fill="rgba(123,44,191,0.2)" stroke="#7B2CBF" stroke-width="6"/>
    <ellipse cx="0" cy="12" rx="160" ry="18" fill="none" stroke="#FF007A" stroke-width="3" stroke-dasharray="12 8"/>
    <!-- Beam Emission -->
    <polygon points="-70,30 70,30 140,140 -140,140" fill="rgba(0,240,255,0.08)" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Text / Tattoo Inscription -->
  <text x="400" y="460" text-anchor="middle" fill="#00F0FF" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="6" filter="url(#glow)">UFO // CAUSAL HARMONICS</text>

  <!-- Middle Saucer (Long Elongated Mothership with Windows) -->
  <g filter="url(#glow)" transform="translate(400, 580)">
    <ellipse cx="0" cy="0" rx="310" ry="50" fill="rgba(15,18,30,0.85)" stroke="url(#pinkCyan)" stroke-width="7"/>
    <!-- Portholes / Illuminated Windows -->
    <rect x="-160" y="-12" width="40" height="18" rx="6" fill="#00F0FF" filter="url(#glow)"/>
    <rect x="-80" y="-12" width="40" height="18" rx="6" fill="#FF007A" filter="url(#glow)"/>
    <rect x="0" y="-12" width="40" height="18" rx="6" fill="#00F0FF" filter="url(#glow)"/>
    <rect x="80" y="-12" width="40" height="18" rx="6" fill="#FF007A" filter="url(#glow)"/>
    <rect x="160" y="-12" width="40" height="18" rx="6" fill="#00F0FF" filter="url(#glow)"/>
    <ellipse cx="0" cy="22" rx="240" ry="16" fill="none" stroke="#7B2CBF" stroke-width="3" stroke-dasharray="20 10"/>
  </g>

  <!-- Bottom Saucer (Heavy Base Disc) -->
  <g filter="url(#glow)" transform="translate(400, 800)">
    <!-- Top Cap -->
    <path d="M -140 0 C -140 -40, 140 -40, 140 0 Z" fill="rgba(255,0,122,0.2)" stroke="#FF007A" stroke-width="4"/>
    <!-- Main Rim -->
    <ellipse cx="0" cy="15" rx="260" ry="42" fill="rgba(0,240,255,0.15)" stroke="#00F0FF" stroke-width="6"/>
    <path d="M -260 15 C -200 70, 200 70, 260 15" fill="none" stroke="#7B2CBF" stroke-width="5"/>
  </g>
</svg>
