<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="10 5" filter="url(#glow-cyan)" opacity="0.6"/>

    <!-- Middle Thick Ring with gaps -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#7B2CBF" stroke-width="8" stroke-dasharray="50 15 20 15" filter="url(#glow-violet)"/>

    <!-- Inner Fine Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FF007A" stroke-width="1" opacity="0.8"/>

    <!-- Radial Ticks / Frequency Markers -->
    <g stroke="#00F0FF" stroke-width="2" filter="url(#glow-cyan)">
      <!-- Loop for ticks using standard SVG rotations, 12 major ticks -->
      <line x1="0" y1="-140" x2="0" y2="-120" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(30)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(60)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(90)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(120)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(150)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(180)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(210)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(240)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(270)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(300)" />
      <line x1="0" y1="-140" x2="0" y2="-120" transform="rotate(330)" />
    </g>

    <!-- Audio Waveform (Simulated) -->
    <path d="M -120 0 Q -90 -40 -60 0 T 0 0 T 60 0 T 120 0" fill="none" stroke="#FF007A" stroke-width="3" />
    <path d="M -120 0 Q -90 40 -60 0 T 0 0 T 60 0 T 120 0" fill="none" stroke="#7B2CBF" stroke-width="2" filter="url(#glow-violet)"/>
    <circle cx="0" cy="0" r="10" fill="#00F0FF" filter="url(#glow-cyan)"/>
  </g>
</svg>
