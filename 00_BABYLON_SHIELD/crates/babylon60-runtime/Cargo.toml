[package]
name = "babylon60-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "F60 Rational Arithmetic and Coroutine Runtime for BABYLON-60"
repository = "https://github.com/borjamoskv/BABYLON-60"
authors = ["Borja Moskv <borjamoskv@github.com>"]

[dependencies]
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
num-integer = "0.1.46"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
