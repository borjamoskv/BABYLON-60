[package]
name = "strike_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "strike_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.5"
petgraph = "0.8.3"
rusqlite = { version = "0.31.0", features = ["bundled"] }
ring = "0.17.8"
inotify = "0.10.2"
signal-hook = "0.3.17"
pyo3 = { version = "0.21.2", features = ["extension-module"] }
libc = "0.2.186"
uuid = { version = "1.24.0", features = ["v5"] }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "1.6.0"

