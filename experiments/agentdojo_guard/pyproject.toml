[project]
name = "babylon60-agentdojo-guard"
version = "0.1.0"
description = "P0 campaign: BABYLON GUARD capability broker evaluated on AgentDojo (prompt-injection ASR vs utility)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload", "License :: Other/Proprietary License"]
# agentdojo is MIT (github.com/ethz-spylab/agentdojo). Exact pin: the benchmark version is part of the result.
dependencies = ["agentdojo==0.1.35"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
