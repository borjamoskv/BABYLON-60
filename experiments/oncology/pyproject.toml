[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babylon60-oncology-experiments"
version = "0.1.0"
description = "Separate legacy oncology catalogs and simulation experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload", "License :: Other/Proprietary License"]
dependencies = []

[project.optional-dependencies]
simulation = ["numpy>=1.24", "networkx>=3.0", "pandas>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
babylon60-oncology-experiment = "babylon60_oncology.onco_transducer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/babylon60_oncology"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "data", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
