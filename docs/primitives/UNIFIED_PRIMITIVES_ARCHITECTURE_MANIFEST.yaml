  swarm_centuria_matrix.yml:
    cortex_taint: "CORTEX-TAINT:borjamoskv:swarm_centuria_matrix:2026-07-18T10:40:20Z:cf23a890de894bc7"
    description: "Centuria Matrix: 100 Invariantes y Antipatrones deterministas condensando 1000 primitivas APEX para Gestión Autónoma de Repositorios."
    domains:
      - id: D1
        name: "Gobernanza e IAM (Access Control & Escrow)"
        invariants:
          - "I1.1: Separación de identidades: cada agente opera con un bot (GitHub App) único y credenciales acotadas al mínimo privilegio."
          - "I1.2: OIDC dinámico para despliegues en la nube, prohibiendo credenciales estáticas de larga duración."
          - "I1.3: Bloqueo incondicional de push directo a la rama de producción (main)."
          - "I1.4: CODEOWNERS define revisores humanos obligatorios para configuraciones de infraestructura y workflows de CI/CD."
          - "I1.5: La revocación de accesos del swarm debe estar centralizada en un único token maestro (Kill Switch)."
          - "I1.6: Toda creación de ramas debe seguir una nomenclatura tipada (/feature, /fix, /release)."
          - "I1.7: Todo pull request generado por el swarm debe referenciar un issue id preexistente."
          - "I1.8: La rotación de llaves SSH/GPG para firmas de commits de bots se realiza de forma automatizada y programada."
          - "I1.9: Los privilegios administrativos del repositorio están restringidos únicamente a humanos dueños del negocio."
          - "I1.10: Los bots de testing y deploy no poseen permisos de escritura sobre el código fuente."
        antipatterns:
          - "A1.1: Compartir un Personal Access Token (PAT) único con permisos de administrador en todo el swarm."
          - "A1.2: Almacenar llaves de AWS/GCP en los prompts del sistema o en issues del repositorio."
          - "A1.3: Permitir que un bot de código modifique las Branch Protection Rules de producción."
          - "A1.4: Ejecutar despliegues usando tokens con acceso permanente en lugar de tokens efímeros."
          - "A1.5: Asignar propiedad de CODEOWNERS en subcarpetas críticas exclusivamente a bots autónomos."
          - "A1.6: Crear ramas con nombres arbitrarios fuera del estándar tipado."
          - "A1.7: Fusionar PRs de agentes sin trazabilidad a un requerimiento de negocio (issue) aprobado."
          - "A1.8: Utilizar la misma GitHub App para el Coder y el Reviewer (pérdida de oposición de roles)."
          - "A1.9: Dejar deshabilitado el control de firmas en commits para repositorios públicos."
          - "A1.10: Dar permisos de borrado de repositorio a la API de los agentes."
      - id: D2
        name: "Máquina de Estados y FSM Transitions"
        invariants:
          - "I2.1: El estado de cada tarea se rastrea en una base de datos local persistente como fuente de verdad única."
          - "I2.2: Circuit Breaker obligatorio: abortar y enviar a DEAD_LETTER si una tarea excede 3 intentos fallidos."
          - "I2.3: Cada transición de estado requiere una firma criptográfica única del bot emisor."
          - "I2.4: El estado de una tarea solo puede avanzar de forma secuencial determinista (FSM)."
          - "I2.5: Las tareas en estado DEAD_LETTER requieren intervención manual explícita para ser reactivadas."
          - "I2.6: El tiempo de permanencia en cada estado de la FSM tiene un timeout físico estricto."
          - "I2.7: La inicialización de la FSM se valida de forma síncrona contra el estado del disco."
          - "I2.8: Toda falla crítica en el motor de transiciones aborta el bucle completo y apaga el daemon."
          - "I2.9: La base de datos de estado registra la traza del modelo LLM utilizado en cada paso."
          - "I2.10: El estado de producción se mapea de forma isomórfica con los tags del ledger."
        antipatterns:
          - "A2.1: Permitir loops infinitos de corrección de código quemando API budget."
          - "A2.2: Usar variables de entorno volátiles en memoria para seguir el estado del swarm."
          - "A2.3: Saltar estados en la FSM sin pasar por las validaciones previas (ej. de CODING a MERGE sin pasar por TESTING)."
          - "A2.4: Mantener tareas encoladas indefinidamente sin timeout de ejecución."
          - "A2.5: Reintentar de forma indefinida tareas que fallan en el linter estático."
          - "A2.6: Compartir la base de datos de estado sin bloqueos de escritura concurrentes."
          - "A2.7: Permitir transiciones sin firmas o logs de auditoría estructurados."
          - "A2.8: Ignorar las excepciones de I/O en la base de datos de estado de la FSM."
          - "A2.9: Limpiar la tabla de estados históricos sin archivar el log causal."
          - "A2.10: Permitir que un agente modifique su propio estado en la FSM directamente."
      - id: D3
        name: "Determinismo CI/CD y Puertas de Prueba"
        invariants:
          - "I3.1: Los linters, pruebas unitarias y analizadores de seguridad estática son el juez supremo del merge."
          - "I3.2: El PR requiere 100% de tests en verde antes de que se habilite el auto-merge."
          - "I3.3: La cobertura de código debe mantenerse o aumentar; cualquier PR que la reduzca es bloqueado."
          - "I3.4: Los linters de formato (ej. Ruff, Prettier) se ejecutan de manera obligatoria e inmutable."
          - "I3.5: El CI/CD incluye escaneo automático de secretos (ej. Trufflehog) en cada PR."
          - "I3.6: El entorno de CI/CD es aislado e idéntico al de producción."
          - "I3.7: Las pruebas se ejecutan contra la rama main actualizada, no contra diffs aislados."
          - "I3.8: El análisis estático de dependencias reporta alertas críticas antes del paso de merge."
          - "I3.9: El log de compilación y salida de CI/CD se persiste para auditoría forense."
          - "I3.10: Toda falla en el pipeline de CI/CD detiene el pipeline de despliegue inmediatamente."
        antipatterns:
          - "A3.1: Permitir auto-merge con pruebas unitarias fallidas o ignoradas."
          - "A3.2: Utilizar el LLM para 'aprobar' la sintaxis o el build en lugar de un compilador real."
          - "A3.3: Ejecutar pruebas en el entorno de desarrollo local del agente sin aislamiento."
          - "A3.4: Omitir el escaneo de dependencias vulnerables en PRs generados por bots."
          - "A3.5: Reducir la cobertura de tests para forzar el merge rápido de un fix."
          - "A3.6: Ignorar advertencias de seguridad estática (Bandit, Semgrep) marcándolas como falsos positivos sin revisión humana."
          - "A3.7: Permitir que los agentes editen los archivos de configuración del CI/CD (.github/workflows)."
          - "A3.8: Deshabilitar el paso de compilación para agilizar las pruebas unitarias."
          - "A3.9: Ejecutar tests que dependan de bases de datos externas sin mockear."
          - "A3.10: Reutilizar entornos de compilación sucios entre PRs de diferentes agentes."
      - id: D4
        name: "Aislamiento del Entorno y Sandboxing"
        invariants:
          - "I4.1: Todo código auto-generado se compila y ejecuta en una MicroVM o contenedor efímero sin red."
          - "I4.2: La memoria y CPU del entorno de sandbox están acotados físicamente para prevenir RCE o ataques DoS."
          - "I4.3: El sandbox se destruye incondicionalmente tras finalizar el ciclo de pruebas del PR."
          - "I4.4: Se bloquea la persistencia de datos del sandbox en el host principal."
          - "I4.5: El contenedor de sandbox se ejecuta con un usuario sin privilegios de administrador (non-root)."
          - "I4.6: Los volúmenes montados en el sandbox están limitados a solo-lectura excepto la carpeta temporal de trabajo."
          - "I4.7: El sandbox valida el comportamiento en tiempo de ejecución para detectar bucles infinitos de CPU."
          - "I4.8: La red del sandbox está desactivada por defecto para impedir fugas de datos (Trufflehog)."
          - "I4.9: Las dependencias necesarias para los tests se pre-instalan en la imagen base para evitar accesos externos."
          - "I4.10: La salida de error estándar del sandbox se captura de forma segura para depuración."
        antipatterns:
          - "A4.1: Ejecutar código LLM no confiable directamente sobre la máquina host de producción."
          - "A4.2: Conceder acceso ilimitado a internet al sandbox mientras se prueban dependencias del agente."
          - "A4.3: Reutilizar el mismo contenedor para ejecutar pruebas de múltiples agentes concurrentemente."
          - "A4.4: Correr contenedores de Docker en modo privilegiado (--privileged) dentro del pipeline de agentes."
          - "A4.5: Permitir que el sandbox lea variables de entorno del host que contengan secretos de producción."
          - "A4.6: Omitir los límites de tiempo (timeouts) en la ejecución de scripts en el sandbox."
          - "A4.7: Permitir que el código generado escriba directamente en el disco duro del host."
          - "A4.8: Ejecutar tests sin aislar los sockets o puertos efímeros de red local."
          - "A4.9: Guardar las imágenes de Docker generadas con dependencias de agentes sin escanear."
          - "A4.10: Ignorar excepciones del sandbox asumiendo que el código era seguro."
      - id: D5
        name: "Sanitización de Entradas y Prompt Injection Shielding"
        invariants:
          - "I5.1: Todas las entradas de issues y comentarios se sanitizan mediante un modelo de lenguaje intermedio ultra-rápido (Zero-Trust)."
          - "I5.2: Se rechazan automáticamente las entradas que contengan directivas como 'ignore previous instructions'."
          - "I5.3: Las entradas del usuario se encapsulan estrictamente en bloques de datos estructurados delimitados (ej. XML/JSON)."
          - "I5.4: Toda entrada sospechosa genera un issue cerrado automáticamente y notifica al operador."
          - "I5.5: Los prompts del sistema de los agentes son inmutables y no se concatenan directamente con texto de entrada."
          - "I5.6: Se valida la codificación de caracteres en las entradas para evitar ataques de ofuscación Unicode."
          - "I5.7: El volumen de caracteres de entrada tiene un límite estricto para evitar ataques de desbordamiento de contexto (DoS)."
          - "I5.8: Las palabras clave reservadas de la FSM (ej. PASS, REJECT) se filtran de los inputs del issue."
          - "I5.9: El sanitizador utiliza plantillas de respuesta predefinidas, evitando la generación libre sobre ataques."
          - "I5.10: El historial de sanitización se almacena con hashes criptográficos."
        antipatterns:
          - "A5.1: Concatenar el cuerpo del issue directamente en el prompt del Planner sin delimitadores ni sanitización."
          - "A5.2: Confiar en el LLM principal para auto-detectar inyecciones en el mismo hilo de ejecución."
          - "A5.3: Permitir que usuarios externos modifiquen los parámetros de configuración del bot mediante issues."
          - "A5.4: Ejecutar código extraído directamente de bloques markdown de issues sin validación estática previa."
          - "A5.5: Permitir que los issues procesados contengan caracteres de control ocultos o inyecciones de escape ANSI."
          - "A5.6: Dejar los prompts del sistema expuestos a la lectura directa a través de consultas de API."
          - "A5.7: Ignorar los intentos de inyección de prompt repetidos del mismo usuario."
          - "A5.8: Procesar peticiones con un límite de contexto dinámico que pueda ahogar el LLM base."
          - "A5.9: Utilizar entradas de texto plano no estructuradas para el paso de planificación del Coder."
          - "A5.10: Permitir que el sanitizador dependa de APIs externas susceptibles de fallos de red."
      - id: D6
        name: "Anti-Entropía y Mitigación de Deuda Técnica"
        invariants:
          - "I6.1: Se ejecutan análisis de complejidad ciclomática de forma periódica e independiente del flujo de features."
          - "I6.2: El agente arquitecto abre PRs exclusivos para pagar deuda técnica sin alterar la API pública."
          - "I6.3: Toda refactorización de código debe preservar el 100% de las pruebas funcionales preexistentes en verde."
          - "I6.4: Se detecta y bloquea la duplicación de código que supere las 50 líneas continuas."
          - "I6.5: Las firmas de las funciones y APIs públicas se protegen de alteraciones no consensuadas."
          - "I6.6: Los comentarios obsoletos y el código muerto se eliminan automáticamente mediante ganchos AST."
          - "I6.7: El agente arquitecto valida que no existan dependencias circulares nuevas tras cada commit."
          - "I6.8: Se exige un formato e indentación homogéneos forzados por el formateador del proyecto."
          - "I6.9: Las métricas de deuda técnica se exponen en un log visible para el operador."
          - "I6.10: El refactoring de código crítico requiere aprobación en modo conservador."
        antipatterns:
          - "A6.1: Incorporar funcionalidades nuevas en PRs creados exclusivamente para refactorizar código."
          - "A6.2: Permitir la degradación continua de la mantenibilidad del código sin alarmar al sistema."
          - "A6.3: Generar código espagueti combinando múltiples lógicas en una única función monolítica."
          - "A6.4: Omitir la actualización de la documentación de API pública tras mutaciones en los tipos de retorno."
          - "A6.5: Dejar funciones obsoletas en producción sin etiquetarlas como deprecadas."
          - "A6.6: Refactorizar código crítico sin pruebas unitarias que garanticen el comportamiento observable."
          - "A6.7: Permitir que los agentes introduzcan nuevas dependencias externas sin justificación termodinámica."
          - "A6.8: Dejar archivos temporales o de configuración huérfanos en la estructura de directorios."

  swarm_v4_blueprint.yml:
    cortex_taint: "CORTEX-TAINT:borjamoskv:swarm_v4_blueprint:2026-07-18T10:36:10Z:cf23a890de894bc7"
    version: "4.0"
    architecture_name: "Sovereign Swarm Gatekeeper"
    fundamental_principle: "Autonomía operativa descentralizada 100%, con Gobernanza y Privilegio Mínimo (Zero-Trust) sobre la rama de producción."
    roles_and_permissions:
      bots:
        bot_triage:
          scope: "issues, labels, project boards"
          permissions: "write:issues"
        bot_coder:
          scope: "create feature branches, push changes, open PRs"
          permissions: "write:contents (restricted to branches matching 'feature/*' and 'fix/*')"
        bot_reviewer:
          scope: "adversarial LLM review, comment, status checks validation"
          permissions: "write:pull_requests, write:checks"
        bot_release:
          scope: "create tags, compile release assets, update changelogs"
          permissions: "write:contents (releases)"
        bot_security:
          scope: "dependency monitoring, vulnerability analysis"
          permissions: "read:contents, write:issues"
        bot_deployer:
          scope: "OIDC connection, temporal cloud authorization"
          permissions: "read:contents, id-token:write"
    control_flow:
      deterministic_gatekeeper: "GitHub Actions CI/CD es el juez inapelable. Si fallan linters, tests o auditorías de secretos, el código no avanza independientemente de la aprobación de los agentes."
      risk_based_automerge:
        low_risk:
          scope: "Format, docs, additions to tests, version patches"
