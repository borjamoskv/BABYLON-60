[project]
name = "capabilityguard-comparison-env"
version = "1.0.0"
requires-python = "==3.14.7"
dependencies = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
