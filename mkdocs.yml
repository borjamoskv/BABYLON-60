# mkdocs.yml
site_name: BABYLON-60 | Sovereign Hardened AI Infrastructure
site_description: Causal-Determinist Kernel & WORM Forensic Quarantine for EU AI Act Compliance.
site_url: https://borjamoskv.github.io/BABYLON-60/
repo_url: https://github.com/borjamoskv/BABYLON-60
repo_name: borjamoskv/BABYLON-60

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Roboto
    code: Fira Code

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Architecture:
    - Specification: SPECIFICATION.md
    - Threat Model v4.0: 02_ontology/security_threat_model_v4.md
  - Enterprise:
    - Quickstart DevOps: 03_guides/QUICKSTART_ENTERPRISE.md
  - Compliance (EU AI Act):
    - Whitepaper: 04_research/eu_ai_act_compliance_whitepaper.md
    - Compliance Framework: 05_compliance_eu_ai_act.md
  - Theory & Axioms: 06_theory/00_index.md
