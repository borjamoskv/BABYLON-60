<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Firma MOSKV-1</title>
  <style>
    :root { color-scheme: light dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 4px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    article, #signature-status {
      --paper: light-dark(#fffefa, #1c211e); --text: light-dark(#24352b, #edf3ed);
      --muted: light-dark(#58685e, #b0beb3); --line: light-dark(#dce5db, #3d4a40);
      --accent: light-dark(#365d46, #bed5bd); --tint: light-dark(#edf3e9, #2a382d);
      margin: 0; color: var(--text); background: var(--paper); border: 1px solid var(--line);
      border-radius: 16px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
    #signature-status { padding: 20px; }
    p, dl, dd { margin: 0; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 18px; padding: 20px 22px; }
    .identity { display: flex; align-items: center; gap: 12px; }
    .mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: grid;
      place-items: center; font-size: 22px; color: var(--accent); background: var(--tint); }
    #signature-topology { font-size: 19px; font-weight: 500; letter-spacing: .025em; }
    .caption, #signature-effort { font-size: 12px; color: var(--muted); }
    .runtime { max-width: 320px; }
    #signature-model { font-weight: 500; }
    #signature-effort { margin-top: 4px; }
    #signature-context { margin: 0 22px; }
    .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px;
      padding: 12px 0; border-top: 1px solid var(--line); }
    .row dt { font-size: 12px; color: var(--muted); }
    details { margin: 0 22px; border-top: 1px solid var(--line); }
    summary { min-height: 44px; padding: 12px 0; width: fit-content; cursor: pointer;
      color: var(--accent); font-size: 12px; }
    summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    #signature-sources .row { font-size: 12px; }
    #signature-sources dd { color: var(--muted); }
    footer { padding: 0 22px 16px; font-size: 12px; color: var(--muted); }
    @media (max-width: 520px) {
      header { padding: 17px; gap: 14px; } .runtime { width: 100%; max-width: none; }
      #signature-context, details { margin-inline: 17px; }
      .row { grid-template-columns: 1fr; gap: 4px; } footer { padding-inline: 17px; }
    }
  </style>
</head>
<body>
  <p id="signature-status" role="status">Esperando los datos de esta respuesta…</p>
  <article id="signature-panel" aria-label="Firma de MOSKV-1" data-signature-version="2" hidden>
    <header>
      <div class="identity"><span class="mark" aria-hidden="true">≋</span><div>
        <div id="signature-topology" data-signature-field="TOPOLOGÍA ACTIVA"></div>
        <p class="caption">Hypervisor agéntico · Babylon</p>
      </div></div>
      <div class="runtime"><div id="signature-model" data-signature-field="LLM"></div>
        <p id="signature-effort" data-signature-field="MODO COGNITIVO" hidden></p>
      </div>
    </header>
    <dl id="signature-context"></dl>
    <details><summary>Fuentes y alcance</summary><dl id="signature-sources"></dl></details>
    <footer><p>Observado: <time id="signature-time"></time></p>
      <p>Procedencia declarada; no constituye atestación del runtime.</p></footer>
  </article>
  <script>
    "use strict";
    (() => {
      const PROTOCOL_VERSION = "2026-01-26";
      const INIT_ID = "moskv-signature-initialize";
      const panel = document.getElementById("signature-panel");
      const status = document.getElementById("signature-status");
      let initialized = false;
      let lastSize = "";
      let observer;
      const object = value => value !== null && typeof value === "object" && !Array.isArray(value);
      const text = value => typeof value === "string" && value.length > 0 && value.length <= 8192;
      const send = message => window.parent.postMessage({jsonrpc: "2.0", ...message}, "*");
      const notify = (method, params = {}) => send({method, params});
      function reportSize() {
        if (!initialized) return;
        const bounds = document.body.getBoundingClientRect();
        const width = Math.ceil(bounds.width), height = Math.ceil(bounds.height);
        const key = width + ":" + height;
        if (key !== lastSize) {
          lastSize = key;
          notify("ui/notifications/size-changed", {width, height});
        }
      }
      function fail(message) {
        panel.hidden = true;
        panel.removeAttribute("data-signature-observed-at");
        status.textContent = message;
        status.hidden = false;
        reportSize();
      }
      function applyContext(context) {
        if (object(context) && (context.theme === "light" || context.theme === "dark")) {
          document.documentElement.dataset.theme = context.theme;
        }
      }
      function row(label, value, field) {
        const entry = document.createElement("div"); entry.className = "row";
        const title = document.createElement("dt"); title.textContent = label;
        const body = document.createElement("dd"); body.textContent = value;
        if (field) body.setAttribute("data-signature-field", field);
        entry.append(title, body);
        return entry;
      }
      function render(signature) {
        if (!object(signature) || !object(signature.fields) || !object(signature.sources)
            || !text(signature.observed_at) || !Number.isFinite(Date.parse(signature.observed_at))) {
          fail("La firma recibida no contiene datos válidos y fecha de observación."); return;
        }
        const fields = signature.fields, sources = signature.sources;
        if (fields["TOPOLOGÍA ACTIVA"] !== "MOSKV-1" || !text(fields.LLM) || !text(sources.LLM)) {
          fail("La firma recibida no contiene identidad y fuente válidas."); return;
        }
        document.getElementById("signature-topology").textContent = fields["TOPOLOGÍA ACTIVA"];
        document.getElementById("signature-model").textContent = fields.LLM;
        const visible = ["LLM", "TOPOLOGÍA ACTIVA"];
        const effort = document.getElementById("signature-effort");
        effort.hidden = !text(fields["MODO COGNITIVO"]) || fields["MODO COGNITIVO"] === "No expuesto";
        effort.textContent = effort.hidden ? "" : fields["MODO COGNITIVO"];
        if (!effort.hidden) visible.push("MODO COGNITIVO");
        const context = document.getElementById("signature-context"); context.replaceChildren();
        for (const [field, label, absent] of [
          ["VERIFICACIÓN", "Verificación", null],
          ["CAMBIOS", "Cambios", null],
          ["LÍMITES", "Límites", null],
          ["RÉGIMEN TÉRMICO", "Estado térmico", "No medido"],
          ["EXERGÍA INFORMATIVA", "Índice léxico", "No medida"],
          ["MUTACIÓN CAUSAL", "Mutación", "Ninguna"],
        ]) {
          if (text(fields[field]) && fields[field] !== absent) {
            context.append(row(label, fields[field], field)); visible.push(field);
          }
        }
        const sourceList = document.getElementById("signature-sources"); sourceList.replaceChildren();
        for (const field of visible) {
          const source = row(field, text(sources[field]) ? sources[field] : "No expuesta");
          source.children[1].setAttribute("data-signature-source", field);
          sourceList.append(source);
        }
        const time = document.getElementById("signature-time");
        time.textContent = signature.observed_at; time.setAttribute("datetime", signature.observed_at);
        panel.setAttribute("data-signature-observed-at", signature.observed_at);
        status.hidden = true; panel.hidden = false; reportSize();
      }
      function receive(event) {
        if (event.source !== window.parent || !object(event.data) || event.data.jsonrpc !== "2.0") return;
        const message = event.data;
        if (!initialized && message.id === INIT_ID) {
          if (!object(message.result) || message.result.protocolVersion !== PROTOCOL_VERSION) {
            fail("Este anfitrión no ha completado la conexión del Panel MCP."); return;
          }
          initialized = true; applyContext(message.result.hostContext);
          notify("ui/notifications/initialized");
          if (typeof ResizeObserver !== "undefined") {
            observer = new ResizeObserver(reportSize); observer.observe(document.body);
          }
          reportSize(); return;
        }
        if (!initialized) return;
        if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
        if (message.method === "ui/notifications/tool-input" || message.method === "ui/notifications/tool-input-partial") {
          fail("Esperando los datos de esta respuesta…");
        }
        if (message.method === "ui/notifications/tool-result") {
          const params = message.params;
          if (!object(params) || params.isError || !object(params.structuredContent)) {
            fail("No se ha podido generar la firma. Consulta el resultado de la herramienta."); return;
          }
          if (["text", "markdown", "html", "json"].includes(params.structuredContent.selected_format)) {
            panel.hidden = true; panel.removeAttribute("data-signature-observed-at");
            status.hidden = true; reportSize(); return;
          }
          render(params.structuredContent.signature);
        }
        if (message.method === "ui/notifications/tool-cancelled") fail("Generación de firma cancelada.");
        if (message.method === "ping" && message.id !== undefined) send({id: message.id, result: {}});
        if (message.method === "ui/resource-teardown" && message.id !== undefined) {
          if (observer) observer.disconnect();
          send({id: message.id, result: {}});
          initialized = false; window.removeEventListener("message", receive);
        }
      }
      window.addEventListener("message", receive);
      send({id: INIT_ID, method: "ui/initialize", params: {
        appInfo: {name: "MOSKV-1 Response Signature", version: "1.0.0"},
        appCapabilities: {availableDisplayModes: ["inline"]}, protocolVersion: PROTOCOL_VERSION,
      }});
    })();
  </script>
</body>
</html>
